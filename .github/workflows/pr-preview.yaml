name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  # Never cancel a run between finding the comment and posting it, which could leave two comments.
  cancel-in-progress: false

jobs:
  pr-preview:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://raw.githack.com/${{ github.event.pull_request.head.repo.full_name }}/${{ github.event.pull_request.head.sha }}/index.html
      MARKER: <!-- pr-preview -->

    steps:
      - name: Show preview link in job summary
        run: |
          preview_link="[Open the page as this PR proposes it](${PREVIEW_URL}) (commit \`${HEAD_SHA:0:7}\`)"
          echo "PREVIEW_LINK=${preview_link}" >> "$GITHUB_ENV"
          echo "$preview_link" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          body="${MARKER}
          ${PREVIEW_LINK}"

          comment_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
          comment_id="${comment_ids%%$'\n'*}"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" --silent
          fi
