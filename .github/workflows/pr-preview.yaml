name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  # Never cancel a run between finding the comment and posting it, which could leave two comments.
  cancel-in-progress: false

jobs:
  pr-preview:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://raw.githack.com/${{ github.event.pull_request.head.repo.full_name }}/${{ github.event.pull_request.head.sha }}/index.html
      MARKER: <!-- pr-preview -->

    steps:
      - name: Build preview link and show it in job summary
        id: preview
        run: |
          preview_link="[Open the page as this PR proposes it](${PREVIEW_URL}) (commit \`${HEAD_SHA:0:7}\`)"
          echo "link=${preview_link}" >> "$GITHUB_OUTPUT"
          echo "$preview_link" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ovsds/create-or-update-unique-comment-action@2bb0d0b0a9efb193591288d8ac2e201cdda5c26b # v1.1.1
        with:
          issue-number: ${{ github.event.number }}
          unique-body-includes: ${{ env.MARKER }}
          body: |
            ${{ env.MARKER }}
            ${{ steps.preview.outputs.link }}
