rd to the one you need.", "Guide", "Runewords and their drop locations (Miothan)"], ["Sockets", "Buy more sockets as you become able to make runewords.", "Guide", "Gem Guide (Piwu)"], ["Starter word", "GOR + MU + HAS gives +200 HP, +1 portal kill and +10% all EXP. It is the cheapest runeword (all tier-1 runes): the Go to Act 2 Town quest gives all three runes, and spare GOR drops in Act 3 zones 1 to 4.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Ascending", "Players report that random ascension reaches legendary runes faster than saving for the guaranteed merge.", "Guide", "Гайды, Russian guide collection (Jivchik)"], ["Sockets", "You start with 6 sockets and 14 inventory slots; the gem shop sells 9 more sockets.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Order", "The order of tiers 3 to 7 is by where the runes drop, not from a guide.", "Estimate", "Runewords and their drop locations (Miothan)"], ["Portal kills", "Each +1 portal kill makes a kill count once more toward opening a zone portal.", "Game data", "Rune merging and runeword effect threads"], ["Moved drops", "RYS also drops from Act 3 Palm trees, as well as Act 2 Ironwood trees, and WOM also from Act 3 Sunstone ore, as well as Act 2 Thorium ore.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Rune merging and runeword effect threads"]]}, {"title": "Rune families", "cols": ["Tier 1 to 4", "Where the first rune drops", "Stat", "Value per tier"], "rows": [["NIL, DOT, WIR, GRO", "Act 2: Iceboar to Yeti", "Woodcutting power", "10, 18, 24, 30"], ["FUS, YIT, SKO, MIN", "Act 2: Ratatoskr to Troll", "Mining power", "10, 18, 24, 30"], ["MU, RO, FON, FAL", "Act 2: Penguin to Draugr; also Act 1 Hard/Nightmare bosses and the Go to Act 2 Town quest", "Gold", "1%, 2%, 4%, 5%"], ["HAS, OLU, SUR, TYR", "Act 2 bosses; Act 3 zones 5 to 8 (Fez to Beetleman); the Go to Act 2 Town quest", "All EXP", "1%, 2%, 4%, 5%"], ["RYS, LUM, ORT, VEX", "Act 2 Ironwood tree; Act 3 Palm tree", "Attack", "15, 27, 36, 45"], ["WOM, SIRC, APEX, BEB", "Act 2 Thorium ore; Act 3 Sunstone ore", "Crit damage", "5%, 9%, 12%, 15%"], ["KI, WER, ANG, YUR", "Act 1 Hard Mode monsters", "Physical defence", "4, 8, 16, 20"], ["GOR, BOL, TES, WAR", "Act 3: Sun Boy to Kangaroo; the Go to Act 2 Town quest", "HP", "22, 44, 88, 110"], ["PRE", "Gem shop", "Magic Find, offline, attack", "+2, +2%, +30 each"]]}], "icon": 186}, {"name": "Engineer", "tiers": [{"req": "Engineer unlocked (a character at level 40) and Idea production sped up: its Gold Upgrade at 5 or more, plus the first item, wood and ore upgrades.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Blueprint unlocked (1,000 Idea), with Idea still showing a positive rate.", "basis": "Guide", "source": "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Hunter Tax Returns (Idea) at 5: a 25% chance to get half the materials back on each Hunter level (37,200 Idea in total).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "Hunter Tax Returns (Blueprint) at 5, making the chance 50% (6,200 Blueprint), with Daily Activity Enhancer I bought and Runic Blueprint unlocked (600 Blueprint).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 1 Engineer Priority Guide (Games Finder)"}, {"req": "More Materials (Blueprint) at 10, Achievement Hunter at 10, Faster Portals bought and Smelting Patterns at 20.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Runic Blueprint running: Humble Sacrifices at 5, Vendor Stock (Runic) at 3 and Bonfire Prototyping at 20.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "More Hunting (Blueprint) at 5 and More Materials (Runic Blueprint) at 10.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "More Hunting and More Sacrifices (Runic Blueprint) at 5 each, and Sun Scroll unlocked (6,000 Runic Blueprint).", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "Sun Scroll: Double Crit, 4 Star Cards, More Materials at 10, and Infinite II Armor and Infinite II Weapons bought.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sun Scroll: More Hunting and More Sacrifices at 5 each, which completes +15 Hunter cap and +10 sacrifice cap from the Engineer.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Engineer rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Idea first", "Every other resource consumes Idea. Keep it your most-crafted resource or you hit constant bottlenecks.", "Guide", "Engineer (Johnny Treeman)"], ["Base rates", "With no upgrades Idea makes 720 an hour, while Blueprint and Runic Blueprint together use 1,067. Sun Scroll uses 25.5 Blueprint and 18.2 Runic Blueprint an hour against 20 and 6.7 made. So nothing above Idea runs nonstop until the slots below it are sped up.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Ratio to aim for", "For Sun Scroll to run nonstop, the slots below must be faster than it by about these factors: Runic Blueprint 2.7 times, Blueprint 2.2 times, Idea 3.6 times. The wiki's efficiency calculator works this out for your own numbers.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineering Everything in one place: cost tables and efficiency calculator (Toxic)"], ["Speeding a slot", "Each slot has four speed upgrades. Gold Upgrade gives +20% a level and doubles in price each level (from 1,000 gold for Idea, 30,000 for Blueprint, 100,000 for Runic Blueprint, 300,000 for Sun Scroll). The item, wood and ore upgrades give +5% a level and rotate through materials of that slot's act.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"], ["Slot materials", "Idea and Blueprint use Act 1 materials (Blueprint wants Pyrewood Log and Iron Ore), Runic Blueprint uses Act 2 monster drops, Ironwood Log and Thorium Ore, and Sun Scroll uses Act 3 drops, Palm Tree Log and Sunstone Ore.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Gem slots", "Each Engineer Slot Upgrade doubles one resource's generation: Idea, then Blueprint, Runic Blueprint, Sun Scroll (150, 250, 350, 500 gems).", "Guide", "Gem Guide (Piwu); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Bottlenecks", "A red, negative rate means a resource is consumed faster than it is made. Pause the consumer: select it and press the pause button beside the main image.", "Guide", "Engineer (Johnny Treeman)"], ["Hunter Tax Returns", "Each level adds a 5% chance that a Hunter level refunds half its materials. Ten levels (Idea and Blueprint) make it a 50% chance, about a quarter off Hunter costs on average. Humble Sacrifices does the same for sacrifices, up to 25%.", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["More Materials", "Adds combat multiloot, which raises the ordinary drop every monster gives, including Hunter and sacrifice materials. It is in three tiers (10 levels each), so it is the Engineer's main help for material farming.", "Game data", "Engineer (Johnny Treeman); Гайды, Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Vendor Stock", "The Idea and Blueprint versions raise the Act 1 vendor's daily stock; the Runic Blueprint one raises the Act 2 vendor's (more Crystallized Yellow Substance a day); the Sun Scroll one raises Act 3's.", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Keys", "Each Daily Activity Enhancer adds 1 key for finishing the daily quests, and each keyring level raises the key cap by 1 (5 levels in each of three tiers).", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Remote upgrades", "Remote Engineering (6,000 Blueprint) lets slot upgrades take materials from the stash; Remote Crafting, Remote Hunting and Remote Sacrificing do the same for those systems.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Open-ended upgrades", "Smelting Patterns (+6% smeltery speed a level) and Combat Experience (+1%) cost 276 Blueprint for 20 levels, 748 for 30 and 4,472 for 50. Bonfire Prototyping (+1% ash chance) and Pet Training (+2% pet XP) cost 215 Runic Blueprint for 20, 558 for 30 and 2,871 for 50. All go to 200.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Double Crit", "Crit chance above 100% becomes a chance of a double crit (130% is a 30% chance). There are no triple crits, so nothing past 200% helps.", "Game data", "Гайды, Russian guide collection (Jivchik); Engineer (Johnny Treeman)"], ["Balance", "Unlock everything, but do not neglect Hunter and sacrifices meanwhile.", "Guide", "Gem Guide (Piwu)"]]}, {"title": "Production chain", "cols": ["Resource", "Time per unit", "Consumes", "Base per hour"], "rows": [["Idea", "5 seconds", "Nothing", "720"], ["Blueprint", "3 minutes", "30 Idea", "20"], ["Runic Blueprint", "9 minutes", "70 Idea + 1 Blueprint", "6.7"], ["Sun Scroll", "33 minutes", "14 Blueprint + 10 Runic Blueprint", "1.8"]]}, {"title": "Engineer upgrades", "cols": ["Resource", "Upgrade", "Levels and total cost", "Effect"], "rows": [["Idea", "Hunter Tax Returns", "5 levels, 37,200", "+5% chance a level to refund half a Hunter level's materials"], ["Idea", "Vendor Stock", "3 levels, 11,200", "+1 Act 1 vendor stock a level"], ["Idea", "Mining Industries, Johnny Treeman", "To 200; 20 levels cost 5,739", "+1% mining or woodcutting XP a level"], ["Idea", "Blueprint", "1,000", "Unlocks Blueprint production"], ["Blueprint", "Hunter Tax Returns", "5 levels, 6,200", "+5% refund chance a level"], ["Blueprint", "More Materials", "10 levels, 10,382", "+1 combat multiloot a level"], ["Blueprint", "Achievement Hunter", "10 levels, 10,382", "Achievements grant Drop Quantity"], ["Blueprint", "More Hunting", "5 levels, 10,550", "+1 Hunter cap a level"], ["Blueprint", "Faster Portals", "1,800", "+1 portal kill"], ["Blueprint", "Daily Activity Enhancer I", "200", "+1 key from daily quests"], ["Blueprint", "Basic Keyring", "5 levels, 2,638", "+1 key cap a level"], ["Blueprint", "Vendor Stock", "3 levels, 2,800", "+1 Act 1 vendor stock a level"], ["Blueprint", "Smelting Patterns, Combat Experience", "To 200; 20 levels cost 276", "+6% smeltery speed or +1% combat XP a level"], ["Blueprint", "Remote Engineering", "6,000", "Slot upgrades can use the stash"], ["Blueprint", "Runic Blueprint", "600", "Unlocks Runic Blueprint production"], ["Runic Blueprint", "Humble Sacrifices", "5 levels, 6,200", "+5% chance a level to refund half a sacrifice's materials"], ["Runic Blueprint", "More Materials", "10 levels, 10,382", "+1 combat multiloot a level"], ["Runic Blueprint", "More Hunting", "5 levels, 13,188", "+1 Hunter cap a level"], ["Runic Blueprint", "More Sacrifices", "5 levels, 13,188", "+1 sacrifice cap a level"], ["Runic Blueprint", "Vendor Stock", "3 levels, 2,800", "+1 Act 2 vendor stock a level"], ["Runic Blueprint", "Slime Feeding (four kinds)", "400 each", "+30%, +50%, +70%, +100% food points from each Slyme rarity"], ["Runic Blueprint", "Faster Hatching", "4 levels, 6,000", "-0.5 egg cooldown a level"], ["Runic Blueprint", "Rune Stacking", "3 levels, 17,000", "Rune stack size 100, 400, 900"], ["Runic Blueprint", "Daily Activity Enhancer II, Advanced Keyring", "200 and 2,638", "+1 daily key; +1 key cap a level"], ["Runic Blueprint", "Bonfire Prototyping, Pet Training", "To 200; 20 levels cost 215", "+1% ash chance or +2% pet XP a level"], ["Runic Blueprint", "Remote Crafting", "5,000", "Crafting can use the stash"], ["Runic Blueprint", "Sun Scroll", "6,000", "Unlocks Sun Scroll production"], ["Sun Scroll", "Double Crit", "120", "Crit chance above 100% can double crit"], ["Sun Scroll", "4 Star Cards", "400", "Cards can reach 4 stars"], ["Sun Scroll", "Infinite II Armor, Infinite II Weapons", "400 and 600", "Unlock the Infinite 2 recipes"], ["Sun Scroll", "More Materials", "10 levels, 3,115", "+1 combat multiloot a level"], ["Sun Scroll", "More Hunting", "5 levels, 3,956", "+1 Hunter cap a level"], ["Sun Scroll", "More Sacrifices", "5 levels, 3,956", "+1 sacrifice cap a level"], ["Sun Scroll", "Remote Hunting, Remote Sacrificing", "600 each", "Hunter and sacrifices can use the stash"], ["Sun Scroll", "Faster Hatching", "4 levels, 1,800", "-0.5 egg cooldown a level"], ["Sun Scroll", "Daily Activity Enhancer III, Master Keyring, Vendor Stock", "60, 792 and 840", "+1 daily key; +1 key cap a level; Act 3 vendor stock"], ["Sun Scroll", "Gold Research", "To 200; 20 levels cost 210", "+1% gold a level"]]}], "icon": 57}, {"name": "Curio", "tiers": [{"req": "Curio system opened in the Act 3 town and all 5 active slots filled.", "basis": "Guide", "source": "Curio System (Johnny Treeman); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Daily Fate Spiral bought, for one free chest a day.", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "A few extra inventory slots bought (21 are needed to hold all 20 curios plus a spare).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "100 chests opened and the pity legendary claimed.", "basis": "Game data", "source": "Curio System (Johnny Treeman); Evitania Online: Idle RPG spreadsheet, Upgrades tab (Zerozapper)"}, {"req": "Active set matched to what you are doing: crit curios for pushing, defence for offline, woodcutting or mining for gathering.", "basis": "Guide", "source": "Curio System (Johnny Treeman)"}, {"req": "Active curios at level 30.", "basis": "Estimate", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Active curios at level 50 with their ascension tiers maxed.", "basis": "Estimate", "source": "Curio System (Johnny Treeman)"}], "tables": [{"title": "Curio rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Chests", "Each Fate Spiral lets you pick one of three curios. They come from the daily upgrade, 80 gems each, achievements and logins.", "Game data", "Curio System (Johnny Treeman)"], ["Coins", "Active curios earn coins up to a cap, so collect often. Coins level curios; salvaging unwanted curios gives more.", "Game data", "Curio System (Johnny Treeman)"], ["Ascension", "One duplicate raises a curio's tier by one, adding passives.", "Game data", "Curio System (Johnny Treeman)"], ["Wish", "Since 0.323.0 you can wish for one Legendary curio: if a Legendary drop misses it, the next Legendary is the wished one. Spare Legendaries trade back for rolls, and chests can auto-open until a chosen rarity drops.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Presets", "Curio and rune layouts can be saved as presets (six pages each) that switch with your activity. Unlocks at combat level 70.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Universal", "Curios are an Act 3 system, but their stats apply everywhere.", "Game data", "Curio System (Johnny Treeman)"], ["Daily Fate Spiral", "900 gems, one roll a day for good. Each roll shows three curios and you keep one.", "Game data", "Curio list, coin cap and Fate Spiral threads; Gem Guide (Piwu)"], ["Pity", "The 100th roll without a Legendary gives one.", "Game data", "Curio list, coin cap and Fate Spiral threads"], ["Coin Cap", "Each rank adds 500 to the cap and costs 450, 500, 550, 600 then 650 gems. Leave it until the other gem upgrades are bought.", "Guide", "Curio list, coin cap and Fate Spiral threads"]]}, {"title": "Curio rarities", "cols": ["Rarity", "Coins to max (level 50)", "Drop rate", "Coins per hour and max tier"], "rows": [["White", 49200, "45%", "3-6 an hour; tier 3"], ["Green", 53440, "34%", "8-11 an hour; tier 3"], ["Blue", 57680, "19%", "14-20 an hour; tier 6"], ["Purple", 68420, "1.6%", "21-30 an hour; tier 9"], ["Gold", 77400, "0.4%", "31-40 an hour; tier 9"]]}, {"title": "Curio types", "cols": ["Type", "Curios, lowest to highest rarity", "Best for", "Tier bonuses (1-3, 4-6, 7-9)"], "rows": [["EXP", "Ever Eclipsed Sun (gold only)", "Everything", "Mining EXP, woodcutting EXP, combat EXP"], ["Crit", "Pandemonium Egg, Shattered Vow", "Pushing and online grinding", "Portal kills, attack speed, crit chance"], ["Gold", "Century Tome, Crystal Cranium, Necromancer's Hand", "Online item grinding", "Drop Quantity, mob spawn time, move speed"], ["Defence", "Ceremonial Dagger, Entomed Mask, Cup of Indulgence, Jade Scarab", "Offline content", "Offline gains, combat offline gains, magic defence"], ["Woodcutting", "Fifth Slab, Urn Flask, Swirling Tear, Servant's Idol, Blooming Desert", "Woodcutting", "Offline gains, multiloot, speed"], ["Mining", "Elden Monolith, Sected Bypiramid, Worm's Horn, Ichored Specimen, Wyrd Goblet", "Mining", "Offline gains, multiloot, speed"]]}, {"title": "Curio stats by rarity", "cols": ["Rarity", "Attack, level 1 to 50", "Second stat, level 1 to 50", "Coins per hour at tier 0"], "rows": [["White", "x1.06 to x1.12", "Mining or woodcutting power x1.2 to x1.8", 2], ["Green", "x1.075 to x1.15", "Power x1.24 to x1.96; physical defence x1.15 to x1.45", 7], ["Blue", "x1.1 to x1.2", "Power x1.3 to x2.2; defence x1.19 to x1.57; gold 19% to 57%", 13], ["Purple", "x1.125 to x1.25", "Power x1.4 to x2.6; defence x1.24 to x1.72; gold or crit damage 24% to 72%", 20], ["Gold", "x1.15 to x1.3", "Power x1.5 to x3.0; defence x1.3 to x1.9; gold or crit damage 30% to 90%; all EXP 50% to 200%", 30]]}, {"title": "Curio ascension bonuses", "cols": ["Type", "Tiers 1-3, each", "Tiers 4-6, each", "Tiers 7-9, each"], "rows": [["Crit", "+1 portal kill", "+2% attack speed", "+3% crit chance"], ["Gold", "+5 Drop Quantity", "-1% mob spawn time", "+3% move speed"], ["Defence", "+1% offline gains", "+1% combat offline gains", "x0.03 magic defence"], ["Mining, woodcutting", "+1% offline gains for that skill", "+5 multiloot", "+3% speed"], ["EXP", "+10% mining EXP", "+10% woodcutting EXP", "+10% combat EXP"], ["Every curio", "+1 coin an hour per tier", "", ""]]}], "icon": 206}, {"name": "Hourglass", "tiers": [{"req": "Hourglass started in Act 3 and every generator before Liquid Glass at level 50.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia)"}, {"req": "Liquid Glass, Limestone Mass, Pristine Glass, Cromlech Bricks and Condensed Vortex at level 100, in that order.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia)"}, {"req": "Hourglass level 2 (100b sand): upgrades open, tier-one upgrades complete.", "basis": "Guide", "source": "Hourglass of Eternity Progressive Guide (Piwu); Infinite Hourglass Guide, quick and dirty (Imenia)"}, {"req": "Hourglass level 3 (100Qa sand): Timeline open. Reset at once and spend the first 10 infinity on three upgrades.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia); Hourglass of Eternity Progressive Guide (Piwu)"}, {"req": "Hourglass level 5: Rifts open, which outpace engine gains.", "basis": "Game data", "source": "Gem Guide (Piwu)"}, {"req": "Hourglass level 7: Echo, Dragons, Rebirth and Secret Knowledge open, and with them Restoration of Eternity (three more tabs, 15 new generators, new rifts and gem-shop items; added in 0.320.0).", "basis": "Game data", "source": "Hourglasses Guide (EvitaniaOnlineDB); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"}, {"req": "Upgrade tier 11 reached (needs the Golden Claw generator).", "basis": "Game data", "source": "Hourglass of Eternity Progressive Guide (Piwu); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"}], "tables": [{"title": "Hourglass rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Generators", "Each newer generator makes the older ones obsolete; put sand into the latest. Generator speed doubles at levels 25, 50, 100, 200, 300 and so on.", "Guide", "Hourglass of Eternity Progressive Guide (Piwu)"], ["Generator order", "Sandstone Sample, Glass Sample, Water Sample, Clay Block, Bit of Knowledge, Liquid Glass, Limestone Mass, Pristine Glass, Cromlech Bricks, Condensed Vortex, Sol Essence, Locked Orery, Golden Bit, Golden Scales, Golden Claw.", "Game data", "Hourglass of Eternity Progressive Guide (Piwu)"], ["Upgrades", "Buy and max every upgrade in a tier before the next. A timeline reset also resets upgrades. Timeline engine gains matter most.", "Guide", "Hourglass of Eternity Progressive Guide (Piwu)"], ["Gems", "Generator Speed first; until Hourglass level 3 it is the only gem upgrade that does anything. Then Timeline Engine, Awakening Amplifier, Rift Worker.", "Guide", "Infinite Hourglass Guide, quick and dirty (Imenia); Hourglass of Eternity Progressive Guide (Piwu)"], ["Cards", "The Bandiff card multiplies sand generation and the Beetleman card the timeline engine.", "Game data", "Hourglass of Eternity Progressive Guide (Piwu)"], ["Act 3 hourglasses", "Time-skip hourglass items cannot be used in Act 3 until its final boss exists and is beaten.", "Game data", "Frequently Asked Questions (Johnny Treeman)"], ["Level costs", "EvitaniaOnlineDB lists sand for levels 2 to 8 as 1e9, 1e15, 1e24, 1e36, 1e51, 1e74 and 1e120. Piwu's guide gives 100b and 100Qa for levels 2 and 3, so check the in-game figure.", "Game data", "Hourglasses Guide (EvitaniaOnlineDB); Hourglass of Eternity Progressive Guide (Piwu)"], ["Pace", "Level 4 is the last cheap step: level 5 costs twelve orders of magnitude more. Go past 4 only with spare sand.", "Guide", "Hourglasses Guide (EvitaniaOnlineDB)"], ["Time-skip items", "A time-skip hourglass advances only the active character: combat, mining, woodcutting and ash per kill. It does not advance other characters, the Smeltery, Bonfire ash from fuel, the pet egg or curio coins. Boss chests hold one 1 time in 10.", "Game data", "Hourglasses Guide (EvitaniaOnlineDB)"], ["Talents", "From levels 12 and 16 the Hourglass talents also cost Act 3 wood and ore: about 280k wood and 550k ore to reach level 70 (a 700% bonus). Buy diamond upgrades top to bottom, left to right.", "Guide", "Hourglass talents thread"], ["Level 7", "Rebirth rolls one Timeline Output or Sand item every 2 hours; 3 merge into 1 of the next tier (5 into 2 with the upgrade), in 9 slots that grow to 25. Secret Knowledge has up to 6 pages of up to 6 slots, and only the active page counts.", "Game data", "Hourglasses Guide (EvitaniaOnlineDB)"]]}], "icon": 236}, {"name": "Characters", "tiers": [{"req": "First character is a Warrior with its class skills (green nodes) unlocked first.", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB); Warrior Talent Guide (Piwu); Frequently Asked Questions (Johnny Treeman)"}, {"req": "Second character made. The main pushes; the alt farms lower zones for cards, materials, gold and Hunter levels.", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Third slot used (opens after Yrsainir). The roster has at least one Warrior and one Rogue.", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman)"}, {"req": "Fourth slot used (opens at the Watches zone in Act 2).", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Fifth slot used (opens on killing Maevath, since 0.321.0).", "basis": "Game data", "source": "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"}, {"req": "Rune and curio presets set up for mobs, bosses, mining and woodcutting on every character (unlocks at combat level 70).", "basis": "Guide", "source": "Presets Quick Guide (Tidds); #patch-notes 0.319.4 to 0.323.1 (neype, developer); Гайды, Russian guide collection (Jivchik)"}, {"req": "Nightmare respec done: EXP and Drop Quantity talents swapped for attack speed, crit rate and crit damage.", "basis": "Guide", "source": "Warrior Talent Guide (Piwu)"}], "tables": [{"title": "Character rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Warrior talents", "Improved Cleave, then Last Stand, then the middle path for Blade Strike and Dragon Soul, then the second Improved Cleave.", "Guide", "Warrior Talent Guide (Piwu)"], ["Crit first", "Take crit rate and crit damage over Magic Find and EXP until about level 70; more kills an hour beats those nodes.", "Guide", "Warrior Talent Guide (Piwu)"], ["Skip", "Skip the Warrior's +5 HP / +1% damage node at the end; HP is of little use. Take crit damage.", "Guide", "Warrior Talent Guide (Piwu)"], ["Boss readiness check", "Kills per hour is a result of the other systems, not a task. The Act 2 guide uses it as a check before each boss, measured on your main in the zone that holds the boss portal: about 500 in the Yeti zone before Ice Mammoth, about 1,000 in the Troll zone before Jotunn, and above 1,000 again in the Draugr zone (in thorium, about 1,300 physical defence) before Maevath. Under the mark, raise Hunter trainings and sacrifices first.", "Guide", "Act 2 progression (MountTai)"], ["Jotunn fight", "Troll map, the red portal. Adds first: after the first hand falls he summons monsters that explode, for over 3,000 damage in Steam reports and potentially an instant kill in EvitaniaOnlineDB's boss guide, so kill each one before anything else. Then the eye beam: when the eyes glow, sprint from under the hand to the far side of the map, starting near the screen edge, and take at most one tick (EvitaniaOnlineDB); if you are caught, Steam players say you should survive 4 to 5 beams. Then the hand waits: stand under a hand to bait a punch, step out as it lands and hit the hand (the Discord guide). Hand drops are random, so the fight is long and mostly waiting, about 10 minutes with 12 beams and over 20 slaps, and a Mage's lightning can hit the body instead of the hand (Steam). Once both hands are gone his HP drains by itself. Go behind the hand for the side slap and leave the middle for the ice breath (the Discord guide).", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB); jotun (Steam discussion); Boss fights - pure RNG (Jotun...) (Steam discussion); Jotunn (Steam discussion, with developer neype); How to kill Jotunn (DiskEntrega); Act 2 progression (MountTai); Frequently Asked Questions (Johnny Treeman)"], ["Mammoth Ring", "Disputed. One player in the Discord guide reports the Mammoth Ring (+100 magic defence) cut Jotunn's eye beam from over 600 a hit to about 100, but a Steam player thinks the beam scales with physical defence, and EvitaniaOnlineDB lists the ring's magic defence as +10. The ring's attack speed and crit damage hold either way.", "Player report", "How to kill Jotunn (DiskEntrega); jotun (Steam discussion); Gear database (EvitaniaOnlineDB)"], ["Shared progress", "Hunter, sacrifices, cards, Curio and the stash are account-wide; levels and talents are per character.", "Game data", "Guides & Tips (EvitaniaOnlineDB)"], ["Lone Wolf", "Unlocked by killing the Act 1 last boss. Since 0.321.0 it gives +50 Drop Quantity and +50% EXP and gold for giving up the other slots. Alts are still stronger, so it is optional.", "Guide", "Frequently Asked Questions (Johnny Treeman); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Class by stage", "No class is best all game. Warrior is easiest early and online but is the only class with a move-speed penalty in the offline formula; Rogue is the best offline farmer until Hunter and sacrifices are high; Mage is best online and offline once you farm at the kill cap.", "Guide", "Гайды, Russian guide collection (Jivchik)"], ["Attributes", "STR, DEX and INT each give +10% attack to their class. CON gives +5% HP and +1% HP regen; MEN gives +5% MP, +1% MP regen and +5% magic defence.", "Game data", "Гайды, Russian guide collection (Jivchik)"], ["Stat maths", "Final stat = sum of flat x sum of percent x product of multipliers, so true multipliers (x1.5) are worth the most late.", "Game data", "Гайды, Russian guide collection (Jivchik); #faq channel (neype, developer)"], ["Level unlocks", "Tower at level 25, Engineer at 40, event dungeons and the Halloween quest chain at 50, guilds at 60 (registered account), presets at 70 and Act 2 Hard at combat level 80.", "Game data", "Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper); #patch-notes 0.319.4 to 0.323.1 (neype, developer); Evitania Online news and update notes (Steam store)"], ["Defence check", "A monster's hit falls to chip damage of 0 once your Defence is at or above its Attack. Compare with the monster tables below.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Bringer of Death fight", "Step back 3-4 steps from the frontal leap. In the poison gas, leave the marked zone and kill the flower shooters in the corners.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["The Crab fight", "Back away from the chomp, then return. Keep walking to break the root. Below 30% HP its armour and shield counterattacks are gone.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Yrsainir fight", "Wait until he lands, then stand inside him under the chin: hits drop from 200-400 to about 99 and the sweep and breath miss. When he flies, go to the stairs and climb once the flames are out. Iron gear is enough.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Ice Mammoth fight", "Stay on the hitbox for the flame stamp. Run back or sideways when it rears up. Break one ground crystal to stun the stampede, and use an active ice crystal to interrupt the howl. The frontal stomp and an unstunned stampede can kill outright.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Maevath fight", "Stand close to dodge the claws and breath cone; when he inhales, run to the far left or right. When he flies, kill the Draugrs quickly so the stairs appear, or he stays airborne and the lower floor fills with flames. In stage 2 use the green safe zone and kill adds fast. Keep potions for the last phase.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Zhai Halud's Gate fight", "Step out of the tentacle slam and return. When the worm comes swirling from the right, run to the left corner. It spawns mini worms underground: kill them all, go back up on the left side, and repeat.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Hard mode", "The Obelisk's Hard difficulty multiplies base material drops by 16. Act 1 Hard has no listed requirement.", "Game data", "Obelisk (EvitaniaOnlineDB)"]]}, {"title": "Classes", "cols": ["Class", "Notes", "Role", "Best maps"], "rows": [["Warrior", "The usual first character and the easiest talent tree. Class resources unlock in the order Warrior, Archer, Mage.", "First character, main pusher", "Flat single-platform maps"], ["Rogue", "Good late game. No bonus EXP nodes, so slower to level, but more Drop Quantity than a Warrior.", "Farmer, woodcutter", "Tight maps with 1-2 platforms"], ["Mage", "Area attacks; unlock class skills first, including the 100% crit skill.", "Later character", "Maps with 3 or more spawn platforms, such as Crabs"]]}, {"title": "Bosses", "cols": ["Boss", "Where", "HP", "Attack"], "rows": [["Bringer of Death", "Act 1, Plant zone", "3K", "26"], ["The Crab", "Act 1, Crab zone", "80K", "175"], ["Yrsainir", "Act 1 final boss, Fire Elemental zone", "400K in the spreadsheet, 800K on EvitaniaOnlineDB", "350"], ["Ice Mammoth", "Act 2, Yeti zone", "840K in the spreadsheet, 2.4M on EvitaniaOnlineDB", "700"], ["Jotunn", "Act 2, Troll zone", "4.8M", "900"], ["Maevath", "Act 2 final boss, Draugr zone", "50M", "1,900"], ["Zhai Halud's Gate", "Act 3", "400M", "5,000"], ["Choissiadyr", "Act 3, second boss", "3.15B", "5,000"], ["Hard Act 1 bosses", "Monsters there have 3M HP and 1.4K attack", "100M", "2,000"], ["Hard Act 2 bosses", "Monsters there have 25M HP and 3K attack", "1.25B", "4,500"], ["Nightmare", "Monsters only so far", "300M in Act 1; Act 2 is 450M on the wiki, 2.5B on EvitaniaOnlineDB", "4,100 and 5,100"]]}, {"title": "Monsters by zone", "cols": ["Zone", "Monster", "HP", "Attack"], "rows": [["Act 1, 1", "Boar", "3", 0], ["Act 1, 2", "Wasp", "6", 1], ["Act 1, 3", "Pebble", "21", 1], ["Act 1, 4", "Stump", "40", 10], ["Act 1, 5", "Plant", "80", 13], ["Act 1, 6", "Wolf", "480", 25], ["Act 1, 7", "Gnoll", "1,000", 35], ["Act 1, 8", "Animated Armor", "2,000", 100], ["Act 1, 9", "Crab", "4,000", 140], ["Act 1, 10", "Bat", "7,000", 85], ["Act 1, 11", "Kobold", "9,000", 95], ["Act 1, 12", "Weird Book", "12,000", 95], ["Act 1, 13", "Slime Cube", "15,000", 105], ["Act 1, 14", "Fire Elemental", "20,000", 115], ["Act 2, 1", "Iceboar", "40,000", 200], ["Act 2, 2", "Helmet", "80,000", 200], ["Act 2, 3", "Ghost", "140,000", 200], ["Act 2, 4", "Yeti", "240,000", 262], ["Act 2, 5", "Ratatoskr", "320,000", 277], ["Act 2, 6", "Watch", "382,000", 327], ["Act 2, 7", "Snowman", "456,000", 365], ["Act 2, 8", "Troll", "567,000", 438], ["Act 2, 9", "Penguin", "624,000", 600], ["Act 2, 10", "Glass", "686,000", 800], ["Act 2, 11", "Matryoshka", "755,000", "1,000"], ["Act 2, 12", "Draugr", "831,000", "1,200"], ["Act 3, 1", "Sun Boy", "1.5M", "1,500"], ["Act 3, 2", "Dung Beetle", "2.5M", "1,700"], ["Act 3, 3", "Cactus Mommy", "4.5M", "1,900"], ["Act 3, 4", "Kangaroo", "6.5M", "2,200"], ["Act 3, 5", "Fez", "11.5M", "2,500"], ["Act 3, 6", "Winged Serpent", "15.8M", "2,700"], ["Act 3, 7", "Bandiff", "22.3M", "2,900"], ["Act 3, 8", "Beetleman", "31.5M", ""]]}], "icon": 383}, {"name": "Trinkets", "tiers": [{"req": "An event dungeon cleared at a tier your attack allows, and a first trinket equipped.", "basis": "Estimate", "source": "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"}, {"req": "A trinket on each character you play with the main stat its role wants (Trinket by role): ATK on the pusher, All EXP on farmers and the leveller, mining or woodcutting power on a gatherer.", "basis": "Guide", "source": "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"}, {"req": "Main trinket levelled with Upgrade Flasks to its maximum.", "basis": "Estimate", "source": "Trinkets sub stats (AlexG); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"}, {"req": "A max-level Legendary trinket reforged with the two stats you want guaranteed.", "basis": "Estimate", "source": "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"}], "tables": [{"title": "Trinket rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["What they are", "Added in 0.321.0: an item for the one trinket slot, with a main stat and up to four sub-stats. Trinkets drop only while an event runs, from every tier of its dungeons, with a bonus for running solo. The event shop, monthly and login rewards have none, so they can be missed between events.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Dungeon gates", "Dungeon tiers are gated by attack; the top tier needs 10M since 0.323.1, and zone-bound bonuses such as the Bonfire's heated-zone attack no longer count.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Main stats", "HP, ATK, Gold %, All EXP %, mining power or woodcutting power. Each event has four pieces of rising size, and the main stat's size follows the piece and its level (Trinket pieces). All EXP also covers mining and woodcutting XP. The main stat cannot be rerolled.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys)"], ["Same trinket, different values", "Two trinkets with the same stat but different values are different pieces or levels. Bountiful Tusk, Generous Cornucopia and Plentiful Bihorn start at 20, 30 and 40 mining power and gain with level, so a level 5 Cornucopia shows 40. Keep the largest piece for each stat and feed the rest into it.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Sub-stats", "There are 12: Offline Gains %, Drop Quantity, crit chance, crit damage, MEN, CON, STR, DEX, INT, HP %, mining power % and woodcutting power %. Only some roll active (white): 0-1 / 1-2 / 2-3 / 3-4 on a Black Candle / Candlestick / Candelabra / Luminor and their Harvest sizes; the rest are greyed. A sub-stat starts at its base, on a Luminor +1% Offline Gains or +2 Drop Quantity, and every third trinket level one random sub-stat, possibly a greyed one, gains a step; reaching a Luminor's maximum can take all five of its steps on one sub-stat (see Luminor maxima). Which ones to want depends on the role: see Trinket by role.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys); Trinkets sub stats (AlexG)"], ["Luminor maxima", "Community tables disagree: Drop Quantity 10-12 at max, crit damage 35% to 40%, STR, DEX or INT 20 to 25 (AlexG: 10, 40%, 25; Stratasys: 12, 35%, 20). Neither is game data.", "Player report", "Luminor Base/Max stats (Stratasys); Trinkets sub stats (AlexG)"], ["Swapping", "There is one trinket slot, and presets switch runes and curios but not trinkets. Put the ATK or HP trinket on by hand for bosses, the tower and dungeons, and the farming one back on before you park the character.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Levelling", "An Upgrade Flask is 10 XP; other trinkets can be fed in too, a Black Candle / Candlestick / Candelabra / Luminor size giving 120 / 200 / 400 / 600 XP. Flasks are spent first. Disassembling gives 12 / 20 / 40 / 60 flasks for those sizes, and returns the material spent on levelling minus 20%.", "Game data", "Trinkets sub stats (AlexG); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Reforge", "Since 0.323.0 any trinket can be reforged with Reforge Feathers, and a max-level Legendary can lock up to two stats for guaranteed upgrades; you may keep the old layout.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Harvest trinkets", "Harvest dungeons (to December 2) drop Bountiful Tusk, Generous Cornucopia, Plentiful Bihorn and Abundant Overgrowth.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"]]}, {"title": "Trinket by role", "cols": ["Role", "Main stat", "Sub-stats", "When to wear it", "Basis", "Source"], "rows": [["Pusher", "ATK; HP instead for a boss that kills you, which matters little in solo event dungeons, where you revive", "Crit chance and crit damage", "Bosses, the tower and dungeons. Presets do not switch trinkets, so swap it on by hand before the fight.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion); Luminor Base/Max stats (Stratasys); #patch-notes 0.319.4 to 0.323.1 (neype, developer)"], ["Material farmer", "All EXP", "Offline Gains, then Drop Quantity, crit chance, class stat (Soso, for a parked farmer)", "While it farms, parked or online", "Player report", "Best trinket upgrades (Steam discussion); The BEST Luminors You Can Get! (Soso)"], ["Rare-drop farmer", "All EXP", "Drop Quantity, then Offline Gains. Soso's order for an active farmer: a Rogue Drop Quantity > MEN > crit damage > crit chance > DEX; a Warrior the same with STR; a Mage the same without MEN", "While it opens boss chests and farms cards. Drop Quantity is only a sub-stat and counts only for boss chests and cards.", "Guide", "'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai); Best trinket upgrades (Steam discussion); The BEST Luminors You Can Get! (Soso)"], ["Leveller", "All EXP", "Offline Gains", "All the time", "Player report", "Best trinket upgrades (Steam discussion)"], ["Gatherer", "Mining or woodcutting power, matching its skill, until its power is capped, then All EXP (Soso); All EXP also covers gathering XP", "Offline Gains, then Drop Quantity, mining or woodcutting power %, STR for mining or DEX for woodcutting (Soso)", "While it gathers", "Guide", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The BEST Luminors You Can Get! (Soso)"], ["Any character parked offline", "Its farming stat: All EXP, or a gatherer's power", "Offline Gains first", "While parked. A pusher swaps its ATK trinket for the farming one before it logs off.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"], ["Gold", "Soso's pick for a combat farmer, active or parked, once it is damage-capped: Gold > All EXP > ATK. Below the cap, and for one Luminor worn for all content (All EXP > Gold > ATK), farmers keep All EXP", "As for its farmer role", "While a damage-capped combat farmer farms; otherwise filler until an All EXP trinket drops", "Guide", "The BEST Luminors You Can Get! (Soso)"]]}, {"title": "Trinket pieces", "cols": ["Piece (Halloween / Harvest)", "Max level", "Sub-stats (active when rolled)", "All EXP %", "Gold %", "ATK", "HP", "Mining or woodcutting power (Halloween / Harvest)"], "rows": [["Black Candle / Bountiful Tusk", 6, "1, 0-1 active", "16 to 20.8", "12 to 16.8", "12 to 16.8", "40 to 64", "40 to 56 / 20 to 28"], ["Candlestick / Generous Cornucopia", 9, "2, 1-2 active", "24 to 34.8", "18 to 28.8", "18 to 28.8", "60 to 114", "60 to 96 / 30 to 48"], ["Candelabra / Plentiful Bihorn", 12, "3, 2-3 active", "32 to 51.2", "24 to 43.2", "24 to 43.2", "80 to 176", "80 to 144 / 40 to 72"], ["Luminor / Abundant Overgrowth", 15, "4, 3-4 active", "40 to 70", "30 to 60", "30 to 60", "100 to 250", "100 to 200 / 50 to 100"]]}], "icon": 397}], "stages": ["Act 1 start", "Act 1 mid", "Act 1 done", "Mammoth dead", "Jötunn dead", "Act 2 done", "Act 3 early", "Hard Act 1", "Hard Act 2", "Nightmare"], "reached": ["New account", "Hunter unlocked at Stumps", "Yrsainir killed", "First Act 2 boss killed", "Second Act 2 boss killed", "Maevath killed", "Act 3 town reached", "Obelisk used, pushing Act 1 Hard", "Act 2 Hard unlocked (combat level 80, the three Hard Act 1 bosses dead, Act 1 Hard card at 3 stars)", "Nightmare difficulty open"], "expect": {"Hunter": [0, 1, 2, 4, 5, 6, 7, 7, 8, 9], "Bonfire": [0, 0, 0, 4, 6, 8, 8, 8, 8, 8], "Ash": [0, 0, 0, 1, 3, 5, 6, 7, 7, 7], "Sacrifice": [0, 0, 0, 2, 4, 5, 6, 7, 8, 9], "Pusher gear": [0, 0, 3, 4, 8, 8, 9, 10, 12, 12], "Gatherer gear": [0, 0, 1, 2, 3, 5, 5, 6, 6, 7], "Gathering": [0, 0, 2, 2, 2, 3, 3, 4, 5, 5], "Gems": [0, 0, 1, 1, 1, 2, 3, 5, 8, 13], "Pets": [0, 1, 1, 1, 1, 2, 3, 4, 5, 6], "Cards": [0, 1, 3, 4, 5, 5, 6, 7, 7, 9], "Runes": [0, 0, 0, 1, 1, 2, 3, 5, 6, 7], "Engineer": [0, 0, 1, 3, 4, 5, 7, 8, 9, 10], "Curio": [0, 0, 0, 0, 0, 0, 2, 4, 6, 7], "Hourglass": [0, 0, 0, 0, 0, 0, 1, 3, 5, 7], "Characters": [1, 2, 3, 4, 4, 5, 6, 6, 6, 7], "Trinkets": [0, 0, 1, 1, 1, 1, 2, 2, 3, 4]}, "daily": [["Any", "Complete the daily quest", "60 gems and the day's boss keys (3, +1 for each Engineer Daily Activity Enhancer I-III)", "Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "quest"], ["Any", "Claim the daily login tracks", "Days you were online but did not claim stack (Monthly and 7-Day); they need a registered account", "Guides & Tips (EvitaniaOnlineDB); Evitania Online news and update notes (Steam store)", "login"], ["Any", "Spend boss keys (30 cap, +5 for each Engineer Keyring tier, up to 45)", "Boss cards, pets and Enhance stones", "Beginner Guide (Treyex Gaming); Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "boss-keys"], ["Any", "Act 1 vendor: buy all the Enhance Stone 1 (3 a day; Engineer Vendor Stock raises it) and the Animal Bone", "Stones for gear up to steel. Each bone crafts a Bone Dagger, a cheap item to fail on when building enhance chance", "Guide to enhancing (MountTai); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Гайды, Russian guide collection (Jivchik)", "vendor-1"], ["Act 2+", "Act 2 vendor: buy all the Crystallized Yellow Substance and the Enhance Stone 2", "The vendor is its only source. Thorium weapons take 140 each, the armor set 102, thorium tools 40 each, steel tools 10 each, and Wish for Gold uses it later", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)", "vendor-2"], ["Act 3+", "Act 3 vendor: buy all the Crystallized Blue Substance and the Enhance Stone 3", "The vendor is its only source. Infinite 1 armor takes 60, and Perfect Silk Fabric and Perfect Aether Crystal use 3 and 6 a craft", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "vendor-3"], ["Level 25+", "Run the Tower attempts", "Gold, gems and keys", "Beginner Guide (Treyex Gaming)", "tower"], ["Any", "Check mail and new codes", "Free gems", "Frequently Asked Questions (Johnny Treeman)", "mail-codes"], ["Cost Cruncher bought", "If you bought Cost Cruncher: before any other Hunter purchase, buy your most expensive planned Hunter level", "Needs at least one level of Hunter Cost Cruncher (300 gems). Any Hunter purchase uses up the whole stacked discount, so let the expensive one take it", "Gem Guide (Piwu); Guides & Tips (EvitaniaOnlineDB); Evitania Online news and update notes (Steam store)", "cost-cruncher"], ["Act 2+", "Refuel the Bonfire with Chadcoal", "No fire means no ash", "Act 2 progression (MountTai); Bonfire (EvitaniaOnlineDB)", "bonfire-fuel"], ["Act 2+", "Act 2 town: collect the Slyme from the egg", "The egg hatches one every 16 hours; Slymes are pet food", "Pet Guide (EvitaniaOnlineDB); Pet system (Johnny Treeman)", "slyme-egg"], ["Fate Spiral bought", "Open the daily Fate Spiral", "One curio a day", "Gem Guide (Piwu)", "fate-spiral"], ["Act 3+", "Collect curio coins before they cap", "Coins stop accruing at the cap", "Curio System (Johnny Treeman)", "curio-coins"], ["Level 50+", "Run the event dungeons while an event is on", "Trinkets and event rewards. Tiers are gated by attack (top tier 10M). Dungeon keys stack to 20, so a missed day is not lost", "#patch-notes 0.319.4 to 0.323.1 (neype, developer); Evitania Online news and update notes (Steam store)", "event-dungeons"], ["Level 60+, in a guild", "Log in and make the two daily donations (500k and 10m gold)", "Activity, seals and guild funds. The weekly guild kill task needs playing, not only a login", "Guilds (Piwu); Evitania Online news and update notes (Steam store)", "guild-donations"], ["Hourglass level 5+", "Check the Hourglass rifts and start any that finished", "Rifts run 8, 10, 12 or 20 hours and open at Hourglass level 5", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Hourglasses Guide (EvitaniaOnlineDB)", "hourglass"]], "shareSys": ["Hunter", "Bonfire", "Ash", "Sacrifice", "Pusher gear", "Gatherer gear", "Gathering", "Gems", "Pets", "Cards", "Runes", "Engineer", "Curio", "Hourglass", "Characters", "Trinkets"], "shareDaily": ["quest", "login", "boss-keys", "vendor-1", "vendor-2", "vendor-3", "tower", "mail-codes", "cost-cruncher", "bonfire-fuel", "slyme-egg", "fate-spiral", "curio-coins", "event-dungeons", "guild-donations", "hourglass"], "about": [["What it is", "A progression checklist for Evitania Online – Idle RPG. Pick your stage and set your tier in each system by hand; the page shows what is expected next."], ["How to use", "Pick your stage at the top. Set your tier for each system with the plus and minus buttons, or open a system and click the highest tier you have reached. The Daily tab lists today's tasks for your stage. The Talents tab draws talent trees by class, role and level. Backup saves everything as a file or link."], ["Basis: Guide", "The tier or rule is a target or recommendation stated in the source."], ["Basis: Game data", "The tier or rule is a game threshold, cost or unlock reported by the source. Game data also covers values calculated directly from game numbers."], ["Basis: Estimate", "Ordered or set from several sources; no single guide states it as a target. Treat it as a draft."], ["Basis: Player report", "One or a few players' observations in a forum or Discord thread, not confirmed by a guide or the game data; treat it as a hint."], ["Stage expectations", "The expected tier at each stage is a synthesis of the guides, not a community standard."], ["No save import", "Since game version 0.311.0 the save file is encrypted and the developers ask players not to share ways to decode it, so tiers are set by hand."], ["Freshness", "Built 2026-11-15 from sources dated April to November 2026, around game version 0.323.1. Numbers marked Game const stageFromDigit=ch=>{if(ch==='z')return null;const si=parseInt(ch,36);if(!(si<D.stages.length))throw new Error('That share link is not valid.');return D.stages[si]};
const stageToBackup=()=>hasStage()?slug(state.stage):null;

const stageFromBackup=v=>v===null?null:unslug(D.stages,v)||state.stage;
const pickStagePrompt=()=>'<span class="tinfo">Pick your stage at the top to see what each system expects.</span>';
const expected=n=>hasStage()?D.expect[n][stageIdx()]:null;
const tierOf=n=>Number.isInteger(state.tiers[n])?state.tiers[n]:null;
const NST=D.stages.length;
const tierStageInt=(n,k)=>{const i=D.expect[n].findIndex(v=>v>=k);return i<0?NST+1:i+1};
function tierStage(n,k){const s=tierStageInt(n,k),tot=sysBy(n).tiers.length;let lo=k,hi=k;
  while(lo>1&&tierStageInt(n,lo-1)===s)lo--; while(hi<tot&&tierStageInt(n,hi+1)===s)hi++;
  return s-1+(k-lo+1)/(hi-lo+1)}
function stagePos(n,t){const tot=sysBy(n).tiers.length; if(t>=tot) return NST+1;
  const nx=tierStageInt(n,t+1); if(t===0) return nx-1;
  return tierStageInt(n,t)===nx?tierStage(n,t):nx-1}
const stageDiff=n=>stagePos(n,tierOf(n)===null?0:tierOf(n))-(stageIdx()+1);
function status(n){const t=tierOf(n),e=expected(n);
  if(!hasStage()) return {k:'none',t:'',l:'No stage picked'};
  if(t===null) return e===0?{k:'idle',t:'–',l:'Not needed yet'}:{k:'warn',t:'?',l:'Tier not set'};
  const d=Math.floor(stageDiff(n)+1e-9),w=x=>x+' stage'+(x===1?'':'s');
  if(d>0) return {k:'good',t:'+'+d,l:'Your tier is what is expected '+w(d)+' ahead of your stage'}; if(d===0) return {k:'good',t:'0',l:'On track for your stage'};
  return {k:'bad',t:'−'+(-d),l:w(-d)+' behind your stage'} }
const sysBy=n=>D.systems.find(s=>s.name===n);
function setTier(n,v){const max=sysBy(n).tiers.length; if(v===null||v<0) delete state.tiers[n]; else state.tiers[n]=Math.min(max,v); commit()}

const DAILY_FROM={'Any':0,'Level 25+':1,'Level 50+':2,'Act 2+':2,'Cost Cruncher bought':2,'Level 60+, in a guild':3,'Act 3+':6,'Fate Spiral bought':6,'Hourglass level 5+':8};
const dailyStage=r=>DAILY_FROM[r[0]]??0;
const KNAME={skill:'Class skill',atk:'Attack',atkp:'Attack %',aspd:'Attack Speed',crit:'Crit Chance',critd:'Crit Damage',def:'Defence',mf:'Magicfind (Drop Quantity)',xp:'Bonus XP',move:'Movespeed',hp:'Max HP',mana:'Maximum Mana',mregen:'Mana Regen'};
const KEFF={atk:'+1 attack',atkp:'+1% attack',aspd:'+1% attack speed',crit:'+2% crit chance',critd:'+2% crit damage',def:'physical defence',mf:'+1 Drop Quantity',xp:'+5% combat XP',move:'+10% movement speed',hp:'+5 HP',mana:'+5 MP',mregen:'+1 MP regen'};
function nodeName(n){return n.n||KNAME[n.k]}
function nodeEff(cls,n){if(n.k==='skill')return 'class skill';let e=KEFF[n.k];if(cls==='Mage'&&n.k==='crit')e='+1% crit chance';if(cls==='Mage'&&n.k==='move')e='+5% movement speed';return e+' per rank'}
function buildOrder(cls,role){const T=D.trees[cls],by={};T.nodes.forEach(n=>by[n.o]=n);const base=T.nodes.map(n=>n.o).sort((a,b)=>a-b);
  if(role==='Pusher')return base.map(o=>by[o]);
  const pre={},gate=new Set();T.edges.forEach(([a,b])=>{const x=by[a].c<by[b].c||(by[a].c===by[b].c&&by[a].o<by[b].o)?[a,b]:[b,a];(pre[x[1]]=pre[x[1]]||[]).push(x[0]);gate.add(x[0])});
  if(role==='Material farmer'){const late=o=>(by[o].k==='mf'||by[o].k==='xp')&&!gate.has(o);return base.filter(o=>!late(o)).concat(base.filter(late)).map(o=>by[o])}
  const want=role==='Leveller'?o=>by[o].k==='xp':o=>by[o].k==='mf';
  const out=[],took=new Set();
  const add=o=>{if(took.has(o))return;took.add(o);out.push(by[o]);let more=true;while(more){more=false;for(const q of base){if(!took.has(q)&&want(q)&&(pre[q]||[]).some(p=>took.has(p))){took.add(q);out.push(by[q]);more=true}}}};
  base.forEach(add);return out}
function charPlan(c){const ord=buildOrder(c.cls,c.role),pts=c.pts===null||c.pts===undefined?Math.max(0,c.level-10):c.pts;let left=pts;const got={};const seq={};
  ord.forEach((n,i)=>{seq[n.o]=i+1;const g=Math.max(0,Math.min(n.m,left));got[n.o]=g;left-=g});
  return {ord,pts,got,seq,total:ord.reduce((a,n)=>a+n.m,0)}}
function treeHTML(c,ci){const T=D.trees[c.cls],P=charPlan(c),CW=66,RH=62,NS=46,PX=14,PY=16,W=PX*2+10*CW+NS,H=PY*2+3*RH+NS,by={};T.nodes.forEach(n=>by[n.o]=n);
  const cx=n=>PX+n.c*CW+NS/2,cy=n=>PY+n.y*RH+NS/2;
  let h='<div class="treewrap"><div class="tree" style="width:'+W+'px;height:'+H+'px"><svg width="'+W+'" height="'+H+'" aria-hidden="true">';
  for(const [a,b] of T.edges){const A=by[a],B=by[b],on=P.got[a]>0&&P.got[b]>0;h+='<line x1="'+cx(A)+'" y1="'+cy(A)+'" x2="'+cx(B)+'" y2="'+cy(B)+'" class="'+(on?'on':'')+'"/>'}
  h+='</svg>';
  for(const n of T.nodes){const g=P.got[n.o],st=g>=n.m?'full':g>0?'part':'none';
    const tip='Pick '+P.seq[n.o]+': '+nodeName(n)+', '+nodeEff(c.cls,n)+'. Expected now: '+g+' of '+n.m;
    h+='<div class="tn '+st+(n.k==='skill'?' skill':'')+'" style="left:'+(PX+n.c*CW)+'px;top:'+(PY+n.y*RH)+'px" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" role="img">'
      +icon(n.i,'xl')+'<span class="ord">'+P.seq[n.o]+'</span><span class="rk">'+g+'/'+n.m+'</span></div>'}
  return h+'</div></div>'}
function vRoster(){let h='<div class="vhead"><h2>Talent builds</h2><p class="lead">Each character with the talents it should have by now. The small number at the top of a node is its pick order; the fraction below it is the ranks expected now out of its maximum.</p></div>'

    h+='<section class="char"><div class="chead"><span class="slot s-good">'+icon(clsIcon(c.cls),'xl')+'</span><h2>'+esc(c.role)+' '+esc(c.cls)+'<span class="lv">Level '+c.level+' &middot; '+ptsV+' talent points</span></h2><button type="button" class="xbtn" data-act="cdel" data-ci="'+ci+'" id="c-del-'+ci+'" aria-label="Remove this character" title="Remove this character">&#10005;</button></div>'
      +'<div class="cctl">'+seg('cls',Object.keys(D.trees).map(k=>[k,icon(clsIcon(k))+k]),c.cls,'Class')

  h+='<div class="sect"><div class="tbl"><table><thead><tr><th>Topic</th><th>Rule</th><th>Basis</th><th>Source</th></tr></thead><tbody>'
    +D.roster.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+rich(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+srcLinks(r[3])+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h+'<div class="sync" id="sync">'+esc(syncMsg)+'</div>' }
let bkMsg='',bkPending=null;
function exportObj(){const t={},ct=cleanTiers();for(const k in ct)t[slug(k)]=ct[k];const did=new Map(D.daily.map(r=>[r[1],r[4]]));
  return {v:1,stage:stageToBackup(),tiers:t,daily:cleanDaily(state.daily).map(x=>did.get(x)),chars:cleanChars(state.chars).map(c=>[slug(c.cls),slug(c.role),c.level])}}
const unslug=(list,v)=>list.find(x=>slug(x)===v);
function parseBackup(txt){let o;try{o=JSON.parse(txt)}catch(e){throw new Error('That is not valid JSON.')}
  if(!o||typeof o!=='object'||Array.isArray(o)||o.v!==1) throw new Error('The file does not hold a checklist backup.');
  const tiers={},src=o.tiers&&typeof o.tiers==='object'?o.tiers:{};
  for(const s of D.systems){const v=src[slug(s.name)]; if(Number.isInteger(v)&&v>=0) tiers[s.name]=Math.min(v,s.tiers.length)}
  const byId=new Map(D.daily.map(r=>[r[4],r[1]]));
  const daily=Array.isArray(o.daily)?o.daily.map(x=>byId.get(x)):[];
  const chars=Array.isArray(o.chars)?o.chars.filter(Array.isArray).map(c=>({cls:unslug(Object.keys(D.trees),c[0]),role:unslug(ROLES,c[1]),level:c[2]})):null;
  return {stage:stageFromBackup(o.stage),tiers,daily:cleanDaily(daily),chars:cleanChars(chars),when:''}}
const FEEDBACK_URL='https://github.com/tamatuk/evitania-checklist/issues/new';
const SH_CLS=['Warrior','Rogue','Mage'];
function shareCode(){const ct=cleanTiers(),done=new Set(cleanDaily(state.daily)),idOf=new Map(D.daily.map(r=>[r[4],r[1]]));
  let m=0;D.shareDaily.forEach((id,i)=>{if(done.has(idOf.get(id)))m+=2**i});
  return '1'+stageDigit()+D.shareSys.map(n=>Number.isInteger(ct[n])?ct[n].toString(36):'z').join('')+'-'+m.toString(36)+'-'
    +cleanChars(state.chars).map(c=>SH_CLS.indexOf(c.cls)+''+ROLES.indexOf(c.role)+c.level.toString(36).padStart(2,'0')).join('')}
function parseShare(h){const m=/^1([0-9a-z])([0-9a-z]*)-([0-9a-z]+)-([0-9a-z]*)$/.exec(h); if(!m) throw new Error('That share link is not valid.');
  const stage=stageFromDigit(m[1]);
  const tiers={};D.shareSys.forEach((n,i)=>{const ch=m[2][i],s=sysBy(n); if(ch&&ch!=='z'&&s){tiers[n]=Math.min(parseInt(ch,36),s.tiers.length)}});
  const mask=parseInt(m[3],36),idOf=new Map(D.daily.map(r=>[r[4],r[1]])),daily=[];D.shareDaily.forEach((id,i)=>{if(Math.floor(mask/2**i)%2===1&&idOf.has(id))daily.push(idOf.get(id))});
  const chars=[];for(let i=0;i+4<=m[4].length;i+=4){chars.push({cls:SH_CLS[+m[4][i]],role:ROLES[+m[4][i+1]],level:parseInt(m[4].slice(i+2,i+4),36)})}
  return {stage,tiers,daily:cleanDaily(daily),chars:cleanChars(chars),when:''}}
let shareSeen='';
function syncUrl(){try{const q='?share='+shareCode(); if(location.search!==q) history.replaceState(null,'',location.pathname+q+location.hash)}catch(e){}}
function shareUrl(){return location.href.split(/[?#]/)[0]+'?share='+shareCode()}
function readShare(){let h=null;try{h=new URLSearchParams(location.search).get('share')}catch(e){} if(!h||h===shareSeen||h===shareCode()) return; shareSeen=h;
  try{history.replaceState(null,'',location.pathname+location.search+'#backup')}catch(e){try{location.hash='backup'}catch(e2){}}
  try{bkPending=parseShare(h);bkMsg='Opened from a share link. Nothing changes until you confirm.'}catch(e){bkPending=null;bkMsg=e.message}}
function vBackup(){const json=JSON.stringify(exportObj());
  let h='<div class="vhead"><h2>Backup</h2><p class="lead">Save your stage, tiers, daily ticks and characters as a JSON file, or load them back. Importing replaces everything you have set on this page.</p></div>';
  h+='<div class="sect"><h3>Export</h3><div class="bk"><div class="bkrow">'+'<button type="button" class="reset" data-act="bkdl" id="bkdl">Download JSON</button>'+'<button type="button" class="reset" data-act="bkcopy" id="bkcopy">Copy JSON</button></div><textarea id="bkout" readonly rows="4" aria-label="Your values as JSON">'+esc(json)+'</textarea><div class="bkrow"><button type="button" class="reset" data-act="bklink" id="bklink">Copy link</button><input type="text" id="bkurl" readonly aria-label="Link that carries your values" value="'+esc(shareUrl())+'"></div></div></div>';
  h+='<div class="sect"><h3>Import</h3><div class="bk"><div class="bkrow"><label class="filebtn">Choose a JSON file<input type="file" id="bkfile" accept=".json,application/json"></label><span class="note">or paste the JSON below</span></div><textarea id="bkin" rows="6" placeholder="Paste exported JSON here" aria-label="JSON to import"></textarea><div class="bkrow"><button type="button" class="reset" data-act="bkread" id="bkread">Preview import</button></div>';
  if(bkPending){const p=bkPending;h+='<div class="bkconf"><p><b>Ready to replace your values'+(p.when?' with the backup from '+esc(p.when):'')+':</b> '+(p.stage===null?'':'stage ')+esc(stageLabel(p.stage))+', '+Object.keys(p.tiers).length+' tiers set, '+p.daily.length+' daily ticks, '+p.chars.length+' characters.</p><div class="bkrow"><button type="button" class="reset" data-act="bkapply" id="bkapply">Replace my values</button><button type="button" class="reset ghost" data-act="bkcancel" id="bkcancel">Cancel</button></div></div>'}
  h+='</div></div>';
  return h+'<div class="sync" id="bkmsg" role="status">'+esc(bkMsg)+'</div><div class="sync" id="sync">'+esc(syncMsg)+'</div>' }
function bkSay(m){bkMsg=m;const e=document.getElementById('bkmsg');if(e)e.textContent=m}
function bkCheck(txt){try{bkPending=parseBackup(txt);bkMsg=''}catch(e){bkPending=null;bkMsg=e.message} const keep=txt;render();const i=document.getElementById('bkin');if(i)i.value=keep}
function vDaily(){const si=stageIdx(),done=new Set(state.daily);
  const rows=D.daily.map((r,i)=>[r,i]).filter(x=>si<0||dailyStage(x[0])<=si),later=si<0?[]:D.daily.filter(r=>dailyStage(r)>si);
  const n=rows.filter(x=>done.has(x[0][1])).length;
  let h='<div class="vhead"><h2>Today&rsquo;s tasks</h2><p class="lead">'+(si<0?'Every daily task, since no stage is picked':'Daily tasks for stage '+(si+1)+' \u00b7 '+esc(stageLabel()))+'. Ticks stay until you press Reset.</p></div>'
    +'<div class="tbar"><span class="tinfo">'+n+' of '+rows.length+' done</span><span class="prog" role="img" aria-label="'+n+' of '+rows.length+' done"><span style="width:'+(rows.length?Math.round(100*n/rows.length):0)+'%"></span></span><button type="button" class="reset" id="dreset" data-act="dreset"'+(state.daily.length?'':' disabled')+'>Reset</button></div>';
  h+='<div class="sect"><div class="tbl"><table class="daily"><thead><tr><th><span class="vh">Done</span></th><th>Task</th><th>Why</th><th>From</th><th>Source</th></tr></thead><tbody>';
  rows.forEach(([r,i])=>{const on=done.has(r[1]);
    h+='<tr class="'+(on?'done':'')+'"><td class="ck"><input type="checkbox" id="dk'+i+'" data-act="dtick" data-i="'+i+'"'+(on?' checked':'')+'></td><td><label for="dk'+i+'">'+rich(r[1])+'</label></td><td>'+rich(r[2])+'</td><td>'+esc(r[0])+'</td><td>'+srcLinks(r[3])+'</td></tr>'});
  h+='</tbody></table></div></div>';
  if(later.length){h+='<div class="sect"><h3>Starts at a later stage</h3><ul class="later">'+later.map(r=>'<li><span class="lf">'+(dailyStage(r)+1)+' \u00b7 '+esc(D.stages[dailyStage(r)])+'</span> '+rich(r[1])+'</li>').join('')+'</ul></div>'}
  return h+'<div class="sync" id="sync">'+esc(syncMsg)+'</div>' }

function vIcons(){
  const groups=[["Hunter trainings", 0, 21], ["Sacrifices", 21, 36], ["Ash tree", 36, 50], ["Heat bonuses", 50, 57], ["Engineer", 57, 61], ["Engineer upgrades", 61, 89], ["Gem shop", 89, 108], ["Monsters, bosses and nodes", 108, 168], ["Runes", 168, 201], ["Curios", 201, 223], ["Smeltery and usables", 223, 251], ["Materials", 251, 343], ["Gear", 343, 470], ["Pets", 470, 514], ["Currencies", 514, 518], ["Talents", 518, 576]];
  let h='<p class="lead">Every icon this page can show inline. Icons are the game&rsquo;s own art, taken from the evitania-online.com fan wiki&rsquo;s image files.</p>';
  for(const g of groups){h+='<div class="sect"><h3>'+g[0]+'</h3><div class="grid">';for(let i=g[1];i<g[2];i++)h+='<div class="cell">'+icon(i,true)+'<span>'+esc(ICON_NAMES[i])+'</span></div>';h+='</div></div>'}
  return h }

function vSources(){
  let h=tableHTML({title:'About this checklist',cols:['Topic','Note'],rows:D.about});
  h+='<div class="sect"><h3>Sources</h3><div class="tbl"><table><thead><tr><th>Source</th><th>Where</th><th>As of</th></tr></thead><tbody>';
  for(const s of D.sources)h+='<tr><td><a href="'+esc(s.link)+'">'+esc(s.name)+'</a></td><td>'+esc(s.where)+'</td><td>'+esc(s.asof)+'</td></tr>';
  return h+'</tbody></table></div></div>' }

function render(){const r=route();
  const si=stageIdx(); document.getElementById('pips').innerHTML=D.stages.map((s,i)=>'<button type="button" class="pip'+(i<si?' past':i===si?' cur':'')+'" id="pip'+i+'" data-i="'+i+'" aria-pressed="'+(i===si)+'" aria-label="Stage '+(i+1)+', '+esc(s)+'" title="'+esc(s)+'">'+(i+1)+'</button>').join(''); document.getElementById('sname').textContent=stageLabel();

  document.getElementById('tabs').innerHTML=VIEWS.map(v=>'<a href="#'+v[0]+'"'+((r===v[0]||(v[0]==='checklist'&&!VIEWS.some(x=>x[0]===r)))?' aria-current="page"':'')+'>'+v[1]+'</a>').join('')+(FEEDBACK_URL?'<a class="fb" href="'+esc(FEEDBACK_URL)+'" target="_blank" rel="noopener">Feedback</a>':'');
  const m=document.getElementById('main');
  m.innerHTML = r==='checklist'?vChecklist(): r==='daily'?vDaily(): r==='roster'?vRoster(): r==='backup'?vBackup(): r==='icons'?vIcons(): vSources() }

document.getElementById('main').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]'); if(!b) return; const id=b.id;
  if(b.dataset.act==='dtick'){const k=D.daily[+b.dataset.i][1]; state.daily=b.checked?cleanDaily(state.daily.concat(k)):state.daily.filter(x=>x!==k); commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='dreset'){state.daily=[]; commit(); return}
  if(b.dataset.act==='bkcopy'){const ta=document.getElementById('bkout');const done=()=>bkSay('Copied to the clipboard.');const fall=()=>{ta.focus();ta.select();bkSay('Select all is on: press Ctrl or Cmd + C to copy.')};try{navigator.clipboard.writeText(ta.value).then(done,fall)}catch(e){fall()} return}
  if(b.dataset.act==='bklink'){const ta=document.getElementById('bkurl');const done=()=>bkSay('Link copied to the clipboard.');const fall=()=>{ta.focus();ta.select();bkSay('Select all is on: press Ctrl or Cmd + C to copy.')};try{navigator.clipboard.writeText(ta.value).then(done,fall)}catch(e){fall()} return}
  if(b.dataset.act==='bkdl'){const name='evitania-checklist.json';try{const u=URL.createObjectURL(new Blob([JSON.stringify(exportObj())],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);bkSay('Saved '+name+'.')}catch(e){bkSay('Could not download here. Use Copy JSON instead.')} return}
  if(b.dataset.act==='bkread'){bkCheck(document.getElementById('bkin').value); return}
  if(b.dataset.act==='bkcancel'){bkPending=null;bkMsg='Import cancelled. Nothing changed.';render();syncUrl(); return}
  if(b.dataset.act==='bkapply'){if(!bkPending)return;const p=bkPending;bkPending=null;state={stage:p.stage,tiers:p.tiers,daily:p.daily,chars:p.chars};bkMsg='Imported. Your values were replaced.';commit(); return}
  if(b.dataset.act==='cadd'){state.chars.push({cls:'Warrior',role:'Farmer',level:1,pts:null}); commit(); return}
  if(b.dataset.act==='cdel'){state.chars.splice(+b.dataset.ci,1); commit(); return}
  if(b.dataset.act==='cset'){const c=state.chars[+b.dataset.ci]; if(!c)return; c[b.dataset.k]=b.dataset.v; state.chars=cleanChars(state.chars); commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='cstep'){const c=state.chars[+b.dataset.ci]; if(!c)return; const d=+b.dataset.d; if(b.dataset.k==='level') c.level=Math.max(1,Math.min(200,c.level+d)); else {const cur=c.pts===null||c.pts===undefined?Math.max(0,c.level-10):c.pts; c.pts=Math.max(0,Math.min(400,cur+d))} commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='cauto'){const c=state.chars[+b.dataset.ci]; if(!c)return; c.pts=null; commit(); return}
  if(b.dataset.act==='later'){const s=b.dataset.sys; later.has(s)?later.delete(s):later.add(s); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='toggle'){const s=b.dataset.sys; open.has(s)?open.delete(s):open.add(s); saveOpen(); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='sort'){sortBy=b.dataset.v; saveSort(); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='openall'){open=open.size===D.systems.length?new Set():new Set(D.systems.map(s=>s.name)); saveOpen(); render(); return}
  const n=b.dataset.sys,t=tierOf(n);
  if(b.dataset.act==='inc') setTier(n,t===null?1:t+1);
  else if(b.dataset.act==='dec') setTier(n,t===null?null:(t===0?null:t-1));
  else if(b.dataset.act==='rung'){const k=+b.dataset.k; setTier(n,t===k?k-1:k)}
  const again=id&&document.getElementById(id); if(again) again.focus() });
document.getElementById('main').addEventListener('change',ev=>{const e=ev.target; if(e.id==='bkfile'){const f=e.files&&e.files[0]; if(!f)return; if(f.size>2e6){bkSay('That file is too large to be a checklist backup.');return} const r=new FileReader(); r.onload=()=>bkCheck(String(r.result)); r.onerror=()=>bkSay('Could not read that file.'); r.readAsText(f); return} if(!e.dataset||!e.dataset.ch) return; const c=state.chars[+e.dataset.ci]; if(!c) return; const k=e.dataset.ch;
  if(k==='cls'||k==='role') c[k]=e.value; else if(k==='level') c.level=Math.max(1,Math.min(200,parseInt(e.value)||1)); else if(k==='pts') c.pts=e.value===''?null:Math.max(0,Math.min(400,parseInt(e.value)||0));
  state.chars=cleanChars(state.chars); const id=e.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
document.getElementById('pips').addEventListener('click',ev=>{const b=ev.target.closest('.pip'); if(!b) return; state.stage=D.stages[+b.dataset.i]; const id=b.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
let lastRoute=route();
window.addEventListener('hashchange',()=>{readShare();render(); if(route()!==lastRoute){lastRoute=route();window.scrollTo(0,0)}});
readShare();render();if(!bkPending)syncUrl();

</script>
