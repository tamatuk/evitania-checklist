<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Evitania Checklist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
    --bg:#17152b; --surface:#272441; --sunk:#1f1c36; --ink:#f3eee0; --muted:#aaa4c8; --line:#454068;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}

.pip.past{background:#8a5a14;border-color:#b8791a;color:#f6dfae}

.diff{min-width:36px;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums}
.p-good{color:var(--good);background:var(--good-bg)} .p-bad{color:var(--bad);background:var(--bad-bg)}
.p-warn{color:var(--warn);background:var(--warn-bg)} .p-idle{color:var(--idle);background:var(--idle-bg)}

nav.tabs a.fb{margin-left:auto}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:12px}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.lead{color:var(--muted);max-width:68ch;margin:0}
.vhead{display:flex;flex-direction:column;gap:4px}.vhead h2{color:var(--accent);text-shadow:0 2px 0 var(--shadow)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:7px 10px 9px 12px}
.tbar .reset{margin-left:auto}.tinfo{font-family:var(--font-head);font-size:15px;letter-spacing:.02em}.tbad{color:var(--bad);font-weight:600}.thint{font-size:12px;color:var(--muted)}
.prog{flex:1 1 120px;max-width:260px;height:10px;background:var(--bg);border:2px solid var(--line);border-radius:2px;overflow:hidden}.prog span{display:block;height:100%;background:var(--gold)}
.legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--muted)}.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:2px solid #4a4668;background:#35314f;margin-left:8px}.lg.full{border-color:#f4c542;background:#e79a2a}.lg.part{border:2px dashed #f4c542;background:#6a4fd0}.lg.none{opacity:.6}
.reset{font-family:var(--font-head);font-size:15px;font-weight:600;letter-spacing:.03em;padding:4px 14px;border:2px solid #b8791a;border-radius:var(--r);background:var(--gold);color:var(--accent-ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}.reset:hover:not(:disabled){background:var(--accent)}.reset:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}.reset:disabled{opacity:.45;cursor:default}
table.daily td.ck{width:36px;text-align:center}table.daily input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}table.daily label{cursor:pointer;font-weight:600}table.daily tr.done td:not(.ck){opacity:.5}table.daily tr.done label{text-decoration:line-through}
.later{margin:0;padding:0;list-style:none;color:var(--muted);font-size:13px}.later li{padding:5px 0;border-top:1px solid var(--line)}.later li:first-child{border-top:0}.later .lf{display:inline-block;min-width:110px;font-weight:600}
.char{margin-top:22px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;box-shadow:0 4px 0 var(--shadow)}
.chead{display:flex;align-items:center;gap:12px}.chead h2{margin:0;font-size:20px;flex:1 1 auto;min-width:0}.chead .lv{display:block;font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0;margin-top:1px}
.xbtn{flex:none;width:28px;height:28px;padding:0;font-size:13px;line-height:1;border:2px solid var(--line);border-radius:var(--r);background:var(--sunk);color:var(--muted);cursor:pointer}.xbtn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.cctl{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;padding:10px 12px;background:var(--sunk);border:2px solid var(--line);border-radius:var(--r)}
.cgrp{display:flex;flex-direction:column;gap:4px;min-width:0}.clab{font-family:var(--font-head);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--bg);border:2px solid var(--line);border-radius:var(--r)}
.sg{display:inline-flex;align-items:center;font-family:var(--font-head);font-size:14px;font-weight:500;letter-spacing:.02em;padding:2px 9px;min-height:26px;border-radius:3px;border:2px solid #4a4668;background:#35314f;color:var(--muted);cursor:pointer;white-space:nowrap}
.sg:hover{border-color:var(--violet-line);color:var(--ink)}.sg.on{background:var(--gold);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.sg .ic{background-color:transparent;margin-right:5px;vertical-align:middle}
.cstep{height:32px}.cstep button{height:100%;width:28px}.cstep input{width:52px;height:100%;border:0;background:transparent;color:var(--ink);text-align:center;font-family:var(--font-head);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.cstep input::-webkit-outer-spin-button,.cstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cauto{font-size:11px;color:var(--muted)}.cautob{font:inherit;font-size:11px;color:var(--link);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline}
.treewrap{overflow-x:auto;margin:12px 0 4px;border-radius:var(--r);background:#201d38;border:2px solid var(--line)}
.tree{position:relative}.tree svg{position:absolute;inset:0}.tree line{stroke:#6b6790;stroke-width:2}.tree line.on{stroke:#f4c542;stroke-width:2.5}
.tn{position:absolute;width:46px;height:46px;border-radius:8px;border:3px solid #4a4668;background:#35314f;display:grid;place-items:center;opacity:.5}
.tn .ic.xl{width:36px;height:36px;margin:0;border-radius:4px;background-color:transparent}
.tn.full{border-color:#f4c542;background:#e79a2a;opacity:1}.tn.part{border-color:#f4c542;border-style:dashed;background:#6a4fd0;opacity:1}
.tn.skill{background:#1f4a57}.tn.skill.full{background:#1f6f7a}.tn .sk{font-size:22px;color:#b8f5e6;line-height:1}
.tn .ord{position:absolute;top:-9px;left:-9px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#2f6fde;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tn .rk{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 2px #000;font-variant-numeric:tabular-nums}
.nextp{margin:8px 0 2px;font-size:13px}.np{display:inline-flex;align-items:center;gap:3px;margin:2px 10px 2px 0;white-space:nowrap}.np small{color:var(--muted)}
.bk{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 4px 0 var(--shadow)}
.bkrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bk input[type=text]{flex:1 1 220px;min-width:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px}
.bk textarea{width:100%;min-width:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;resize:vertical}
.filebtn{font-family:var(--font-head);font-size:15px;font-weight:600;letter-spacing:.03em;padding:4px 14px;border:2px solid var(--violet-line);border-radius:var(--r);background:var(--violet);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--shadow);position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.reset.ghost{background:var(--sunk);border-color:var(--line);color:var(--ink)}.reset.ghost:hover:not(:disabled){background:var(--idle-bg)}
.bkconf{border:2px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:10px 12px}.bkconf p{margin:0 0 8px}
#bkmsg{font-size:13px;color:var(--warn);min-height:1.2em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.list{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 0 var(--shadow)}
.row{display:grid;grid-template-columns:180px max-content 40px minmax(0,1fr);gap:6px 14px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.divider{padding:6px 14px;font-family:var(--font-head);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line)}
.item{border-top:1px solid var(--line)}.item:first-child{border-top:0}.item .row{border-top:0}
.row button.name{font-size:18px;background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:6px}.chev{color:var(--muted);font-size:12px;width:10px}
.panel{padding:2px 14px 14px 14px;background:var(--sunk);border-top:2px solid var(--line)}.panel .sect:first-of-type{margin-top:16px}
.tools{display:flex;justify-content:flex-end;margin:10px 0}
.row .name{font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.row .name:hover{color:var(--accent)}
.row .next{min-width:0;color:var(--ink)}
.row .next small{display:block;color:var(--muted);font-size:12px}
.exp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;justify-self:start;width:max-content;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);box-shadow:0 2px 0 var(--shadow)}
.step button{font-family:var(--font-head);font-size:16px;width:26px;height:26px;border:0;background:var(--violet);color:#fff;cursor:pointer;font-weight:700}
.step button:hover{background:var(--violet-line)}
.step output{min-width:32px;text-align:center;font-family:var(--font-head);font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:640px){ .row{grid-template-columns:minmax(0,1fr) auto auto} .row .next{grid-column:1/-1} }
.ic{display:inline-block;width:20px;height:20px;border-radius:3px;image-rendering:pixelated;background-color:var(--tile);background-repeat:no-repeat;background-size:calc(20px * 24) auto;vertical-align:-5px;margin-right:4px;flex:none}
.ic.big{width:28px;height:28px;background-size:calc(28px * 24) auto;margin:0;border-radius:6px}
.ic.xl{width:36px;height:36px;background-size:calc(36px * 24) auto;margin:0;border-radius:3px;vertical-align:middle}
.slot{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:6px;border:3px solid var(--violet-line);background:var(--violet);box-shadow:0 3px 0 var(--shadow)}.slot .ic.xl{background-color:transparent}
.slot.s-good{border-color:var(--accent);background:var(--gold)}.slot.s-idle{border-color:#4a4668;background:#35314f}.slot.s-idle .ic{opacity:.55}
.sysn{display:flex;align-items:center;gap:10px;min-width:0}
.term{white-space:nowrap}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.back{font-size:13px}
.ladder{list-style:none;margin:0;padding:0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.ladder li{border-top:1px solid var(--line)} .ladder li:first-child{border-top:0}
.rung{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;width:100%;text-align:left;font:inherit;font-size:13px;line-height:1.35;color:inherit;background:none;border:0;padding:5px 12px;cursor:pointer;align-items:start}
.rung:hover{background:#312d50}
.rung.more{display:block;text-align:center;color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 12px)}.rung.more:hover{color:var(--ink)}

.num{width:22px;height:22px;font-family:var(--font-head);font-size:13px;border-radius:3px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--violet-line);color:#fff;background:var(--violet)}
.done .num{background:var(--gold);border-color:var(--accent);color:var(--accent-ink)}
.done .req{color:var(--muted)}
.need .num{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.rung .req{min-width:0}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:11px;color:var(--muted);padding:0 12px 6px 44px;margin-top:-2px}.rmeta a{color:var(--muted)}.rmeta a:hover{color:var(--link)}
details.about{margin-top:4px}details.about summary{cursor:pointer;font-family:var(--font-head);font-size:15px;color:var(--muted);padding:4px 0}details.about summary:hover{color:var(--ink)}details.about[open] summary{margin-bottom:8px}
.meta{display:inline-flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:var(--muted);margin-left:8px;vertical-align:1px}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px;font-weight:600;color:var(--muted)}
.tag.mine{border-style:dashed}
.stg{font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--sunk);color:var(--muted);white-space:nowrap}.stg.due{background:var(--bad-bg);color:var(--bad)}
.flag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.tbl{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:7px 12px;border-top:1px solid var(--line)}
thead th{border-top:0;background:var(--sunk);font-family:var(--font-head);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix td,.matrix th{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}

.matrix .cur{background:var(--accent-soft);color:var(--ink);font-weight:700}
.matrix .when td{font-size:11px;color:var(--muted);white-space:normal;min-width:96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}

<script>
const D = {"roster": [["Pick order", "The numbers start from Piwu's talent guides for each class (August 2026, before Nightmare): class skills first, then attack, crit and attack speed. The role then moves a few nodes earlier or later.", "Guide", "Warrior Talent Guide (Piwu); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"], ["Pusher", "Your main. The guide order as written: damage first, Magicfind and most Bonus XP late. Around level 70 the guide starts adding Drop Quantity and EXP.", "Guide", "Warrior Talent Guide (Piwu)"], ["Material farmer", "An alt parked for Hunter and sacrifice materials. Drop Quantity does not raise the common drop every monster gives, so this role wants kills per hour only: the guide order with Magicfind and Bonus XP pushed to the very end. This is the Min-Maxer of the Three Musketeers method, and MountTai calls Magicfind a trap for anyone not opening boss chests.", "Guide", "The Three Musketeers Method (Dawnk); Rogue skill tree (MountTai); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Rare-drop farmer", "The character that opens boss chests and farms cards, where Drop Quantity does count (each point is +1% to the drop chance, and keys limit how many chests you open). Takes Magicfind as soon as the node before it is taken. This is the Drop Farmer of the Three Musketeers method.", "Guide", "The Three Musketeers Method (Dawnk); Rogue skill tree (MountTai); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Leveller", "A character you want levelled fast to open new zones early: the Trailblazer. Takes Bonus XP as soon as it is reachable. Rogue has no Bonus XP nodes, so it plays as a Pusher.", "Guide", "The Three Musketeers Method (Dawnk); Rogue Talent Guide (Piwu)"], ["Role orders", "No guide publishes a numbered order for the three farmer roles. The trees apply the rules above to Piwu's order.", "Estimate", ""], ["Rogue priorities", "MountTai's level 80 Rogue: unlock every skill node first, rush Arrow Barrage, then crit chance, attack speed, crit damage. He skips attack speed talents because bows already give a lot (a thorium bow adds 40%).", "Guide", "Rogue skill tree (MountTai)"], ["Offline income", "Raise offline gains %, then damage until you reach the kill cap, then raise the cap with mob spawn time reduction, then damage again.", "Guide", "OFFLINE GAINS thread (reply by Johnny Treeman)"], ["Trinkets", "Each role wants a different trinket main stat: ATK for the Pusher, All EXP for the farmers and the Leveller, mining or woodcutting power for a Gatherer. Which one and when to wear it is in the Trinket by role table on the Trinkets system.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"], ["Gatherer", "A woodcutting or mining alt uses the gathering trees, not the class tree, so no class build is drawn for it. Its class talents can follow any role; the gathering advice is on the Gathering system.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman); Гайды, Russian guide collection (Jivchik); The Three Musketeers Method (Dawnk)"], ["Online or offline", "Offline income ignores class skills and penalises the Warrior for move speed, so Rogue and Mage make the better parked farmers. Online play wants movement speed and the skills; the Mage's Improved Lightning Orb makes every hit a crit for 20 seconds.", "Guide", "Mage Talent Guide (Piwu); Гайды, Russian guide collection (Jivchik); Classes & talents (EvitaniaOnlineDB)"], ["Bosses, tower and dungeons", "Fought online, so skills count. Crit chance and crit damage matter most; EvitaniaOnlineDB also suggests Health and Defence on a Warrior for bosses. No guide gives a separate boss order, so use Pusher.", "Guide", "Гайды, Russian guide collection (Jivchik); Classes & talents (EvitaniaOnlineDB)"], ["Class fit", "Warrior: main pusher. Rogue: farmer and woodcutter, best on one- or two-platform maps. Mage: late carry, best on maps with three or more platforms, with the most Magicfind and Bonus XP in its tree.", "Guide", "Classes & talents (EvitaniaOnlineDB); Character Talent Builds (Games Finder); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"], ["Talent points", "Class talent points are taken as the character's level minus 10.", "Player report", ""], ["Respec", "A Class Reset Brew costs 30 gems, so changing a character's role is cheap.", "Guide", "Character Talent Builds (Games Finder); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Warrior", "Piwu advises against the late Max HP node and the Attack % node behind it; put those points into Crit Damage.", "Guide", "Warrior Talent Guide (Piwu)"], ["Nightmare", "In Nightmare, move points out of Magicfind and Bonus XP into attack speed, crit chance and crit damage, whatever the role.", "Guide", "Warrior Talent Guide (Piwu); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"]], "systems": [{"name": "Hunter", "tiers": [{"req": "Hunter unlocked (Stumps, map 4) and every training at 5 or more.", "basis": "Estimate", "source": "The Hunter (Sakori)"}, {"req": "Every training at 10 or more. Level 10 costs 202 materials.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); The Hunter (Sakori)"}, {"req": "Power Training, Strength Training, Dexterity Training or Intelligence Training (whichever is your class's), More Damage Training, Dice Training and Damage Abuse Training at 15 or more. Level them evenly, one of each at a time.", "basis": "Guide", "source": "Act 2 progression (MountTai); Hunter and Sacrifice min/max optimizations (HyZerg)"}, {"req": "Every training at 15 or more.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Power Training, Strength Training, Dexterity Training or Intelligence Training (whichever is your class's), More Damage Training, Dice Training and Damage Abuse Training at 20 or more, with Defence Training at 20 or more.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Every training at 20 or more.", "basis": "Estimate", "source": "The Hunter (Sakori)"}, {"req": "Every training at 25 or more.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Power Training, Strength Training, Dexterity Training or Intelligence Training (whichever is your class's), More Damage Training, Dice Training and Damage Abuse Training at 30, the base cap, along with Speed Training (attack), which ends there. Needs stacked discounts: level 30 alone is 8.19 million materials before reductions.", "basis": "Estimate", "source": "The Hunter (Sakori); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Power Training, Strength Training, Dexterity Training or Intelligence Training (whichever is your class's), More Damage Training, Dice Training and Damage Abuse Training at 36 or more. Needs the cap raised by Engineer More Hunting or the Act 1 Hard card.", "basis": "Guide", "source": "Hunter and Sacrifice min/max optimizations (HyZerg); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Power Training, Strength Training, Dexterity Training or Intelligence Training (whichever is your class's), More Damage Training, Dice Training and Damage Abuse Training at the cap of 57: all three More Hunting upgrades at 5 and the Act 1 Hard card at 4 stars.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gem Guide (Piwu)"}], "tables": [{"title": "Hunter rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Order", "Raise one of each damage upgrade at a time. A balanced path beats maxing one line, and class or gear barely change the order.", "Guide", "Hunter and Sacrifice min/max optimizations (HyZerg)"], ["Cost", "Each level costs 1.7 times the one before: level 10 is 202 materials, 15 is 2,860, 20 is 40,600, 25 is 577,000 and 30 is 8.19 million.", "Game data", "The Hunter (Sakori)"], ["Cap", "The wiki data caps every training at 57 and Speed Training (attack) at 30. Engineer More Hunting adds 5 in each of Blueprint, Runic Blueprint and Sun Scroll (15), and the Act 1 Hard card adds 4 at 0 stars up to 12 at 4 stars, which leaves a base cap of 30. The base figure is worked out from those numbers, not stated by a guide.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gem Guide (Piwu)"], ["Discount math", "Two separate modifiers: Hunter Cost Reduction (the training, the Crab Miner and Helmet cards, the ash node) adds into one divisor, and the Cost Cruncher removes a percentage of what is left (up to 99%).", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The Hunter (Sakori)"], ["Refunds", "Engineer Hunter Tax Returns adds a 5% chance per level (10 levels across Idea and Blueprint) that a Hunter level refunds half its materials: about a quarter off on average at 50%.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"], ["Crab Miner card", "Farm crab miners until the card drops: a permanent Hunter discount. Card and ash discounts add into one cost divisor (450% in total divides costs by 5.5).", "Guide", "Guides & Tips (EvitaniaOnlineDB); The Hunter (Sakori)"], ["Cost Cruncher", "Gains 2% discount a day per level (10% a day at level 5, up to 99%). The next Hunter upgrade consumes it, so spend it on one expensive upgrade such as Hunter Cost Reduction.", "Guide", "The Hunter (Sakori); Gem Guide (Piwu)"], ["Farming spots", "Plants for Power, Fire Elementals for More Damage, Slime Cubes for Dice, Weird Books for Damage Abuse, Pebbles for Defence if you are dying. Boars (HP) are the lowest priority.", "Guide", "event farming locations (MountTai)"]]}, {"title": "Hunter trainings", "cols": ["Group", "Training and effect per level", "Material", "Farm"], "rows": [["Damage", "Power Training: +10% ATK", "Mini Plants", "Plant"], ["Damage", "Strength Training: +1 STR (x10% attack for Warriors)", "Wolf Fang", "Wolf"], ["Damage", "Dexterity Training: +1 DEX (x10% attack for Rogues)", "Fruit", "Gnoll"], ["Damage", "Intelligence Training: +1 INT (x10% attack for Mages)", "Ectoplasm", "Animated Armor"], ["Damage", "More Damage Training: ATK multiplier, x0.01 per level (multiplies everything else)", "Fire Essence", "Fire Elemental"], ["Damage", "Dice Training: +0.3% crit chance", "D20 Dice", "Slime Cube"], ["Damage", "Damage Abuse Training: +2% crit damage", "Weird Page", "Weird Book"], ["Damage", "Speed Training (attack): +1% attack speed, cap 30", "Candle", "Kobold"], ["Defence", "Defence Training: +3% physical defence", "Stoney McStoneface", "Pebble"], ["Discount", "Hunter Cost Reduction: +20% cost reduction", "Gold", "Gold"], ["Gathering", "Woodcutting Training: +3% woodcutting power", "Bat Dust", "Bat"], ["Gathering", "Mining Training: +3% mining power", "Crab Claw", "Crab"], ["Gathering", "Woodcutting Power: +1 woodcutting power", "Ironwood Log", "Ironwood tree (Act 2)"], ["Gathering", "Mining Power: +1 mining power", "Thorium Ore", "Thorium vein (Act 2)"], ["Gathering", "Woodcutting Experience: +1% woodcutting XP", "Palm Tree Log", "Palm tree (Act 3)"], ["Gathering", "Mining Experience: +1% mining XP", "Beetleman Sting", "Beetleman (Act 3)"], ["Utility", "Knowledge Training: +1% combat XP", "Leaf", "Stump"], ["Utility", "Smeltery Speed Training: +5% smeltery speed", "Iron Bar", "Smeltery"], ["Low", "Endurance Training: +1 CON (+5% max HP, +1% HP regen)", "Boar Meat", "Boar"], ["Low", "Meditation Training: +1 MEN (+5% max mana, +5 magic defence)", "Honeycomb", "Wasp"], ["Low", "Speed Training (movement): +0.33% move speed", "Gold", "Gold"]]}], "icon": 15}, {"name": "Bonfire", "tiers": [{"req": "Bonfire unlocked and burning Chadcoal (1,100 ; otherwise keep a long fuel timer.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Capacity", "Base fuel capacity is 150,000; each Maximum Fuel rank in the ash tree adds 10,000.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Heat bonuses", "A bonus applies only while its heat is reached. It stays applied offline if the heat was active when you logged off.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades tab (Zerozapper)"], ["Hourglasses", "Hourglasses do not speed up passive ash. Ash per kill does work offline.", "Game data", "Frequently Asked Questions (Johnny Treeman)"], ["Sacrifices and heat", "Sacrifice bonuses work on every map. Heat bonuses work only in Act 2.", "Game data", "Nice Heat, Fire Elementals and Bonfire tutorial threads"], ["Maximum heat", "Maximum heat rises only with the one-time boss soul sacrifices. A higher flame makes ash faster but burns more fuel.", "Game data", "Nice Heat, Fire Elementals and Bonfire tutorial threads"], ["Nice Heat", "The Nice Heat achievement needs the burn slider at exactly 69%.", "Guide", "Nice Heat, Fire Elementals and Bonfire tutorial threads"], ["Fire Essence", "Fire Elemental zone: a Warrior standing in the middle of the top floor cleaves both platforms.", "Guide", "Nice Heat, Fire Elementals and Bonfire tutorial threads"]]}, {"title": "Heat bonuses", "cols": ["Heat", "Bonus", "Kind", "Effect"], "rows": [[100, "Ash Creation", "Ash", "The Bonfire has a chance to produce ash every second"], [300, "Basic heat", "Zones", "Removes Chilled from Act 2 zones 1-4"], [700, "Overheat", "Survival", "+1 base HP regen in heated zones"], [900, "Woodcutting Efficiency", "Gathering", "+100% woodcutting power"], [1100, "Advanced heat", "Zones", "Removes Chilled from zones 5-8"], [1300, "Mining Efficiency", "Gathering", "+100% mining power"], [1700, "Hot Stuff", "Ash", "3% chance of 1 ash per kill"], [1800, "Monster Bait", "Farming", "Monster respawn time -20% in heated 30% all ATK"], [2, "Smeltery Speed", 1, "+60% smeltery speed"], [3, "Maximum Fuel", 1, "+10,000 fuel stored"], [3, "Crit Damage", 3, "+10% crit damage"], [3, "More Ash", 3, "+10% odds of ash"], [3, "Ash Discount", 1, "-10% cost of all ash upgrades"], [3, "Fiery Defence", 4, "+5 physical defence"], [3, "Smeltery Speed", 1, "+60% smeltery speed"], [3, "Hunter Cost Reduction", 5, "50% Hunter cost reduction"], [3, "Movespeed", 2, "+5% movement speed"], [4, "Crit Chance", 4, "+1% crit chance"], [4, "Defence Increase", 5, "+5% physical defence"], [4, "Fuel Efficiency", 3, "-10% fuel consumption"], [4, "Attack Increase", 1, "+30% all ATK"], [4, "Maximum Fuel", 6, "+10,000 fuel stored"], [4, "Rune Overload", 1, "Runes stack in the rune inventory"], [4, "Attack Increase", 1, "+30% all ATK"], [4, "More Ash", 3, "+10% odds of ash"], [4, "More Ash", 3, "+10% odds of ash"], [4, "Smeltery Speed", 3, "+30% smeltery speed"], [5, "Auto Runes", 1, "Dropped runes go straight to the rune inventory"], [5, "Smeltery Speed", 4, "+30% smeltery speed"]]}], "icon": 514}, {"name": "Sacrifice", "tiers": [{"req": "Mammoth's soul sacrificed in the Sacrifice tab: the first five lines are open.", "basis": "Guide", "source": "Act 2 progression (MountTai); Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish and Cutting Edge Technology at 10 or more, with Ironwood felled in 1 or 2 hits.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB); Act 2 progression (MountTai)"}, {"req": "Attack Wish at 15 or more.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Jotunn's Eye sacrificed (five more lines open), and Wish for Hardness high enough to reach about 1,300 physical defence with thorium gear, the Act 2 guide's target for Maevath.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Maevath's Horn sacrificed: the last five lines are open.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish at 20, then Wish for Hardness at 20.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish, Wish for Luck, Pray for Luck and Wish for Speed all at 20, the base cap (Wish for Speed ends there).", "basis": "Guide", "source": "Hunter and Sacrifice min/max optimizations (HyZerg); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Attack Wish, Wish for Luck and Pray for Luck at 30 or more. Needs the cap raised past 20 by Engineer More Sacrifices (Runic Blueprint and Sun Scroll) or the Act 2 Hard card.", "basis": "Estimate", "source": "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Attack Wish, Wish for Luck and Pray for Luck at 42 of 42, reached by about the time the Hunter damage trainings are at 36.", "basis": "Guide", "source": "Hunter and Sacrifice min/max optimizations (HyZerg)"}], "tables": [{"title": "Sacrifice rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Order", "For damage, one of each upgrade at a time is the mathematically best order.", "Guide", "Hunter and Sacrifice min/max optimizations (HyZerg)"], ["First targets", "Early on, push Attack (helmets) and woodcutting (icy needles) toward 10 before going further.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Why helmets", "Attack Wish is a true multiplier. Multipliers apply after all flat and percent bonuses and stack on each other, so they are the strongest kind.", "Guide", "Act 2 progression (MountTai); #faq channel (neype, developer)"], ["Boss items", "Each Act 2 boss drops its Soul and its sacrifice item on every kill. Mammoth's soul opens the first five lines, Jotunn's Eye five more and Maevath's Horn the last five.", "Game data", "Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper); Bonfire (EvitaniaOnlineDB)"], ["Caps", "Base cap is 20 and the top is 42: Engineer More Sacrifices adds 5 in Runic Blueprint and 5 in Sun Scroll, and the Act 2 Hard card adds 4 at 0 stars up to 12 at 4 stars. Wish for Speed always stops at 20.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Bonfire (EvitaniaOnlineDB); Hunter and Sacrifice min/max optimizations (HyZerg)"], ["Costs", "Level L costs 500 x 1.3^(L-1) of the material plus 250 + 50 x (L-1) ash. Wish for Gold is cheaper in material: 50 x 1.11^(L-1). Engineer Humble Sacrifices adds a 5% chance per level to refund half.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Boss souls", "Sacrifice each boss soul in the Sacrifice tab, not as fuel, to open its five lines. Extra boss sacrifices raise heat and Bonfire tier.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades tab (Zerozapper); Bonfire (EvitaniaOnlineDB)"], ["Farming spots", "Helmets (Rogue or Mage) for Attack Wish; Snowmen for carrots (defence) and the Snowman attack card.", "Guide", "event farming locations (MountTai)"]]}, {"title": "Sacrifice lines", "cols": ["Unlocked by", "Line and effect per level", "Group", "Material"], "rows": [["Mammoth", "Attack Wish: attack multiplier, x0.05", "Damage", "Helmet Helmet"], ["Mammoth", "Cutting Edge Technology: woodcutting power, x0.1", "Gathering", "Icy Needles"], ["Mammoth", "Wish for Luck: crit chance, +1%", "Damage", "Iceghost Doll"], ["Mammoth", "Wish for Fuel: woodcutting multiloot, +1", "Gathering", "Ironwood Log"], ["Mammoth", "Food Donation: HP, x0.03", "Low", "Distinguished Glasses"], ["Jotunn", "Wish for Hardness: physical defence, x0.05", "Defence", "Carrot"], ["Jotunn", "Wish for Speed: attack speed, +0.5% (cap 20, so 10%)", "Damage", "Troll Idol"], ["Jotunn", "Mining Edge Technology: mining power, x0.1", "Gathering", "Nut"], ["Jotunn", "Wish for Stones: mining multiloot, +1", "Gathering", "Thorium Ore"], ["Jotunn", "Wish for Knowledge: MP, x0.03", "Low", "Pocketwatch"], ["Maevath", "Pray for Luck: crit damage, +3%", "Damage", "Slightly Damaged Glass"], ["Maevath", "Wish for Riches: Drop Quantity, +1", "Utility", "Spearhead"], ["Maevath", "Wish for Wizdom: combat XP, +1%", "Utility", "Matryoska Doll"], ["Maevath", "Wish for Gold: gold multiplier, +1%", "Utility", "Crystallized Yellow Substance"], ["Maevath", "Wish for Bars: smeltery speed, +10%", "Utility", "Monocle"]]}], "icon": 21}, {"name": "Pusher gear", "tiers": [{"req": "Iron armor set and your class's iron weapon crafted at the Act 1 smith.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Guide to enhancing (MountTai)"}, {"req": "Act 1 accessories worn: Boss Amulet from Bringer of Death chests (about 1 in 6), Tower Ring from clearing 6 tower floors and Ring of STR from the Kill Bringer of Death quest in the two ring slots, and one belt: Belt of Love from killing Yrsainir or an Iron Belt crafted from 20 Steel Bars, 2 Death's Flowers and 2 Dragon Horns.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online news and update notes (Steam store)"}, {"req": "Steel weapon crafted (300 Steel Bars, 10 Dragon Horns, 1 Norse Essence), with the iron armor enhanced to VII and the steel weapon to about X (also a 30-gem achievement).", "basis": "Guide", "source": "Guide to enhancing (MountTai); Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Mammoth Ring obtained and equipped. It drops from Ice Mammoth chests (about 1 in 10), so keep spending keys there until it drops.", "basis": "Player report", "source": "How to kill Jotunn (DiskEntrega); Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"}, {"req": "Thorium weapon in use: crafted and enhanced to within 2 steps of your steel weapon (about VIII against a steel X), which is where it overtakes it.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium armor in use: all four pieces crafted and enhanced to III or more, which is where they overtake iron at VII.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium set enhanced further, weapon first and then armor, to about 1,300 physical defence, the Act 2 guide's target for Maevath.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Nordic Amulet obtained and equipped. It drops from Jotunn chests (about 1 in 20).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"}, {"req": "Sunstone weapon in use: crafted and enhanced to within 2 to 4 steps of your thorium weapon.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Гайды, Russian guide collection (Jivchik)"}, {"req": "Sunstone armor in use: crafted and enhanced to within 7 steps of your thorium armor.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Гайды, Russian guide collection (Jivchik)"}, {"req": "Infinite 1 armor crafted from Act 1 Hard materials (Grassy Stone 1) and worn with the Sunstone weapon.", "basis": "Guide", "source": "Гайды, Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Anomalous Ring obtained from Choissiadyr, the second Act 3 boss.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Infinite 2 set crafted. Each piece consumes the matching Sunstone and Infinite 1 pieces plus Nightmare materials, and needs the Engineer Sun Scroll recipes.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Гайды, Russian guide collection (Jivchik)"}], "tables": [{"title": "Rings, amulets and belts", "cols": ["Item", "Slot", "From", "Fixed bonuses"], "rows": [["Iron Belt", "Belt", "Crafted at the Act 1 smith", "Shorter monster respawn, +1 HP regen, +10 Drop Quantity"], ["Belt of Love", "Belt", "Killing Yrsainir", "+10% crit damage, +10 woodcutting power, +10 Drop Quantity"], ["Boss Amulet", "Amulet", "Bringer of Death chests", "+30% crit damage, +10 physical defence, +10 MEN"], ["Nordic Amulet", "Amulet", "Jotunn chests, about 1 in 20", "+7% crit chance, +5% movement speed, +70 magic defence"], ["Ring of STR", "Ring", "Kill Bringer of Death quest", "+2 STR, +10 physical defence, +30 attack per step (none at base)"], ["Tower Ring", "Ring", "Clearing 6 tower floors", "+2% crit chance, +20% crit damage, +10 physical and magic defence"], ["Mammoth Ring", "Ring", "Ice Mammoth chests, about 1 in 10", "+10% attack speed, +30% crit damage, +100 magic defence"], ["Anomalous Ring", "Ring", "Choissiadyr (Act 3)", "+3% offline gains, +10% combat XP, +2% crit chance"], ["Harvest Belt", "Belt", "Harvest event shop in 2025 (the event runs to December 2; check this year's shop)", "-20% monster respawn time, +3% offline gains, +10% all XP"], ["Other event belts", "Belt", "Past event shops", "About -20% monster respawn time, plus Drop Quantity, XP, gold or offline gains"], ["Rabbit's Foot, Valentine Amulet", "Amulet", "Event shops", "+6% offline gains, Drop Quantity, and crit chance or XP"], ["Carrot, Steam, Mimic and Ashen Rings", "Ring", "Event shops and premium packs", "+50 attack, +3% offline gains, plus Drop Quantity, XP, crit or attack speed"]]}, {"title": "Weapons and armor", "cols": ["Set", "Armor defence per piece", "Weapon attack (sword or longsword / bow / staff)", "Extra"], "rows": [["Copper", "12 to 17", "30 / 25 / 30", "Act 1 smith"], ["Bronze", "25", "No bronze weapons", "Act 1 smith"], ["Iron", "36", "70 or 60 / 62 / 70", "Act 1 smith"], ["Steel", "43", "79 (longsword) / 86 / 97", "Act 1 smith; every piece gives +10% combat XP"], ["Thorium", "60", "154 or 118 / 126 / 154", "Act 2 smith"], ["Sunstone", "100", "221 (longsword) / 225 / 275", "Act 3 smith"], ["Infinite 1", "70 to 100", "161 / 171 / 210", "Hard tab; +5 to +15 Drop Quantity a piece"], ["Infinite 2", "120", "330 / 340 / 410", "Hard tab; +10 to +30 Drop Quantity a piece"]]}, {"title": "What each set costs", "cols": ["Item", "Materials", "Boss or special items", "Needs"], "rows": [["Iron armor (4 pieces)", "84 Iron Bars; 50 each of Candle, Weird Page, D20 Dice and Fire Essence", "None", "Late Act 1"], ["Iron weapon", "45 Iron Bars (30 plus 30 Pyrewood Logs for bow or staff)", "2 Yellow Feathers", "Late Act 1"], ["Steel weapon", "300 Steel Bars", "10 Dragon Horns, 1 Norse Essence", "Yrsainir dead, first steps in Act 2"], ["Steel armor (4 pieces)", "600 Steel Bars, 70 Furry Fur", "14 Death's Flowers", "Act 2 zones 1 to 4 for the fur"], ["Iron Belt", "20 Steel Bars", "2 Death's Flowers, 2 Dragon Horns", "Yrsainir dead"], ["Thorium weapon", "140 Crystallized Yellow Substance, 98 Thorium Bars", "2 Perfect Norse Essence (60 Norse Essence); 7 Artisan's Frames, 7 Furstrings or 3 Cryolite", "Thorium vein (after zone 5). The staff's Cryolite Ore drops in zones 9 to 12"], ["Thorium armor (4 pieces)", "102 Crystallized Yellow Substance, 264 Thorium Bars, 170 Perfect Fur (5,100 Furry Fur)", "8 Norse Essence", "Thorium vein"], ["Sunstone armor (4 pieces)", "2,670 Sunstone Bars; 40,000 Fez Fez, 35,000 Serpent Feather, 45,000 Bandiff Star", "19 Perfect Silk Fabric", "Act 3"], ["Sunstone weapon", "290 to 860 Sunstone Bars, 70,000 Beetleman Sting, 100,000 to 600,000 Palm Tree Logs", "3 Perfect Aether Crystal", "Act 3"], ["Infinite 1 armor (4 pieces)", "115,200 Steel Bars, 144,000 Grassy Stone 1, 60 Crystallized Blue Substance", "1,000 each of Death's Flower, The Crab's Pickaxe and Dragon Horn, plus a Grassy Core (another 1,000 of each)", "Act 1 Hard"], ["Infinite 1 weapon", "15,000 Thorium Bars, 300,000 Icy Stone 1, 450,000 of an Act 3 drop", "2 Grassy Cores", "Act 2 Hard"], ["Infinite 2 piece", "The matching Sunstone and Infinite 1 pieces; 10,000 to 30,000 Grassy Stone 2 (armor) or 120,000 Icy Stone 2 (weapon)", "Crimson or Azure Geode and Sap; 1,000 Act 2 boss drops or Icy Cores", "Nightmare, and the Sun Scroll recipes"]]}, {"title": "Gear rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["When a new tier pays off", "Enhancing adds the same flat amount per step on every tier, so a fresh item of the next tier is weaker than a well-enhanced old one. Keep wearing the old item until the new one is enhanced past the break-even: a thorium sword equals a steel longsword about 3 steps higher, thorium armor equals iron about 5 steps higher, and sunstone armor equals thorium 8 steps higher. That is why the tiers say in use, not crafted.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["By class", "Weapons are per class: sword or longsword for the Warrior, bow for the Rogue, staff for the Mage. Armor is shared by all classes.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Enhancement steps", "Weapons and armor enhance up to XV. Each step adds 27.5 attack to a weapon and 5 defence to an armor piece.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Stones by act", "Enhance Stone 1 drops from Act 1 bosses, Enhance Stone 2 from Act 2 bosses, and Enhance Stone 3 only from Zhai Halud's Gate. Hard and Nightmare bosses drop Grassy Enhance Stone 1 in Act 1 and Icy Enhance Stone 1 in Act 2. Infinite Enhance Stone II is crafted at the Infinite smith (recipe: 100 Sunstone Bars, 1,000 Grassy Stone II and 1 Enhance Stone 2).", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Steel armor", "The steel armor set gives 43 defence a piece against iron's 36, +10% combat XP each, and set bonuses since the May 14 update; the set bonus value is not in the wiki data (unverified until checked in game). The guides skip it and go from enhanced iron straight to thorium; craft it if you want the XP or the set bonus.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai); Evitania Online news and update notes (Steam store)"], ["Thorium order", "The thorium axe needs 10 Mammoth Bitusks and the thorium pickaxe 10 Jotunn Eyes, so tools come as each boss dies. For combat gear, enhance the weapon before the armor.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"], ["Accessories", "The boss rings, amulets and belts also gain attack as they are upgraded: 30 per step for up to 5 steps in the wiki data. Their other bonuses are fixed.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Event belts", "Event belts are the main source of shorter monster respawn, which raises the offline kill cap. If you have none: the Harvest Belt was in the 2025 Harvest event shop, and the Harvest event runs until December 2; whether this year's shop has it is unverified, so check this year's shop.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); #patch-notes 0.319.4 to 0.323.1 (neype, developer); Evitania Online news and update notes (Steam store)"], ["Enhance stones", "They come from boss drops, each act's vendor, quests and login bonuses. Buy out the vendors daily.", "Guide", "Guide to enhancing (MountTai); Act 2 progression (MountTai)"], ["Durability", "Weapons and armor can be enhanced down to 0 durability without breaking; 0 only blocks further attempts until repaired.", "Game data", "Guide to enhancing (MountTai)"], ["Accessories", "Amulets, rings and belts need a duplicate, and a failed attempt destroys both. Max is V. Always enhance the spare, never your only copy.", "Guide", "Guide to enhancing (MountTai); Guides & Tips (EvitaniaOnlineDB)"], ["Failstacking", "Fail on purpose on a junk item to build bonus chance, then switch to the real item; the failure counter is shared by all items. The usual junk item is the Essence Sword, taken to where its success chance is 10% and repaired with copies of itself.", "Guide", "Guide to enhancing (MountTai); Гайды, Russian guide collection (Jivchik)"], ["Event gear", "Event equipment uses Enhance Stone 1 and goes up to XV.", "Game data", "Guide to enhancing (MountTai)"], ["Hand-me-downs", "Pass old sets to alts. Do not spend scarce materials enhancing alt gear early.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Warrior weapons", "Swords hit harder and suit bosses; longswords have the area damage for farming.", "Guide", "Warrior Weapons (Piwu)"], ["Ladder", "Copper, bronze, iron, steel (Act 1), thorium (Act 2), sunstone (Act 3), then Infinite 1 and Infinite 2 on the Hard tab. Steel has a full armor set and a belt as well as weapons. There is no Infinite 3 in the game data.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Sunstone or Infinite 1", "Sunstone has more damage and armor; Infinite 1 carries Drop Quantity. Start with Infinite 1 armor plus a Sunstone weapon. You need both sets in the end to craft Infinite 2.", "Guide", "Гайды, Russian guide collection (Jivchik)"], ["Infinite 2", "Unlocked by the Sun Scroll upgrades Infinite II Armor (400) and Infinite II Weapons (600). A #guides thread warns that crafting it affects the enhancements on the pieces used; read it before crafting.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Currently my best setting in NIGHTMARE: act2 (BlueMoon)"], ["Trinkets", "Since 0.321.0 there is a trinket slot as well; see the Trinkets page.", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer)"]]}], "icon": 396}, {"name": "Gatherer gear", "tiers": [{"req": "Iron axe and pickaxe crafted: the minimum for Ironwood and Thorium.", "basis": "Game data", "source": "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Steel axe and pickaxe crafted, the best tools from the Act 1 smith: 60 Steel Bars, 4 The Crab's Pickaxes and 10 Crystallized Yellow Substance each.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Thorium axe crafted: 10 Mammoth Bitusks, 40 Crystallized Yellow Substance, 30 Thorium Bars and 5 Norse Essence.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium pickaxe crafted: 10 Jotunn Eyes, 40 Crystallized Yellow Substance, 30 Thorium Bars and 5 Norse Essence. It is the minimum for Sunstone ore.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai); Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Thorium tools enhanced to at least the level your steel or iron tools had, so nothing was lost by switching.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sunstone axe and pickaxe in use: crafted and enhanced to within 3 steps of your thorium tools.", "basis": "Game data", "source": "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sunstone tools enhanced toward XV, the cap.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Tools", "cols": ["Tool", "Base power (axe / pickaxe)", "Recipe (axe; pickaxe)", "Extra"], "rows": [["Copper", "3 / 3", "3 Copper Bars, 1 Ash Log each", "Act 1 smith"], ["Bronze", "8 / 10", "20 Bronze Bars, 15 Goak Logs; 3 Bronze Bars, 15 Goak Logs", "Act 1 smith"], ["Iron", "63 / 60", "20 Iron Bars, 50 Pyrewood Logs; 3 Iron Bars, 15 Pyrewood Logs", "Act 1 smith. Enhances up to XV"], ["Steel", "76 / 70", "60 Steel Bars, 4 The Crab's Pickaxes, 10 Crystallized Yellow Substance each", "Act 1 smith, but the yellow comes from the Act 2 vendor. +15% woodcutting or mining XP"], ["Thorium", "90 / 80", "40 Crystallized Yellow Substance, 30 Thorium Bars, 5 Norse Essence, plus 10 Mammoth Bitusks (axe) or 10 Jotunn Eyes (pickaxe)", "Act 2 smith. +5 CON (axe), +5 attack (pickaxe)"], ["Sunstone", "182 / 177", "600 Sunstone Bars, 15,000 Palm Tree Logs, 30,000 Cactus; 200 Sunstone Bars, 15,000 Palm Tree Logs, 40,000 Kangaroo Boomerangs; 1 Perfect Aether Crystal each", "Act 3 smith. +30% power, +10 CON"], ["Second Anniversary", "63 / 60", "Event shop", "+20% gathering speed, +20 multiloot"]]}, {"title": "Gatherer gear rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Crafting as a milestone", "For tools, crafting alone can be the goal, because a tool tier unlocks resources: iron for Ironwood and Thorium, thorium for Sunstone ore and Palm wood. Steel and sunstone tools unlock nothing, so they count only once they out-gather what you had.", "Game data", "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Enhancing tools", "Tools from iron upward enhance like weapons, up to XV, and each step adds 27.5 power. The enhancement targets in the tiers are estimates; late on, most power comes from runes and curios, not the tool.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The Three Musketeers Method (Dawnk)"], ["Steel or straight to thorium", "Steel tools add only 13 woodcutting and 10 mining power over iron, plus 15% XP. They cost 8 The Crab's Pickaxes and 20 Crystallized Yellow Substance for the pair, so they are worth it mainly for the XP while thorium is still out of reach.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Hand down", "Refine one axe and one pickaxe on the main gatherer and hand them down when you craft better ones.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Every character", "Give every character an axe: Act 2 ash needs a great deal of wood.", "Guide", "Woodcutting & Mining Talents Guide (Games Finder)"], ["Belt", "Belt of Love (from killing Yrsainir) adds 10 woodcutting power; event belts suit a parked gatherer for their offline gains.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Trinket", "A trinket with a mining or woodcutting power main stat belongs on the gatherer. Its value follows the piece and its level, and a Harvest piece gives half the power of the matching Halloween one; see the Trinkets system. Unverified: on 2026-11-14 a player in the Luminor stats thread wrote that the developers kept Harvest stats the same as Halloween's, with no screenshot; an Abundant Overgrowth seen in game settles it.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys)"], ["Pet", "For gathering, the pet stats to want are Offline gains with Drop Quantity, EXP or profession power.", "Guide", "Гайды, Russian guide collection (Jivchik)"], ["Power targets", "What the tools need to reach at each stage is on the Gathering system.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"]]}], "icon": 394}, {"name": "Gathering", "tiers": [{"req": "Iron axe and pickaxe: the minimum for Ironwood and Thorium.", "basis": "Game data", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 450 and mining power 500 (Act 1 goals).", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 3,500 and mining power 4,000 (Act 2 goals), with thorium tools.", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 18,000 and mining power 20,000 (Act 3 goals), with talents respecced to the bottom then middle row.", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 70,000 and mining power 80,000 (Hard Mode goals), with sunstone tools.", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Nightmare Act 2 nodes one-shot: 350,000 woodcutting and 400,000 mining, or about 240,000 and 275,000 with the crit row maxed.", "basis": "Guide", "source": "Гайды, Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Gathering rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["One-shot", "Always aim to fell every tree and vein in one hit; power comes first until you can.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 1 talents", "First 7 levels into power, then the first EXP node on the bottom row, then top-row power.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 2 talents", "Top row completely. Runes and sacrifices add power on top.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 3 talents", "Get woodcutting and mining curios, then respec: max the bottom row, then the middle row. Levelled curios replace the lost power.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Crit row", "The middle row maxed gives 36% gathering crit chance and +76% to +92% crit damage. Offline income counts crits as extra power, which is why the late-game advice is bottom row fully, then middle row fully.", "Guide", "Гайды, Russian guide collection (Jivchik)"], ["Levels", "Gathering levels matter for the flat power in ds.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Drop Quantity", "Each point of Drop Quantity adds 1% to rare-loot chances: the rate is multiplied by 1 + DQ/100.", "Game data", "#faq channel (neype, developer)"], ["Card drop chance", "Since a mid-2026 patch there is a separate Rune/Card Drop Chance stat; drops no longer depend on Drop Quantity alone.", "Game data", "Rune & Card Drop Chance Guide (Boushoku)"], ["Stars", "Cards needed for 0 to 4 stars: 1, 8, 24, 60, 360 in Act 1; 1, 12, 48, 100, 600 in Act 2 and for Hard cards; 1, 18, 72, 150, 900 in Act 3. The fourth star needs the Engineer Sun Scroll upgrade 4 Star Cards.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Nightmare cards", "The Act 1 and Act 2 Nightmare cards give nothing yet (confirmed in the 0.323.0 notes).", "Game data", "#patch-notes 0.319.4 to 0.323.1 (neype, developer); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Boss chests", "Killing a boss 30 times gives an achievement that lets you loot 5 chests at once.", "Game data", "Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"], ["Luck", "One player's rule of thumb in chat: prioritise sacrifice and Hunter work, since cards are more luck.", "Estimate", "General chat message (maeqlin)"], ["Base chance", "A monster card drops on 0.01% of kills in Act 1, 0.004% in Act 2 and 0.002% in Act 3. A boss chest gives the boss card half the time.", "Game data", "Cards database (EvitaniaOnlineDB)"], ["Crimson drops", "Crimson geode and crimson sap drop at 1 in 200,000 from mining and woodcutting.", "Game data", "All Pets thread"]]}, {"title": "Cards worth knowing", "cols": ["Card", "Bonus", "Group", "Where it matters"], "rows": [["Crab Miner", "Hunter cost reduction, 50 per star level", "Discount", "All of Hunter"], ["Bringer of Death", "Combat XP +6% per star level", "Levelling", "Act 1 boss, daily keys"], ["The Crab", "Mining offl
