<script>
const D = {"roster": [["Pick order", "The numbers start from Piwu's talent guides for each class (August 2026, before Nightmare): class skills first, then attack, crit and attack speed. The role then moves a few nodes earlier or later.", "Guide", "Warrior Talent Guide (Piwu); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"], ["Terms", "Magicfind is the talent node that gives Drop Quantity (+1 per rank).", "Game data", "Classes & talents (EvitaniaOnlineDB)"], ["Pusher", "Your main. The guide order as written: damage first, Magicfind and most Bonus XP late. Around level 70 the guide starts adding Drop Quantity and XP.", "Guide", "Warrior Talent Guide (Piwu)"], ["Material farmer", "An alt parked for Hunter and sacrifice materials. Drop Quantity does not raise the common drop every monster gives, so this role wants kills per hour first: the guide order with Magicfind and Bonus XP pushed to the very end. This is the Min-Maxer of the Three Musketeers method, and MountTai calls Magicfind a trap for anyone not opening boss chests. Delaying Bonus XP in the talent tree saves points for damage; an All EXP trinket helps levelling without spending those points. The trinket recommendation is a separate choice, not a reason to take Bonus XP talents early.", "Guide", "The Three Musketeers Method (Dawnk); Rogue skill tree (MountTai); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Rare-drop farmer", "The character that opens boss chests and farms cards, where Drop Quantity does count (each point is +1% to the drop chance, and keys limit how many chests you open). Takes Magicfind as soon as the node before it is taken. This is the Drop Farmer of the Three Musketeers method.", "Guide", "The Three Musketeers Method (Dawnk); Rogue skill tree (MountTai); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Leveller", "A character you want levelled fast to open new zones early: the Trailblazer. Takes Bonus XP as soon as it is reachable. Rogue has no Bonus XP nodes, so it plays as a Pusher.", "Guide", "The Three Musketeers Method (Dawnk); Rogue Talent Guide (Piwu)"], ["Role orders", "No guide publishes a numbered order for the three farmer roles. The trees apply the rules above to Piwu's order.", "Estimate", ""], ["Rogue priorities", "MountTai's level 80 Rogue: unlock every skill node first, rush Arrow Barrage, then crit chance and crit damage. He skips attack speed talents because bows already give a lot (a thorium bow adds 40%).", "Guide", "Rogue skill tree (MountTai)"], ["Kill cap", "Offline, a character can only count so many kills an hour (the kill cap). Shorter monster respawn time raises it; past it, more damage does nothing offline.", "Guide", "OFFLINE GAINS thread (reply by Johnny Treeman)"], ["Offline income", "Raise offline gains %, then damage until you reach the kill cap, then raise the cap with monster respawn time reduction, then damage again.", "Guide", "OFFLINE GAINS thread (reply by Johnny Treeman)"], ["Trinkets", "Each role wants a different trinket main stat: ATK for the Pusher, All EXP for the farmers and the Leveller, mining or woodcutting power for a Gatherer. Which one and when to wear it is in the Trinket by role table on the Trinkets system.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"], ["Gatherer", "A woodcutting or mining alt uses the gathering trees, not the class tree, so no class build is drawn for it. Its class talents can follow any role; the gathering advice is on the Gathering system.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman); Gaidy (Guides), Russian guide collection (Jivchik); The Three Musketeers Method (Dawnk)"], ["Online or offline", "Offline income ignores class skills and penalises the Warrior for movement speed, so Rogue and Mage make the better parked farmers. Online play wants movement speed and the skills; the Mage's Improved Lightning Orb makes every hit a crit for 20 seconds.", "Guide", "Mage Talent Guide (Piwu); Gaidy (Guides), Russian guide collection (Jivchik); Classes & talents (EvitaniaOnlineDB)"], ["Bosses, tower and dungeons", "Fought online, so skills count. Crit chance and crit damage matter most; EvitaniaOnlineDB also suggests Health and Defence on a Warrior for bosses. No guide gives a separate boss order, so use Pusher.", "Guide", "Gaidy (Guides), Russian guide collection (Jivchik); Classes & talents (EvitaniaOnlineDB)"], ["Class fit", "Warrior: main pusher. Rogue: farmer and woodcutter, best on one- or two-platform maps. Mage: late carry, best on maps with three or more platforms, with the most Magicfind and Bonus XP in its tree.", "Guide", "Classes & talents (EvitaniaOnlineDB); Character Talent Builds (Games Finder); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"], ["Talent points", "A character has (level − 10) class talent points.", "Estimate", ""], ["Respec", "A Class Reset Brew costs 30 gems, so changing a character's role is cheap.", "Guide", "Character Talent Builds (Games Finder); 'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai)"], ["Warrior", "Piwu advises against the late Max HP node and the Attack % node behind it; put those points into Crit Damage.", "Guide", "Warrior Talent Guide (Piwu)"], ["Nightmare", "In Nightmare, move points out of Magicfind and Bonus XP into attack speed, crit chance and crit damage for every role except the Rare-drop farmer, which keeps Magicfind for boss chests and cards. The Roster trees do not change with stage; apply this respec manually.", "Guide", "Warrior Talent Guide (Piwu); Rogue Talent Guide (Piwu); Mage Talent Guide (Piwu)"]], "systems": [{"name": "Hunter", "tiers": [{"req": "Hunter unlocked (Stumps, Act 1 zone 4) and every combat and Act 1 training at 5 or more.", "basis": "Estimate", "source": "The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"}, {"req": "Every combat and Act 1 training at 10 or more. Level 10 costs 202 materials.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"}, {"req": "Core damage trainings at 15 or more.", "basis": "Guide", "source": "Act 2 progression (MountTai); Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"}, {"req": "Every combat and Act 1 training at 15 or more.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Core damage trainings at 20 or more, with Defence Training at 20 or more.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Every combat and Act 1 training at 20 or more.", "basis": "Estimate", "source": "The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"}, {"req": "Every combat and Act 1 training at 25 or more.", "basis": "Guide", "source": "Hunter (EvitaniaOnlineDB); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Core damage trainings at 30, the base cap, along with Speed Training (attack), which ends there.", "basis": "Estimate", "source": "The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Core damage trainings at 36 or more. Needs the cap raised by Engineer More Hunting or the Act 1 Hard card.", "basis": "Guide", "source": "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Core damage trainings at the cap of 57: all three More Hunting upgrades at 5 (max) and the Act 1 Hard card at 4 stars (max).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Hourglasses Guide (EvitaniaOnlineDB)"}], "tables": [{"title": "Hunter rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Core damage trainings", "Power Training, your class stat training (Strength, Dexterity or Intelligence), More Damage Training, Dice Training and Damage Abuse Training.", "Game data", "Hunter (EvitaniaOnlineDB)"], ["Order", "Raise one of each damage upgrade at a time. A balanced path beats maxing one line, and class or gear barely change the order. On 2026-09-09 the author wrote that its math predates the Hourglass and 4-star cards: the Hourglass gives lots of crit and no ATK%, so crit lines (Dice, Damage Abuse, Wish for Luck, Pray for Luck) lose value against ATK% lines. Power Training stays the best Hunter upgrade, Fire Elementals next.", "Guide", "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"], ["Cost", "Each level costs 1.7 times the one before: level 10 is 202 materials, 15 is 2,860, 20 is 40,600, 25 is 577K and 30 is 8.19M. Two trainings differ: Hunter Cost Reduction costs 1.5 times the last (1,300 x 1.5^L gold) and Speed Training (movement) 1.55 times (900 x 1.55^L gold).", "Game data", "The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Cap", "Every training: 30 (base) + up to 15 from Engineer More Hunting (5 each in Blueprint, Runic Blueprint and Sun Scroll) + 4–12 from the Act 1 Hard card (0–4 stars) = 57 max. Speed Training (attack) stays at 30.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Hourglasses Guide (EvitaniaOnlineDB)"], ["Discount math", "Two separate modifiers: Hunter Cost Reduction (the training, the Crab and Helmet cards, the ash node) adds into one divisor, and the Cost Cruncher removes a percentage of what is left (up to 99%). For example, 450% in total divides costs by 5.5.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"], ["Refunds", "See Engineer 'Hunter Tax Returns' for the refund chance and average savings.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Crab card", "Farm Crabs (Act 1 zone 9) until the card drops: a permanent Hunter discount. For how it stacks with ash discounts, see Hunter 'Discount math'.", "Guide", "Guides & Tips (EvitaniaOnlineDB); The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"], ["Hunter Cost Cruncher (gem shop, 5 levels, 300–500 gems)", "Builds up a discount each day, up to 99%. The guides give 2% a day per level (10% a day at level 5), but the wiki data shows only \"10% → 99%\", so the daily rate is unverified until checked in game. The next Hunter upgrade consumes it, so spend it on one expensive upgrade such as Hunter Cost Reduction.", "Guide", "The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25); Gem Guide (Piwu); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Farming spots", "For each material's location, see Hunter 'Hunter trainings', Farm column. Prioritise Defence if you are dying; Boars (HP) are the lowest priority.", "Guide", "Event farming locations (MountTai)"], ["Act 2 and Act 3 gathering trainings", "Woodcutting Power, Mining Power, Woodcutting Experience and Mining Experience use Act 2 and Act 3 materials (Ironwood Log, Thorium Ore, Palm Tree Log, Beetleman Sting), so the \"every combat and Act 1 training\" tiers leave them out: level them as their materials open.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"]]}, {"title": "Hunter trainings", "cols": ["Group", "Training and effect per level", "Material", "Farm"], "rows": [["Damage", "Power Training: +10% ATK", "Mini Plants", "Plant"], ["Damage", "Strength Training: +1 STR (+10% attack for Warriors, additive)", "Wolf Fang", "Wolf"], ["Damage", "Dexterity Training: +1 DEX (+10% attack for Rogues, additive)", "Fruit", "Gnoll"], ["Damage", "Intelligence Training: +1 INT (+10% attack for Mages, additive)", "Ectoplasm", "Animated Armor"], ["Damage", "More Damage Training: ATK multiplier, x0.01 per level (multiplies everything else)", "Fire Essence", "Fire Elemental"], ["Damage", "Dice Training: +0.3% crit chance", "D20 Dice", "Slime Cube"], ["Damage", "Damage Abuse Training: +2% crit damage", "Weird Page", "Weird Book"], ["Damage", "Speed Training (attack): +1% attack speed, cap 30", "Candle", "Kobold"], ["Defence", "Defence Training: +3% physical defence", "Stoney McStoneface", "Pebble"], ["Discount", "Hunter Cost Reduction: +20% cost reduction", "Gold", "Gold"], ["Gathering", "Woodcutting Training: +3% woodcutting power", "Bat Dust", "Bat"], ["Gathering", "Mining Training: +3% mining power", "Crab Claw", "Crab"], ["Gathering", "Woodcutting Power: +1 woodcutting power", "Ironwood Log", "Ironwood tree (Act 2)"], ["Gathering", "Mining Power: +1 mining power", "Thorium Ore", "Thorium vein (Act 2)"], ["Gathering", "Woodcutting Experience: +1% woodcutting XP", "Palm Tree Log", "Palm tree (Act 3)"], ["Gathering", "Mining Experience: +1% mining XP", "Beetleman Sting", "Beetleman (Act 3)"], ["Utility", "Knowledge Training: +1% combat XP", "Leaf", "Stump"], ["Utility", "Smeltery Speed Training: +5% smeltery speed", "Iron Bar", "Smeltery"], ["Low priority", "Endurance Training: +1 CON (+5% max HP, +1% HP regen)", "Boar Meat", "Boar"], ["Low priority", "Meditation Training: +1 MEN (+5% max MP, +1% MP regen, +5% magic defence)", "Honeycomb", "Wasp"], ["Low priority", "Speed Training (movement): +0.33% movement speed", "Gold", "Gold"]]}], "icon": 15}, {"name": "Bonfire", "tiers": [{"req": "Bonfire unlocked and lit, fuelled with Chadcoal.", "basis": "Guide", "source": "Act 2 progression (MountTai); Bonfire (EvitaniaOnlineDB)"}, {"req": "Heat 300: Basic heat. Removes Chilled from Act 2 zones 1–4.", "basis": "Game data", "source": "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"}, {"req": "Heat 900: Woodcutting Efficiency (+100% woodcutting power).", "basis": "Game data", "source": "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"}, {"req": "Heat 1,100: Advanced heat. Removes Chilled from Act 2 zones 5–8.", "basis": "Game data", "source": "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"}, {"req": "Heat 1,300: Mining Efficiency (+100% mining power).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Heat 2,100: Expert heat. Removes Chilled from Act 2 zones 9–12.", "basis": "Game data", "source": "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"}, {"req": "Heat 3,100: Fiery Weapon (x1.5 ATK multiplier in heated zones).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "The one-time Act 2 boss sacrifices completed: Mammoth Bitusk, Jötunn Eye and Maevath's Horn are the unlock items listed by EvitaniaOnlineDB. Which items the game asks for, and what Maevath gives the Bonfire, are unverified in game; see Sacrifice 'Boss items'.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}], "tables": [{"title": "Bonfire rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Fuel", "Do not burn raw logs. An Ironwood Log is 100 fuel, Chadcoal 1,100, a Palm Tree Log 500 and a Palm Face 26,000. Regular Act 1 coal is not a fuel.", "Game data", "Bonfire (EvitaniaOnlineDB)"], ["Multicraft", "With Smeltery Multicraft maxed, 10 Ironwood gives 3 Chadcoal: 3,300 fuel instead of 1,000 as logs.", "Guide", "Act 2 progression (MountTai)"], ["Burn rate", "Higher burn gives more heat but a worse fuel-to-ash ratio. Use 25–50% if you refuel once or twice a day; 100% only if you refuel often. Keep enough fuel to last until your next visit.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Capacity", "Base fuel capacity is 150K; each Maximum Fuel rank in the ash tree adds 10,000, and the gem-shop Bonfire Capacity adds 100K per level (4 levels).", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Heat bonuses", "A bonus applies only while its heat is reached. It stays applied offline if the heat was active when you logged off.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"], ["Chilled", "Chilled is the Act 2 zone debuff that heat removes.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"], ["Hourglasses", "Hourglasses do not add passive (fuel) ash; they do add ash per kill.", "Game data", "Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Sacrifices and heat", "Sacrifice bonuses work on every map. Heat bonuses work only in Act 2; for Woodcutting and Mining Efficiency this is unverified, since the wiki data gives them no bonfire condition. Check in game.", "Game data", "Nice Heat, Fire Elementals and Bonfire tutorial threads; Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Maximum heat", "Maximum heat rises with the one-time boss sacrifices; see Sacrifice 'Boss items' for the unverified item requirements. A higher flame makes ash faster but burns more fuel.", "Game data", "Nice Heat, Fire Elementals and Bonfire tutorial threads"], ["Nice Heat", "The Nice Heat achievement needs the burn slider at exactly 69%.", "Guide", "Nice Heat, Fire Elementals and Bonfire tutorial threads"], ["Fire Essence", "Fire Elemental zone: a Warrior standing in the middle of the top floor cleaves both platforms.", "Guide", "Nice Heat, Fire Elementals and Bonfire tutorial threads"]]}, {"title": "Heat bonuses", "cols": ["Heat", "Bonus", "Kind", "Effect"], "rows": [[100, "Ash Creation", "Ash", "The Bonfire has a chance to produce ash every second"], [300, "Basic heat", "Zones", "Removes Chilled from Act 2 zones 1–4"], [700, "Overheat", "Survival", "+1 base HP regen in heated zones"], [900, "Woodcutting Efficiency", "Gathering", "+100% woodcutting power"], [1100, "Advanced heat", "Zones", "Removes Chilled from Act 2 zones 5–8"], [1300, "Mining Efficiency", "Gathering", "+100% mining power"], [1700, "Hot Stuff", "Ash", "3% chance of 1 ash per kill"], [1800, "Monster Bait", "Farming", "Monster respawn time -20% in heated zones"], [2100, "Expert heat", "Zones", "Removes Chilled from Act 2 zones 9–12"], [2500, "Owl Wizdom", "XP", "+50% combat XP in heated zones"], [3100, "Fiery Weapon", "Damage", "x1.5 ATK multiplier in heated zones"]]}], "icon": 51}, {"name": "Ash", "tiers": [{"req": "Attack Increase #1 bought (the first node, +30% all ATK).", "basis": "Game data", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "First More Ash node at 3 (max).", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Increase #2 and Ash Discount bought.", "basis": "Estimate", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Ash node Hunter Cost Reduction at 5 (max).", "basis": "Estimate", "source": "Bonfire (EvitaniaOnlineDB); The Hunter (Sakori) (2025-04-20, cost-divisor note 2025-09-25)"}, {"req": "All four Attack Increase nodes and all three More Ash nodes done.", "basis": "Estimate", "source": "Bonfire (EvitaniaOnlineDB); Where's That Effect? A Guide! (Dawnk)"}, {"req": "Rune Overload, Auto Runes and the Smeltery Speed nodes done.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Ash tree complete. From here all ash goes to sacrifices.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB); Gem Guide (Piwu)"}], "tables": [{"title": "Ash rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Start", "Early on, follow the line that improves ash gained (More Ash).", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Later", "Later in Act 2, invest in Smeltery speed, fuel, burn reduction and Auto Runes.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Split", "Ash also pays for sacrifices, so split it between this tree and the top sacrifice lines.", "Estimate", "Bonfire (EvitaniaOnlineDB)"], ["Gems", "The tree gets maxed in time; for gem spending advice, see Gems 'Skip'.", "Guide", "Gem Guide (Piwu)"], ["Ash tree nodes", "The node values below match the wiki data. EvitaniaOnlineDB gives older values (More Ash +15%, Fuel Efficiency −5%, Smeltery Speed +10% / +7%). The tree-level column comes only from EvitaniaOnlineDB.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Bonfire (EvitaniaOnlineDB)"]]}, {"title": "Ash tree nodes", "cols": ["Tree level", "Upgrade", "Ranks", "Effect per rank"], "rows": [[1, "Attack Increase", 1, "+30% all ATK"], [2, "Fuel Efficiency", 3, "-6.67% fuel consumption"], [2, "Attack Increase", 1, "+30% all ATK"], [2, "Smeltery Speed", 1, "+60% smeltery speed"], [3, "Maximum Fuel", 1, "+10,000 fuel stored"], [3, "Crit Damage", 3, "+10% crit damage"], [3, "More Ash", 3, "+10% odds of ash"], [3, "Ash Discount", 1, "-10% cost of all ash upgrades"], [3, "Fiery Defence", 4, "+5 physical defence"], [3, "Smeltery Speed", 1, "+60% smeltery speed"], [3, "Hunter Cost Reduction", 5, "50% Hunter cost reduction"], [3, "Movespeed", 2, "+5% movement speed"], [4, "Crit Chance", 4, "+1% crit chance"], [4, "Defence Increase", 5, "+5% physical defence"], [4, "Fuel Efficiency", 3, "-10% fuel consumption"], [4, "Attack Increase", 1, "+30% all ATK"], [4, "Maximum Fuel", 6, "+10,000 fuel stored"], [4, "Rune Overload", 1, "Runes stack in the rune inventory"], [4, "Attack Increase", 1, "+30% all ATK"], [4, "More Ash", 3, "+10% odds of ash"], [4, "More Ash", 3, "+10% odds of ash"], [4, "Smeltery Speed", 3, "+30% smeltery speed"], [5, "Auto Runes", 1, "Dropped runes go straight to the rune inventory"], [5, "Smeltery Speed", 4, "+30% smeltery speed"]]}], "icon": 514}, {"name": "Sacrifice", "tiers": [{"req": "Mammoth Bitusk sacrificed in the Sacrifice tab: the first five lines are open.", "basis": "Guide", "source": "Act 2 progression (MountTai); Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish and Cutting Edge Technology at 10 or more.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB); Act 2 progression (MountTai)"}, {"req": "Attack Wish at 15 or more.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Jötunn Eye sacrificed (five more lines open), and Wish for Hardness raised for Maevath; see Characters 'Boss readiness check'.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Maevath's Horn sacrificed: the last five lines are open.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish at 20 and Wish for Hardness at 20.", "basis": "Guide", "source": "Bonfire (EvitaniaOnlineDB)"}, {"req": "Attack Wish, Wish for Luck, Pray for Luck and Wish for Speed all at 20, the base cap (Wish for Speed ends there).", "basis": "Guide", "source": "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Attack Wish, Wish for Luck and Pray for Luck at 30 or more. Needs the cap raised past 20 by Engineer More Sacrifices (Runic Blueprint and Sun Scroll) or the Act 2 Hard card.", "basis": "Estimate", "source": "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Attack Wish, Wish for Luck and Pray for Luck at 40 or more.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Attack Wish, Wish for Luck and Pray for Luck at 42 (max).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"}], "tables": [{"title": "Sacrifice rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Order", "For damage, one of each upgrade at a time is the mathematically best order. On 2026-09-09 the author wrote that its math predates the Hourglass and 4-star cards: the Hourglass gives lots of crit and no ATK%, so crit lines (Dice, Damage Abuse, Wish for Luck, Pray for Luck) lose value against ATK% lines.", "Guide", "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"], ["Hardness after Attack", "Take Attack Wish to 20 before Wish for Hardness.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["First targets", "Early on, push Attack Wish (Helmet Helmet) and Cutting Edge Technology (Icy Needles) toward 10 before going further.", "Guide", "Bonfire (EvitaniaOnlineDB)"], ["Ironwood", "Aim to fell Ironwood in 1–2 hits by the time Cutting Edge Technology is at 10.", "Guide", "Bonfire (EvitaniaOnlineDB); Act 2 progression (MountTai)"], ["Why helmets", "Attack Wish is a true multiplier. Multipliers apply after all flat and percent bonuses and stack on each other, so they are the strongest kind.", "Guide", "Act 2 progression (MountTai); #faq channel (neype, developer)"], ["Boss items", "Each Act 2 boss drops its sacrifice item on every kill: Mammoth Bitusk, Jötunn Eye or Maevath's Horn. EvitaniaOnlineDB lists these as the items that open five lines each. It also says a one-time sacrifice of each boss's heart permanently raises the Bonfire by two levels. The wiki lists Mammoth Soul and Jötunn Soul, but no Maevath soul. Which item the Sacrifice tab asks for, and what Maevath gives the Bonfire, are unverified in game; check the tab before spending items.", "Guide", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper); Bonfire (EvitaniaOnlineDB)"], ["Caps", "Base cap is 20 and the top is 42: Engineer More Sacrifices adds 5 in Runic Blueprint and 5 in Sun Scroll, and the Act 2 Hard card adds 4 at 0 stars up to 12 at 4 stars. Both More Sacrifices upgrades maxed and the Act 2 Hard card at 3 stars give a cap of 40. Reaching 42 needs the card at 4 stars (600 cards at 1 in 50,000, about 30M kills before bonuses) with the 4 Star Cards upgrade. Wish for Speed always stops at 20.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Bonfire (EvitaniaOnlineDB); Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"], ["Full cap timing", "Players reach the sacrifice cap at 42 (max) at about the time the Hunter damage trainings are at 36.", "Guide", "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)"], ["Costs", "Level L costs 500 x 1.3^(L-1) of the material plus 250 + 50 x (L-1) ash. Wish for Gold is cheaper in material: 50 x 1.11^(L-1). Engineer Humble Sacrifices adds a 5% chance per level to refund half.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Farming spots", "Farm Helmets (best with a Rogue or Mage) for Attack Wish; farm Snowmen for Carrots (Wish for Hardness) and the Snowman card.", "Guide", "Event farming locations (MountTai)"]]}, {"title": "Sacrifice lines", "cols": ["Unlocked by", "Line and effect per level", "Group", "Material"], "rows": [["Ice Mammoth", "Attack Wish: attack multiplier, x0.05", "Damage", "Helmet Helmet"], ["Ice Mammoth", "Cutting Edge Technology: woodcutting power, x0.1", "Gathering", "Icy Needles"], ["Ice Mammoth", "Wish for Luck: crit chance, +1%", "Damage", "Iceghost Doll"], ["Ice Mammoth", "Wish for Fuel: woodcutting multiloot, +1", "Gathering", "Ironwood Log"], ["Ice Mammoth", "Food Donation: HP, x0.03", "Low priority", "Distinguished Glasses"], ["Jötunn", "Wish for Hardness: physical defence, x0.05", "Defence", "Carrot"], ["Jötunn", "Wish for Speed: attack speed, +0.5% (cap 20, so 10%)", "Damage", "Troll Idol"], ["Jötunn", "Mining Edge Technology: mining power, x0.1", "Gathering", "Nut"], ["Jötunn", "Wish for Stones: mining multiloot, +1", "Gathering", "Thorium Ore"], ["Jötunn", "Wish for Knowledge: MP, x0.03", "Low priority", "Pocketwatch"], ["Maevath", "Pray for Luck: crit damage, +3%", "Damage", "Slightly Damaged Glass"], ["Maevath", "Wish for Riches: Drop Quantity, +1", "Utility", "Spearhead"], ["Maevath", "Wish for Wizdom: combat XP, +1%", "Utility", "Matryoska Doll"], ["Maevath", "Wish for Gold: gold multiplier, +1%", "Utility", "Crystallized Yellow Substance"], ["Maevath", "Wish for Bars: smeltery speed, +10%", "Utility", "Monocle"]]}], "icon": 21}, {"name": "Pusher gear", "tiers": [{"req": "Iron armor set and your class's iron weapon crafted at the Act 1 smith.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Guide to enhancing (MountTai)"}, {"req": "Act 1 accessories worn: Boss Amulet from Bringer of Death chests (about 1 in 6), Tower Ring from clearing 6 tower floors and Ring of STR from the Kill Bringer of Death quest in the two ring slots, and one belt: Belt of Love from killing Yrsainir or an Iron Belt crafted from 20 Steel Bars, 2 Death's Flowers and 2 Dragon Horns.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online news and update notes (Steam store)"}, {"req": "Steel weapon at X or higher and iron armor at VII or higher.", "basis": "Guide", "source": "Guide to enhancing (MountTai); Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Mammoth Ring equipped, or Ice Mammoth chests farmed with all daily keys. It drops from Ice Mammoth chests (about 1 in 10).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"}, {"req": "Thorium weapon in use: crafted and enhanced to within 1 step of your steel weapon (IX against a steel X), a common threshold that raises weapon attack for every class. For materials and drop rates, see What each set costs.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium armor in use: all four pieces crafted and enhanced to III or more, which is where they overtake iron at VII. For materials and drop rates, see What each set costs.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium set enhanced further, weapon first and then armor, for Maevath; see Characters 'Boss readiness check'.", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Nordic Amulet equipped, or Jötunn chests farmed with all daily keys. It drops from Jötunn chests (about 1 in 20).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"}, {"req": "Sunstone weapon in use: crafted and enhanced to within 2–4 steps of your thorium weapon.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gaidy (Guides), Russian guide collection (Jivchik)"}, {"req": "Sunstone armor in use: crafted and enhanced to within 7 steps of your thorium armor.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gaidy (Guides), Russian guide collection (Jivchik)"}, {"req": "Infinite 1 armor crafted from Act 1 Hard materials (Grassy Stone 1) and worn with the Sunstone weapon. For materials and boss kills, see What each set costs.", "basis": "Guide", "source": "Gaidy (Guides), Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Anomalous Ring obtained from Choissiadyr, the second Act 3 boss.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Infinite 2 set crafted. Each piece consumes the matching Sunstone and Infinite 1 pieces plus Nightmare materials, and needs the Engineer Sun Scroll recipes.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gaidy (Guides), Russian guide collection (Jivchik)"}], "tables": [{"title": "Rings, amulets and belts", "cols": ["Item", "Slot", "From", "Fixed bonuses"], "rows": [["Iron Belt", "Belt", "Crafted at the Act 1 smith", "Shorter monster respawn time, +1 HP regen, +10 Drop Quantity"], ["Belt of Love", "Belt", "Killing Yrsainir", "+10% crit damage, +10 woodcutting power, +10 Drop Quantity"], ["Boss Amulet", "Amulet", "Bringer of Death chests", "+30% crit damage, +10 physical defence, +10 MEN"], ["Nordic Amulet", "Amulet", "Jötunn chests, about 1 in 20", "+7% crit chance, +5% movement speed, +70 magic defence"], ["Ring of STR", "Ring", "Kill Bringer of Death quest", "+2 STR, +10 physical defence, +30 attack per step (none at base)"], ["Tower Ring", "Ring", "Clearing 6 tower floors", "+2% crit chance, +20% crit damage, +10 physical and magic defence"], ["Mammoth Ring", "Ring", "Ice Mammoth chests, about 1 in 10", "+10% attack speed, +30% crit damage, +100 magic defence (wiki data; EvitaniaOnlineDB says +10 magic defence)"], ["Anomalous Ring", "Ring", "Choissiadyr (Act 3)", "+3% offline gains, +10% combat XP, +2% crit chance"], ["Harvest Belt", "Belt", "Harvest event shop in 2025 (the event runs to December 2; check this year's shop)", "-20% monster respawn time, +3% offline gains, +10% all XP"], ["Other event belts", "Belt", "Past event shops", "About -20% monster respawn time, plus Drop Quantity, XP, gold or offline gains"], ["Rabbit's Foot, Valentine Amulet", "Amulet", "Event shops", "+6% offline gains, Drop Quantity, and crit chance or XP"], ["Carrot, Steam, Mimic and Ashen Rings", "Ring", "Event shops and premium packs", "+50 attack, +3% offline gains, plus Drop Quantity, XP, crit or attack speed"]]}, {"title": "Weapons and armor", "cols": ["Set", "Armor defence per piece", "Weapon attack (sword / longsword / bow / staff)", "Extra"], "rows": [["Copper", "12–17", "30 / – / 25 / 30", "Act 1 smith"], ["Bronze", "25", "No bronze weapons", "Act 1 smith"], ["Iron", "36", "70 / 60 / 62 / 70", "Act 1 smith"], ["Steel", "43", "– / 79 / 86 / 97", "Act 1 smith; every piece gives +10% combat XP"], ["Thorium", "60", "154 / 118 / 126 / 154", "Act 2 smith"], ["Sunstone", "100", "– / 221 / 225 / 275", "Act 3 smith"], ["Infinite 1", "70–100", "– / 161 / 171 / 210", "Hard tab; +5–15 Drop Quantity a piece"], ["Infinite 2", "120", "– / 330 / 340 / 410", "Hard tab; +10–30 Drop Quantity a piece"]]}, {"title": "What each set costs", "cols": ["Item", "Materials", "Boss or special items", "Needs"], "rows": [["Iron armor (4 pieces)", "84 Iron Bars; 50 each of Candle, Weird Page, D20 Dice and Fire Essence", "None", "Late Act 1"], ["Iron weapon", "45 Iron Bars (30 plus 30 Pyrewood Logs for bow or staff)", "2 Yellow Feathers", "Late Act 1"], ["Steel weapon", "300 Steel Bars", "10 Dragon Horns, 1 Norse Essence", "Yrsainir dead, first steps in Act 2"], ["Steel armor (4 pieces)", "600 Steel Bars, 70 Furry Fur", "14 Death's Flowers", "Act 2 zones 1–4 for the fur"], ["Iron Belt", "20 Steel Bars", "2 Death's Flowers, 2 Dragon Horns", "Yrsainir dead"], ["Thorium weapon", "140 Crystallized Yellow Substance, 98 Thorium Bars", "2 Perfect Norse Essence (60 Norse Essence, which drops 1 in 10,000 in Act 2); 7 Artisan's Frames, 7 Furstrings or 3 Cryolite", "Thorium vein (after zone 5). The staff's Cryolite Ore drops in zones 9–12"], ["Thorium armor (4 pieces)", "102 Crystallized Yellow Substance, 264 Thorium Bars, 170 Perfect Fur (5,100 Furry Fur, which drops 1 in 200: about 1M kills before Drop Quantity)", "8 Norse Essence (1 in 10,000 in Act 2)", "Thorium vein"], ["Sunstone armor (4 pieces)", "2,670 Sunstone Bars; 40,000 Fez Fez, 35,000 Serpent Feather, 45,000 Bandiff Star", "19 Perfect Silk Fabric", "Act 3"], ["Sunstone weapon", "290–860 Sunstone Bars, 70,000 Beetleman Sting, 100K–600K Palm Tree Logs", "3 Perfect Aether Crystal", "Act 3"], ["Infinite 1 armor (4 pieces)", "115.2K Steel Bars, 144K Grassy Stone 1, 60 Crystallized Blue Substance (Act 3 shop)", "1,000 each of Death's Flower, The Crab's Pickaxe and Dragon Horn, plus a Grassy Core (another 1,000 of each): about 2,000 kills of each Act 1 boss", "Act 1 Hard"], ["Infinite 1 weapon", "15,000 Thorium Bars, 300K Icy Stone 1, 450K of an Act 3 drop", "2 Grassy Cores", "Act 2 Hard"], ["Infinite 2 piece", "The matching Sunstone and Infinite 1 pieces; 10,000–30,000 Grassy Stone 2 (armor) or 120K Icy Stone 2 (weapon)", "Crimson or Azure Geode and Sap; 1,000 Act 2 boss drops or Icy Cores", "Nightmare, and the Sun Scroll recipes"]]}, {"title": "Gear rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["When a new material pays off", "Enhancing adds the same flat amount per step on every material, so a fresh item of the next material is weaker than a well-enhanced old one. For thorium weapons, use within 1 step of steel as the common attack threshold: the base attack gains are 39 for longswords, 40 for bows and 57 for staves (75 for a thorium sword against a steel longsword), against 27.5 per enhancement step. Thorium armor equals iron about 5 steps higher, and sunstone armor equals thorium 8 steps higher. That is why the tiers say in use, not crafted.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["By class", "Weapons are per class: sword or longsword for the Warrior, bow for the Rogue, staff for the Mage. Armor is shared by all classes.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Enhancement steps", "Weapons and armor use enhancement levels I to XV (VII = +7). Each step adds 27.5 attack to a weapon and 5 defence to an armor piece. 'Within N steps of X' means at least X's enhancement level minus N.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Stones by act", "Enhance Stone 1 drops from Act 1 bosses, Enhance Stone 2 from Act 2 bosses, and Enhance Stone 3 only from Zhai Halud's Gate. Hard and Nightmare bosses drop Grassy Enhance Stone 1 in Act 1 and Icy Enhance Stone 1 in Act 2. Infinite Enhance Stone II is crafted at the Infinite smith (recipe: 100 Sunstone Bars, 1,000 Grassy Stone II and 1 Enhance Stone 2).", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Steel armor", "The steel armor set gives 43 defence a piece against iron's 36, +10% combat XP each, and set bonuses since the May 14 update; the set bonus value is not in the wiki data (unverified until checked in game). The guides skip it and go from enhanced iron straight to thorium; craft it if you want the XP or the set bonus.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai); Evitania Online news and update notes (Steam store)"], ["Thorium order", "The thorium axe needs 10 Mammoth Bitusks and the thorium pickaxe 10 Jötunn Eye, so tools come as each boss dies. For combat gear, enhance the weapon before the armor.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"], ["Accessories", "The boss rings, amulets and belts also gain attack as they are upgraded: 30 per step for up to 5 steps in the wiki data. Their other bonuses are fixed.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Event belts", "Event belts are the main source of shorter monster respawn time, which raises the kill cap.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Harvest event", "The Harvest event runs until 2 December 2026. If you have no event belt, check its shop: the Harvest Belt was in the 2025 Harvest event shop, and whether this year's shop has it is unverified.", "Estimate", "#patch-notes 0.319.4 to 0.323.2 (neype, developer); Evitania Online news and update notes (Steam store); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Enhance stones", "They come from boss drops, each act's vendor, quests and login bonuses. For vendor purchases, see the Daily tab's Act 1, Act 2 and Act 3 vendor tasks.", "Guide", "Guide to enhancing (MountTai); Act 2 progression (MountTai)"], ["Steel weapon achievement", "Enhancing the steel weapon to X also earns a 30-gem achievement.", "Guide", "Guide to enhancing (MountTai); Guides & Tips (EvitaniaOnlineDB)"], ["Durability", "Weapons and armor can be enhanced down to 0 durability without breaking; 0 only blocks further attempts until repaired.", "Game data", "Guide to enhancing (MountTai)"], ["Accessories", "Amulets, rings and belts need a duplicate, and a failed attempt destroys both. Max is V. Always enhance the spare, never your only copy.", "Guide", "Guide to enhancing (MountTai); Guides & Tips (EvitaniaOnlineDB)"], ["Failstacking", "Fail on purpose on a junk item to build bonus chance, then switch to the real item; the failure counter is shared by all items. The usual junk item is the Essence Sword, taken to where its success chance is 10% and repaired with copies of itself. Bone Daggers (from the Act 1 vendor's Animal Bone) are the cheap alternative.", "Guide", "Guide to enhancing (MountTai); Gaidy (Guides), Russian guide collection (Jivchik)"], ["Event gear", "Event equipment uses Enhance Stone 1 and goes up to XV.", "Game data", "Guide to enhancing (MountTai)"], ["Hand-me-downs", "Pass old sets to alts. Do not spend scarce materials enhancing alt gear early.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Warrior weapons", "Swords hit harder and suit bosses; longswords have the area damage for farming.", "Guide", "Warrior Weapons (Piwu)"], ["Ladder", "Copper, bronze, iron, steel (Act 1), thorium (Act 2), sunstone (Act 3), then Infinite 1 and Infinite 2 on the Hard tab. Steel has a full armor set and the Iron Belt (crafted from steel) as well as weapons. There is no Infinite 3 in the game data.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Sunstone or Infinite 1", "Sunstone has more damage and armor; Infinite 1 carries Drop Quantity. Start with Infinite 1 armor plus a Sunstone weapon. You need both sets in the end to craft Infinite 2.", "Guide", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Infinite 2", "Unlocked by the Sun Scroll upgrades Infinite II Armor (400 Sun Scroll) and Infinite II Weapons (600 Sun Scroll). A #guides thread warns that crafting it affects the enhancements on the pieces used; read it before crafting.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Currently my best setting in NIGHTMARE: act2 (BlueMoon)"], ["Infinite 2 Drop Quantity", "A player gives the full Infinite 2 set as 80 Drop Quantity, against +10 to +30 a piece.", "Player report", "Total Obtainable Drop Quantity (reply by t3hj00)"], ["Crimson drops", "Crimson Geode and Crimson Sap drop at 1 in 200K from mining and woodcutting.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Trinkets", "Since 0.321.0 there is a trinket slot as well; see Trinkets 'Trinket by role' and 'Swapping'.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"]]}], "icon": 396}, {"name": "Gatherer gear", "tiers": [{"req": "Iron axe and pickaxe crafted: the minimum for Ironwood and Thorium.", "basis": "Game data", "source": "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Steel axe and pickaxe crafted, the best tools from the Act 1 smith: 60 Steel Bars, 4 The Crab's Pickaxes and 10 Crystallized Yellow Substance each.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Thorium axe crafted: 10 Mammoth Bitusks, 40 Crystallized Yellow Substance, 30 Thorium Bars and 5 Norse Essence.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)"}, {"req": "Thorium pickaxe crafted: 10 Jötunn Eye, 40 Crystallized Yellow Substance, 30 Thorium Bars and 5 Norse Essence. It is the minimum for Sunstone ore.", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai); Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Thorium axe and pickaxe enhanced until their durability reaches 0 (X is the soft target).", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sunstone axe and pickaxe in use: crafted and enhanced to within 3 steps of your thorium tools.", "basis": "Game data", "source": "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sunstone axe and pickaxe at XV, the cap.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Tools", "cols": ["Tool", "Base power (axe / pickaxe)", "Recipe (axe; pickaxe)", "Extra"], "rows": [["Copper", "3 / 3", "3 Copper Bars, 1 Ash Log each", "Act 1 smith"], ["Bronze", "8 / 10", "20 Bronze Bars, 15 Goak Logs; 3 Bronze Bars, 15 Goak Logs", "Act 1 smith"], ["Iron", "63 / 60", "20 Iron Bars, 50 Pyrewood Logs; 3 Iron Bars, 15 Pyrewood Logs", "Act 1 smith. Enhances up to XV"], ["Steel", "76 / 70", "60 Steel Bars, 4 The Crab's Pickaxes, 10 Crystallized Yellow Substance each", "Act 1 smith, but the yellow comes from the Act 2 vendor. +15% woodcutting or mining XP"], ["Thorium", "90 / 80", "40 Crystallized Yellow Substance, 30 Thorium Bars, 5 Norse Essence, plus 10 Mammoth Bitusks (axe) or 10 Jötunn Eye (pickaxe)", "Act 2 smith. +5 CON (axe), +5 attack (pickaxe)"], ["Sunstone", "182 / 177", "600 Sunstone Bars, 15,000 Palm Tree Logs, 30,000 Cactus; 200 Sunstone Bars, 15,000 Palm Tree Logs, 40,000 Kangaroo Boomerangs; 1 Perfect Aether Crystal each", "Act 3 smith. +30% power, +10 CON"], ["Second Anniversary", "63 / 60", "Event shop", "+20% gathering speed, +20 multiloot"]]}, {"title": "Gatherer gear rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Crafting as a milestone", "For tools, crafting alone can be the goal, because a tool material unlocks resources: iron for Ironwood and Thorium, thorium for Sunstone ore and Palm wood. Steel and sunstone tools unlock nothing, so they count only once they out-gather what you had.", "Estimate", "Woodcutting/Mining Guide (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Enhancing tools", "Tools from iron upward enhance like weapons, up to XV, and each step adds 27.5 power. The enhancement targets in the tiers are estimates; late on, most power comes from runes and curios, not the tool.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The Three Musketeers Method (Dawnk)"], ["Steel or straight to thorium", "Steel tools add only 13 woodcutting and 10 mining power over iron, plus 15% XP. They cost 8 The Crab's Pickaxes and 20 Crystallized Yellow Substance for the pair, so they are worth it mainly for the XP while thorium is still out of reach.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Hand down", "Refine one axe and one pickaxe on the main gatherer and hand them down when you craft better ones.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Every character", "Give every character an axe: Act 2 ash needs a great deal of wood.", "Guide", "Woodcutting & Mining Talents Guide (Games Finder)"], ["Belt", "Belt of Love (from killing Yrsainir) adds 10 woodcutting power; event belts suit a parked gatherer for their offline gains.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Trinket", "For the main stat and when to wear it, see Trinkets 'Trinket by role', Gatherer row. Its value follows the piece and its level, and a Harvest piece gives half the power of the matching Halloween one; see the Trinkets system. Unverified: on 2026-11-14 a player in the Luminor stats thread wrote that the developers kept Harvest stats the same as Halloween's, with no screenshot; an Abundant Overgrowth seen in game settles it.", "Guide", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys) (2026-10-22 to 2026-11-14)"], ["Pet", "For gathering, the pet stats to want are Offline gains with Drop Quantity, XP or profession power.", "Guide", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Power targets", "What the tools need to reach at each stage is on the Gathering system.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"]]}], "icon": 394}, {"name": "Gathering", "tiers": [{"req": "Every Act 1 tree and vein felled in one hit.", "basis": "Estimate", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 450 and mining power 500 (Act 1 goals).", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 3,500 and mining power 4,000 (Act 2 goals), with thorium tools.", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 18,000 and mining power 20,000 (Act 3 goals).", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Woodcutting power 70,000 and mining power 80,000 (Hard goals), with sunstone tools.", "basis": "Guide", "source": "Woodcutting/Mining Guide (Johnny Treeman)"}, {"req": "Every Nightmare Act 2 tree and vein felled in one hit (350K woodcutting and 400K mining).", "basis": "Guide", "source": "Gaidy (Guides), Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Gathering rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["One-shot", "Always aim to fell every tree and vein in one hit; power comes first until you can.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 1 talents", "First 7 levels into power, then the first XP node on the bottom row, then top-row power.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 2 talents", "Top row completely. Runes and sacrifices add power on top.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Act 3 talents", "Get woodcutting and mining curios, then respec: max the bottom row, then the middle row. Levelled curios replace the lost power.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Crit row", "The middle row maxed gives 36% gathering crit chance and +76–92% crit damage. Offline income counts crits as extra power, which is why the late-game advice is bottom row fully, then middle row fully. With it maxed, about 240K woodcutting and 275K mining fell every Nightmare Act 2 tree and vein in one hit.", "Guide", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Levels", "Gathering levels matter for the flat power in the top row; farm XP or use hourglasses if they lag far behind combat.", "Guide", "Woodcutting/Mining Guide (Johnny Treeman)"], ["Alts", "See Gatherer gear 'Every character'.", "Guide", "Woodcutting & Mining Talents Guide (Games Finder)"]]}, {"title": "Power goals", "cols": ["Stage", "Best tool material", "Woodcutting", "Mining"], "rows": [["Act 1", "Iron, then Steel", 450, 500], ["Act 2", "Thorium", 3500, 4000], ["Act 3", "Sunstone", 18000, 20000], ["Hard", "Sunstone", 70000, 80000], ["Nightmare Act 2", "Sunstone", "350K", "400K"]]}, {"title": "Minimum tool material", "cols": ["Tool needed", "Resource"], "rows": [["None", "Copper ore, Ash wood"], ["Copper", "Tin ore, Goak wood"], ["Bronze", "Iron ore, Pyrewood"], ["Iron", "Thorium ore, Ironwood"], ["Thorium", "Sunstone ore, Palm wood"]]}, {"title": "Smeltery base times", "cols": ["Bar", "Base seconds each, before speed bonuses"], "rows": [["Charcoal", 75], ["Bronze Bar", 300], ["Iron Bar", 360], ["Steel Bar", 900], ["Chadcoal", 300], ["Thorium Bar", 7200], ["Palm Face", 450], ["Sunstone Bar", 10800]]}], "icon": 304}, {"name": "Gems", "tiers": [{"req": "Smeltery Multicraft maxed (1,250 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Six Premium Runes and the first three rune sockets bought (3,600 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Daily Fate Spiral bought (900 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "All four Engineer Slot Upgrades bought (1,250 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Curio inventory at 21–22 slots.", "basis": "Estimate", "source": "Gem Guide (Piwu)"}, {"req": "All 9 rune sockets bought (4,500 gems for the last six).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Hunter Cost Cruncher maxed (2,000 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Smeltery Speed maxed (950 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Smeltery Capacity maxed (750 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Hourglass Generator Speed at level 2 or more (550 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Awakening Amplifier bought (500 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Timeline Engine Speed at level 2 or more (650 gems).", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "Extra Rift Worker bought (700 gems), after the Golden Rift timeline upgrade.", "basis": "Guide", "source": "Gem Guide (Piwu)"}], "tables": [{"title": "Gem rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Order", "Tiers follow the Gem Guide's buy order, except that Daily Fate Spiral (its #2) sits third here because it cannot be bought before Act 3, and the curio slots (its #9) sit fifth so they are bought by the time Curio expects them.", "Guide", "Gem Guide (Piwu)"], ["Rune order", "Buy three Premium Runes, then alternate: 4th rune and 1st socket, 5th rune and 2nd socket, 6th rune and 3rd socket.", "Guide", "Gem Guide (Piwu)"], ["Socket timing", "Buy the remaining rune sockets as you build runewords.", "Guide", "Gem Guide (Piwu)"], ["Fate Spiral", "Keep 900 gems saved before entering Act 3. A chest costs 80 gems (unverified until checked in game), so the upgrade pays for itself in about 12 days.", "Guide", "Gem Guide (Piwu)"], ["Slot timing", "Buy each Engineer Slot Upgrade as its resource unlocks.", "Guide", "Gem Guide (Piwu)"], ["Skip", "The rest of the Upgrades tab can be skipped. Do not buy ash generation.", "Guide", "Gem Guide (Piwu)"], ["Income", "The daily quest gives 60 gems and many achievements pay 30.", "Game data", "Guides & Tips (EvitaniaOnlineDB)"], ["Other sinks", "A pet stat reroll (Tier 5–6 pets only) costs gems; the price rises with pet tier (EvitaniaOnlineDB's calculator uses 200 gems at Tier V). Unverified until checked in game. A Class Reset Brew (talent reset) costs 30 gems: cheap, but account upgrades come first. A gathering Mining Reset Potion costs 100 gems.", "Guide", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB); Character Talent Builds (Games Finder); Woodcutting & Mining Talents Guide (Games Finder)"], ["Dragon Milestones", "Hourglass dragons past level 7 have Dragon Milestones, a new gem sink.", "Game data", "Evitania Online news and update notes (Steam store)"], ["Boss keys", "Extra boss keys can be bought for gems, up to six a day.", "Game data", "Evitania Online news and update notes (Steam store)"]]}, {"title": "Upgrade costs", "cols": ["Tier", "Upgrade", "Total gems", "Cost of each level"], "rows": [[1, "Smeltery Multicraft", 1250, "150, 250, 350, 500"], [2, "Premium Runes x6", 2850, "150, 250, 350, 500, 700, 900"], [2, "First three rune sockets", 750, "150, 250, 350"], [3, "Daily Fate Spiral (Act 3)", 900, "900"], [4, "Engineer Slot Upgrade", 1250, "150, 250, 350, 500"], [5, "Curio inventory slots to 22 (Act 3)", 2550, "300, 350, 400, 450, 500, 550 (6 of the 12 ranks); the total assumes a 10-slot base and is unverified until checked in game"], [6, "Remaining rune sockets", 4500, "450, 550, 650, 800, 950, 1,100"], [7, "Hunter Cost Cruncher", 2000, "300, 350, 400, 450, 500"], [8, "Smeltery Speed", 950, "150, 200, 250, 350"], [9, "Smeltery Capacity", 750, "300, 450"], [10, "Hourglass Generator Speed (Act 3)", 1700, "200, 350, 500, 650"], [11, "Awakening Amplifier (Act 3)", 500, "500"], [12, "Timeline Engine Speed (Act 3)", 1900, "250, 400, 550, 700"], [13, "Extra Rift Worker (Act 3)", 700, "700"]]}], "icon": 516}, {"name": "Pets", "tiers": [{"req": "Bat pet claimed on every character (quest: Collect Bat Dust).", "basis": "Guide", "source": "Pets database and Pet Guide (EvitaniaOnlineDB)"}, {"req": "Main pet at level 50 (instant loot pickup).", "basis": "Game data", "source": "Beginner Guide (Treyex Gaming); Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB)"}, {"req": "Main pet at Tier 3 (500 food points in total), fed with Slymes. Shortcut: monthly login day 7 gives a free Tier 3 pet.", "basis": "Estimate", "source": "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB)"}, {"req": "Main pet at Tier 5 (2,400 food points in total): stat rerolls unlock.", "basis": "Estimate", "source": "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)"}, {"req": "Main pet at Tier 6 (max) (4,250 food points in total).", "basis": "Estimate", "source": "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)"}, {"req": "A Tier 5–6 pet for each activity you run, whose two rerollable stats match that activity.", "basis": "Guide", "source": "Which pet stats to use? (Piwu)"}], "tables": [{"title": "Pet rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Tier up", "Pets start at Tier 1. A pet must be level 50 to tier up, and its level resets to 1 afterwards. Needs 150, 350, 700, 1,200 then 1,850 food points per step.", "Game data", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)"], ["Food", "A sacrificed pet gives 51–100 points as an ungraded (Slyme) pet, 101–150 at Tier 1, 151–200 at Tier 2, 251–300 at Tier 3, 401–450 at Tier 4, 601–650 at Tier 5 and 851–900 at Tier 6.", "Game data", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)"], ["Slymes", "Slymes (Act 2 town egg) are food only and cannot be tiered up. Rare Slymes give no extra without the Engineer feeding upgrades.", "Game data", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Rerolls", "At Tier 5–6 one of the two secondary stats can be rerolled for gems; the price rises with pet tier (EvitaniaOnlineDB's calculator uses 200 gems at Tier V). Unverified until checked in game. The result is random.", "Game data", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB)"], ["How pets level", "A pet gets 1 XP for each item it picks up, however large the stack. Pickup has a cooldown that shrinks as it levels (4 seconds at first, none from level 40), so early levels cannot be rushed. The guide's figures are about 6 hours for levels 1–40 and at least 8 more hours to 50, from before a later rebalance. Chopping wood at full speed is a steady item supply.", "Guide", "Pet Leveling (Imenia)"], ["Pet levelling", "A pet levels only by picking up loot while equipped. Canned Knowledge potions come on monthly login days 5 and 6.", "Game data", "Beginner Guide (Treyex Gaming); Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB)"], ["Main pet", "Keep the main pet on your fastest farmer.", "Guide", "Beginner Guide (Treyex Gaming); Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12); Pets database and Pet Guide (EvitaniaOnlineDB)"], ["Feeding", "A food pet levelled to 50 before it is fed gives 50 more points; Slymes also get the Engineer feeding bonus.", "Game data", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Canned Knowledge", "Sets a pet to level 50 at once; it must pick up one item for the level to count.", "Game data", "Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)"], ["Slyme egg", "The Act 2 town egg hatches a Slyme every 16 hours. A Slyme has two stats; other pets have four.", "Game data", "Pet Guide (EvitaniaOnlineDB)"], ["Reroll pool", "The rerolled secondary stat comes from: All EXP, Offline Gains, \"Mob Spawn Time\", Woodcutting Power, Crit Damage.", "Game data", "Pet Guide (EvitaniaOnlineDB)"], ["Removing a pet", "Pets cannot be deleted; feed an unwanted one into a level 50 pet. Mony cannot be fed.", "Game data", "Pet Guide (EvitaniaOnlineDB)"], ["Transform", "150 gems changes a pet's look only.", "Game data", "Pet Guide (EvitaniaOnlineDB)"]]}, {"title": "Pet stats by activity", "cols": ["Mode", "Activity", "Stat 1", "Stat 2"], "rows": [["Online", "Hunting, casual", "Monster respawn time", "Drop Quantity or XP"], ["Online", "Low zone for materials, cards or runes", "Monster respawn time", "Drop Quantity"], ["Online", "Hunting during a monster respawn event", "XP", "Drop Quantity"], ["Online", "Gold farming", "Monster respawn time", "Gold multiplier"], ["Offline", "Hunting", "Monster respawn time", "Offline gains"], ["Online", "Gathering, cannot one-shot", "Mining or woodcutting power", "XP"], ["Online", "Gathering, one-shot", "XP", "Drop Quantity"], ["Offline", "Gathering, cannot one-shot", "Mining or woodcutting power", "Offline gains"], ["Offline", "Gathering, one-shot", "Offline gains", "Drop Quantity or XP"], ["Tower", "Crit chance 100% or more", "Attack speed", "Crit damage"], ["Tower", "Crit chance under 100%", "Crit chance", "Crit damage or attack speed"], ["Dungeons", "Event dungeons and raids", "Crit chance", "Crit damage"], ["Bosses", "Map bosses with keys", "Drop Quantity", "Anything"]]}, {"title": "Free pets", "cols": ["Pet", "How to get it", "Odds", "Stats"], "rows": [["Basic Bat", "Quest: Collect Bat Dust (Act 1)", "Sure", "Attack, defence, HP, crit chance"], ["Pebble", "Mining", "1 in 10M", "XP bonus, mining power"], ["Leaf Spirit", "Woodcutting", "1 in 10M", "XP bonus, woodcutting power"], ["Golden Piggy", "Achievement \"Update When?\", which since 0.316.2 targets Horus (Act 3)", "Sure", "Gold multiplier, offline gains"], ["Weird Book Pet", "Yrsainir (boss)", "1 in 100", "Attack, defence, crit chance, Drop Quantity"], ["Ghosty Pet", "Maevath boss", "1 in 100", "Attack speed, crit damage"], ["Beeb", "Any Act 1 monster", "1 in 5M", ""], ["Snowflake", "Act 2 monsters", "Drop", ""], ["Snek", "Act 3 monsters", "Drop", "Crit chance, crit damage"], ["Monkeycopter", "Guild shop top reward, since the Guilds update", "Shop", "Monster respawn time, All EXP"], ["Spiney", "Party-dungeon, Halloween and Harvest reward", "Reward", "Monster respawn time, Drop Quantity"], ["Mony", "Steam Event 2026: reach level 30 on a Steam Early Access account", "Sure", "HP, All EXP; cannot be fed"]]}], "icon": 472}, {"name": "Cards", "tiers": [{"req": "Crab card (Crabs, Act 1 zone 9) obtained (per
