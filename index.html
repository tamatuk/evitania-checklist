iles (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Card rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Alts", "Use alts to farm cards in lower zones, and prioritise high-star cards.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Gathering and defence cards", "The Stump and Pebble cards add woodcutting and mining power; the Watches card adds physical defence (x1.03 per star) before Jötunn.", "Estimate", "Event farming locations (MountTai); Act 2 progression (MountTai); Where's That Effect? A Guide! (Dawnk); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Drop Quantity", "Each point of Drop Quantity adds 1% to rare-loot chances: the rate is multiplied by (1 + Drop Quantity / 100).", "Game data", "#faq channel (neype, developer)"], ["Card drop chance", "Since a mid-2026 patch there is a separate Rune/Card Drop Chance stat; drops no longer depend on Drop Quantity alone.", "Game data", "Rune & Card Drop Chance Guide (Boushoku)"], ["Stars", "Cards needed for 0–4 stars: 1, 8, 24, 60, 360 in Act 1; 1, 12, 48, 100, 600 in Act 2 and for Hard cards; 1, 18, 72, 150, 900 in Act 3. The fourth star needs the Engineer Sun Scroll upgrade 4 Star Cards.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Other 4-star cards", "Besides the Hard and Snowman cards, Cactus Mommy, Crab and Helmet are worth taking to 4 stars.", "Estimate", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Nightmare cards", "The Act 1 and Act 2 Nightmare cards give nothing yet (confirmed in the 0.323.0 notes).", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Boss chests", "Killing a boss 30 times gives an achievement that lets you loot 5 chests at once.", "Game data", "Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper)"], ["Luck", "One player's rule of thumb in chat: prioritise sacrifice and Hunter work, since cards are more luck.", "Player report", "General chat message by maeqlin, 2026-05-15"], ["Base chance", "A monster card drops on 0.01% of kills in Act 1, 0.004% in Act 2 and 0.002% in Act 3. A boss chest gives the boss card half the time.", "Game data", "Cards database (EvitaniaOnlineDB)"], ["Crimson drops", "Crimson Geode (Act 1 veins) and Crimson Sap (Act 1 trees) drop at 1 in 200,000, in Nightmare mode only.", "Game data", "All Pets thread"]]}, {"title": "Cards worth knowing", "cols": ["Card", "Bonus", "Group", "Where it matters"], "rows": [["Crab", "Hunter cost reduction, +50% per star", "Discount", "All of Hunter"], ["Bringer of Death", "Combat XP +6% per star level", "Levelling", "Act 1 boss, daily keys"], ["The Crab", "Mining offline gains +2% per star level", "Gathering", "Act 1 boss, daily keys"], ["Yrsainir", "Combat offline gains +2% per star level", "Farming", "Act 1 boss, daily keys"], ["Helmet", "Hunter cost reduction, +75% per star", "Discount", "All of Hunter, from Act 2"], ["Animated Armor", "Attack %", "Damage", "Act 1 onward"], ["Wolf", "Crit damage", "Damage", "Act 1 onward"], ["Fire Elemental", "Drop Quantity", "Farming", "Act 1 onward"], ["Slime Cube", "Offline battle gains", "Offline", "Act 1 onward"], ["Stump", "Woodcutting power", "Gathering", "Ironwood in Act 2"], ["Pebble", "Mining power %", "Gathering", "Thorium in Act 2"], ["Kobold", "Physical defence (flat)", "Defence", "Act 1 onward"], ["Ice Mammoth", "Crit chance", "Damage", "Act 2"], ["Snowman", "Attack multiplier, x0.03 per star level", "Damage", "From Maevath onward"], ["Cactus Mommy", "Attack multiplier, x0.05 per star level", "Damage", "Act 3"], ["Draugr", "Drop Quantity +3", "Farming", "Act 2"], ["Jötunn", "Drop Quantity +5", "Farming", "Act 2 boss"], ["Sun Boy", "Drop Quantity +4", "Farming", "Act 3"], ["Dung Beetle", "Physical defence multiplier, x0.06", "Defence", "Act 3"], ["Djinn", "Rune drop chance +4%", "Farming", "Act 3"], ["Horus", "Card drop chance +4%", "Farming", "Act 3"], ["Plant, Iceboar, Kangaroo", "Smeltery speed +15%, +35%, +50%", "Utility", "One per act"], ["Act 2 Hard card", "Raises the sacrifice cap (+4–12)", "Unlock", "Act 2 Hard"], ["Watches", "Physical defence multiplier", "Defence", "Act 2"], ["Troll", "HP multiplier", "Low priority", "Act 2"], ["Act 1 Hard card", "Raises the Hunter cap (+4–12)", "Unlock", "Needed at 3 stars for Act 2 Hard (unverified: EvitaniaOnlineDB recommends maxing the Act 1 Hard card, written before 4-star cards; at 1 in 30,000 a drop, 3 stars is about 3M kills before bonuses; check in game)"], ["Bandiff", "Sand generation x2 (0 stars) to x6 (4 stars)", "Hourglass", "Act 3"], ["Beetleman", "Timeline engine x1.2 (0 stars) to x2.0 (4 stars)", "Hourglass", "Act 3"]]}], "icon": 108}, {"name": "Runes", "tiers": [{"req": "Rune system unlocked and the GOR + MU + HAS runeword from the Go to Act 2 Town quest slotted (top-left slots).", "basis": "Guide", "source": "Act 2 progression (MountTai); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"}, {"req": "PRE x6 runeword active: +20 Drop Quantity, +20% offline gains, +200 attack, +2 portal kills. The 6 Premium Runes cost 150 + 250 + 350 + 500 + 700 + 900 = 2,850 gems.", "basis": "Guide", "source": "Gem Guide (Piwu); Act 2 progression (MountTai); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "TYR + SUR + VEX + LUM runeword active: +50% XP, +300 attack, +5% offline gains.", "basis": "Estimate", "source": "Runewords and their drop locations (Miothan)"}, {"req": "DOT + WIR + YUR + SKO runeword active: +100 mining and woodcutting power, +40 multiloot. Needs Act 1 Hard for YUR.", "basis": "Estimate", "source": "Runewords and their drop locations (Miothan)"}, {"req": "APEX + SIRC + WER runeword active: +10% crit chance, +60% crit damage, +5 Drop Quantity. Needs Act 1 Hard for WER.", "basis": "Estimate", "source": "Runewords and their drop locations (Miothan)"}, {"req": "FAL + FAL + TES + WAR runeword active: +50% gold, +400 HP, +10 Drop Quantity. Needs Act 3 for TES and WAR.", "basis": "Estimate", "source": "Runewords and their drop locations (Miothan)"}, {"req": "WAR + YUR + GRO + MIN + TYR + FAL runeword active: x1.5 attack, +10% offline gains, +20 Drop Quantity.", "basis": "Estimate", "source": "Runewords and their drop locations (Miothan)"}], "tables": [{"title": "Rune rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Runewords", "The whole recipe must sit in the same rune circle. A runeword replaces its runes' individual bonuses with a larger one.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"], ["Merging", "Three identical runes can merge into the next rune level. Rune level 1: 3 runes is a 50% chance and 6 is 100%. Rune levels 2 and 3: 3 runes is 33% and 9 is 100%. A failed merge returns one rune.", "Game data", "Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper); Rune merging and runeword effect threads"], ["Farming", "Farm the first rune of a family and merge upward to the one you need.", "Guide", "Runewords and their drop locations (Miothan)"], ["Sockets", "Buy more sockets as you become able to make runewords.", "Guide", "Gem Guide (Piwu)"], ["Starter word", "GOR + MU + HAS gives +200 HP, +1 portal kill and +10% All EXP. It is the cheapest runeword (all level-1 runes): the Go to Act 2 Town quest gives all three runes, and spare GOR drops in Act 3 zones 1–4.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Ascending", "Players report that random ascension reaches legendary runes faster than saving for the guaranteed merge.", "Player report", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Sockets", "You start with 6 sockets and 14 inventory slots; the gem shop sells 9 more sockets.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Order", "The order of tiers 3–7 is by where the runes drop, not from a guide.", "Estimate", "Runewords and their drop locations (Miothan)"], ["Portal kills", "Each +1 portal kill makes a kill count once more toward opening a zone portal.", "Game data", "Rune merging and runeword effect threads"]]}, {"title": "Rune families", "cols": ["Rune level 1–4", "Where the first rune drops", "Stat", "Value per rune level"], "rows": [["NIL, DOT, WIR, GRO", "Act 2: Iceboar to Yeti", "Woodcutting power", "10, 18, 24, 30"], ["FUS, YIT, SKO, MIN", "Act 2: Ratatoskr to Troll", "Mining power", "10, 18, 24, 30"], ["MU, RO, FON, FAL", "Act 2: Penguin to Draugr; also Act 1 Hard/Nightmare bosses and the Go to Act 2 Town quest", "Gold", "1%, 2%, 4%, 5%"], ["HAS, OLU, SUR, TYR", "Act 2 bosses; Act 3 zones 5–8 (Fez to Beetleman); the Go to Act 2 Town quest", "All EXP", "1%, 2%, 4%, 5%"], ["RYS, LUM, ORT, VEX", "Act 2 Ironwood tree; Act 3 Palm tree", "Attack", "15, 27, 36, 45"], ["WOM, SIRC, APEX, BEB", "Act 2 Thorium ore; Act 3 Sunstone ore", "Crit damage", "5%, 9%, 12%, 15%"], ["KI, WER, ANG, YUR", "Act 1 Hard monsters", "Physical defence", "4, 8, 16, 20"], ["GOR, BOL, TES, WAR", "Act 3: Sun Boy to Kangaroo; the Go to Act 2 Town quest", "HP", "22, 44, 88, 110"], ["PRE", "Gem shop", "Drop Quantity, offline, attack", "+2, +2%, +30 each"]]}], "icon": 186}, {"name": "Engineer", "tiers": [{"req": "Engineer unlocked (a character at level 40), Idea's Gold Upgrade at 5 or more, and the Idea item, wood and ore speed upgrades at 1 or more.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Blueprint unlocked (1,000 Idea), with Idea still showing a positive rate, then the cheap Blueprint unlocks: Daily Activity Enhancer I bought and Smelting Patterns at 20 (276 Blueprint).", "basis": "Guide", "source": "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Hunter Tax Returns (Idea) at 5 (max): a 25% chance of a refund on each Hunter level (37,200 Idea in total).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "Hunter Tax Returns (Blueprint) at 5 (max) for 6,200 Blueprint, Runic Blueprint unlocked (600 Blueprint).", "basis": "Game data", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 1 Engineer Priority Guide (Games Finder)"}, {"req": "More Materials (Blueprint) at 10 (max), Achievement Hunter at 10 (max) and Faster Portals bought.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Runic Blueprint running: Humble Sacrifices at 5 (max), Vendor Stock (Runic) at 3 (max) and Bonfire Prototyping at 20.", "basis": "Guide", "source": "Act 1 Engineer Priority Guide (Games Finder); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "More Hunting (Blueprint) at 5 (max) and More Materials (Runic Blueprint) at 10 (max).", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "More Hunting and More Sacrifices (Runic Blueprint) at 5 (max) each, and Sun Scroll unlocked (6,000 Runic Blueprint).", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"}, {"req": "Sun Scroll: Double Crit, 4 Star Cards, More Materials at 10 (max), and Infinite II Armor and Infinite II Weapons bought.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}, {"req": "Sun Scroll: More Hunting and More Sacrifices at 5 (max) each, which completes +15 Hunter cap and +10 sacrifice cap from the Engineer.", "basis": "Estimate", "source": "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"}], "tables": [{"title": "Engineer rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Idea first", "Every other resource consumes Idea. Keep it your most-crafted resource or you hit constant bottlenecks.", "Guide", "Engineer (Johnny Treeman)"], ["Base rates", "With no upgrades Idea makes 720 an hour, while Blueprint and Runic Blueprint together use 1,067. Sun Scroll uses 25.5 Blueprint and 18.2 Runic Blueprint an hour against 20 and 6.7 made. So nothing above Idea runs nonstop until the slots below it are sped up.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Ratio to aim for", "Sun Scroll runs nonstop once Runic Blueprint makes 2.7×, Blueprint 2.2× and Idea 3.6× their base rate. The wiki's efficiency calculator works this out for your own numbers.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineering Everything in one place: cost tables and efficiency calculator (Toxic)"], ["Speeding a slot", "Each slot has four speed upgrades. Gold Upgrade gives +20% a level and doubles in price each level (from 1,000 gold for Idea, 30,000 for Blueprint, 100K for Runic Blueprint, 300K for Sun Scroll). Gold Upgrade caps at 22, 17, 15 and 13 levels for Idea, Blueprint, Runic Blueprint and Sun Scroll. The item, wood and ore upgrades give +5% a level and rotate through materials of that slot's act.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Engineer (Johnny Treeman)"], ["Slot materials", "Idea and Blueprint use Act 1 materials (Blueprint wants Pyrewood Log and Iron Ore), Runic Blueprint uses Act 2 monster drops, Ironwood Log and Thorium Ore, and Sun Scroll uses Act 3 drops, Palm Tree Log and Sunstone Ore.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Gem slots", "Each Engineer Slot Upgrade doubles one resource's generation: Idea, then Blueprint, Runic Blueprint, Sun Scroll (150, 250, 350, 500 gems).", "Guide", "Gem Guide (Piwu); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Bottlenecks", "A red, negative rate means a resource is consumed faster than it is made. Pause the consumer: select it and press the pause button beside the main image.", "Guide", "Engineer (Johnny Treeman)"], ["Hunter Tax Returns", "Each level adds a 5% chance that a Hunter level refunds materials; ten levels (Idea and Blueprint) make it a 50% chance. The Engineer guide says a refund returns half, about a quarter off Hunter costs on average, but the wiki data does not give the size: unverified until checked in game. Humble Sacrifices does the same for sacrifices, up to 25%.", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["More Materials", "Adds combat multiloot, which raises the ordinary drop every monster gives, including Hunter and sacrifice materials. It is in three versions (10 levels each), so it is the Engineer's main help for material farming.", "Game data", "Engineer (Johnny Treeman); Gaidy (Guides), Russian guide collection (Jivchik); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Vendor Stock", "The Idea and Blueprint versions raise the Act 1 vendor's daily stock; the Runic Blueprint one raises the Act 2 vendor's (more Crystallized Yellow Substance a day); the Sun Scroll one raises Act 3's.", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Keys", "Each Daily Activity Enhancer adds 1 key for finishing the daily quests, and each keyring level raises the key cap by 1 (5 levels in each of three versions).", "Game data", "Engineer (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Remote upgrades", "Remote Engineering (6,000 Blueprint) lets slot upgrades take materials from the stash; Remote Crafting, Remote Hunting and Remote Sacrificing do the same for those systems.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Open-ended upgrades", "Smelting Patterns (+6% smeltery speed a level) and Combat Experience (+1%) cost 276 Blueprint for 20 levels, 748 for 30 and 4,472 for 50. Bonfire Prototyping (+1% ash chance) and Pet Training (+2% pet XP) cost 215 Runic Blueprint for 20, 558 for 30 and 2,871 for 50. All go to 200.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Double Crit", "Crit chance above 100% becomes a chance of a double crit (130% is a 30% chance). There are no triple crits, so nothing past 200% helps.", "Game data", "Gaidy (Guides), Russian guide collection (Jivchik); Engineer (Johnny Treeman)"], ["Balance", "Unlock everything, but do not neglect Hunter and sacrifices meanwhile.", "Guide", "Gem Guide (Piwu)"]]}, {"title": "Production chain", "cols": ["Resource", "Time per unit", "Consumes", "Base per hour"], "rows": [["Idea", "5 seconds", "Nothing", 720], ["Blueprint", "3 minutes", "30 Idea", 20], ["Runic Blueprint", "9 minutes", "70 Idea + 1 Blueprint", 6.7], ["Sun Scroll", "33 minutes", "14 Blueprint + 10 Runic Blueprint", 1.8]]}, {"title": "Engineer upgrades", "cols": ["Resource", "Upgrade", "Levels and total cost", "Effect"], "rows": [["Idea", "Hunter Tax Returns", "5 levels, 37,200", "+5% chance a level to refund a Hunter level's materials"], ["Idea", "Vendor Stock", "3 levels, 11,200", "+1 Act 1 vendor stock a level"], ["Idea", "Mining Industries, Johnny Treeman", "To 200; 20 levels cost 5,739", "+1% mining or woodcutting XP a level"], ["Idea", "Blueprint", "1,000", "Unlocks Blueprint production"], ["Blueprint", "Hunter Tax Returns", "5 levels, 6,200", "+5% refund chance a level"], ["Blueprint", "More Materials", "10 levels, 10,382", "+1 combat multiloot a level"], ["Blueprint", "Achievement Hunter", "10 levels, 10,382", "Achievements grant Drop Quantity"], ["Blueprint", "More Hunting", "5 levels, 10,550", "+1 Hunter cap a level"], ["Blueprint", "Faster Portals", "1,800", "+1 portal kill"], ["Blueprint", "Daily Activity Enhancer I", "200", "+1 key from daily quests"], ["Blueprint", "Basic Keyring", "5 levels, 2,638", "+1 key cap a level"], ["Blueprint", "Vendor Stock", "3 levels, 2,800", "+1 Act 1 vendor stock a level"], ["Blueprint", "Smelting Patterns, Combat Experience", "To 200; 20 levels cost 276", "+6% smeltery speed or +1% combat XP a level"], ["Blueprint", "Remote Engineering", "6,000", "Slot upgrades can use the stash"], ["Blueprint", "Runic Blueprint", "600", "Unlocks Runic Blueprint production"], ["Runic Blueprint", "Humble Sacrifices", "5 levels, 6,200", "+5% chance a level to refund half a sacrifice's materials"], ["Runic Blueprint", "More Materials", "10 levels, 10,382", "+1 combat multiloot a level"], ["Runic Blueprint", "More Hunting", "5 levels, 13,188", "+1 Hunter cap a level"], ["Runic Blueprint", "More Sacrifices", "5 levels, 13,188", "+1 sacrifice cap a level"], ["Runic Blueprint", "Vendor Stock", "3 levels, 2,800", "+1 Act 2 vendor stock a level"], ["Runic Blueprint", "Slime Feeding (four kinds)", "400 each", "+30%, +50%, +70%, +100% food points from each Slyme rarity"], ["Runic Blueprint", "Faster Hatching", "4 levels, 6,000", "-0.5 hours egg cooldown a level"], ["Runic Blueprint", "Rune Stacking", "3 levels, 17,000", "Rune stack size 100, 400, 900 (unverified: may add to a base of 100, and the 0.315.2 notes say the stack goes \"up to 1000\"; check in game)"], ["Runic Blueprint", "Daily Activity Enhancer II, Advanced Keyring", "200 and 2,638", "+1 daily key; +1 key cap a level"], ["Runic Blueprint", "Bonfire Prototyping, Pet Training", "To 200; 20 levels cost 215", "+1% ash chance or +2% pet XP a level"], ["Runic Blueprint", "Remote Crafting", "5,000", "Crafting can use the stash"], ["Runic Blueprint", "Sun Scroll", "6,000", "Unlocks Sun Scroll production"], ["Sun Scroll", "Double Crit", "120", "Crit chance above 100% can double crit"], ["Sun Scroll", "4 Star Cards", "400", "Cards can reach 4 stars"], ["Sun Scroll", "Infinite II Armor, Infinite II Weapons", "400 and 600", "Unlock the Infinite 2 recipes"], ["Sun Scroll", "More Materials", "10 levels, 3,115", "+1 combat multiloot a level"], ["Sun Scroll", "More Hunting", "5 levels, 3,956", "+1 Hunter cap a level"], ["Sun Scroll", "More Sacrifices", "5 levels, 3,956", "+1 sacrifice cap a level"], ["Sun Scroll", "Remote Hunting, Remote Sacrificing", "600 each", "Hunter and sacrifices can use the stash"], ["Sun Scroll", "Faster Hatching", "4 levels, 1,800", "-0.5 hours egg cooldown a level"], ["Sun Scroll", "Daily Activity Enhancer III, Master Keyring, Vendor Stock", "60, 792 and 840", "+1 daily key; +1 key cap a level; Act 3 vendor stock"], ["Sun Scroll", "Gold Research", "To 200; 20 levels cost 210", "+1% gold a level"]]}], "icon": 57}, {"name": "Curio", "tiers": [{"req": "Curio system opened in the Act 3 town and all 5 active slots filled.", "basis": "Guide", "source": "Curio System (Johnny Treeman); Guides & Tips (EvitaniaOnlineDB)"}, {"req": "All 5 active slots hold Blue or better curios.", "basis": "Estimate", "source": "Curio System (Johnny Treeman)"}, {"req": "Curio inventory at 21 slots or more.", "basis": "Guide", "source": "Gem Guide (Piwu)"}, {"req": "100 chests opened and the pity legendary claimed.", "basis": "Game data", "source": "Curio System (Johnny Treeman); Evitania Online: Idle RPG spreadsheet, Upgrades, Bonfire, Runes, Curio and Cards tabs (Zerozapper)"}, {"req": "Curio presets saved for pushing, offline farming and gathering.", "basis": "Guide", "source": "Curio System (Johnny Treeman)"}, {"req": "Active curios at level 30.", "basis": "Estimate", "source": "Curio System (Johnny Treeman)"}, {"req": "Active curios at level 50 with their ascension levels maxed.", "basis": "Estimate", "source": "Curio System (Johnny Treeman)"}], "tables": [{"title": "Curio rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Chests", "Fate Spirals come from the daily upgrade, chests at 80 gems each (unverified until checked in game), achievements, logins, the Hourglass shop (a Curio for Gold-rift gold, 100 rising x1.3 over 10 purchases, about 4,260 gold) and the paid Curio Pack (an extra daily roll). For the choice each roll offers, see Curio 'Daily Fate Spiral'; for the upgrade purchase, see Gems tier 3.", "Game data", "Curio System (Johnny Treeman); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Inventory", "21 inventory slots hold all 20 curios plus a spare.", "Guide", "Gem Guide (Piwu)"], ["Coins", "Active curios earn coins up to a cap, so collect often. Coins level curios; salvaging unwanted curios gives more.", "Game data", "Curio System (Johnny Treeman)"], ["Ascension", "One duplicate raises a curio's ascension level by one, adding passives.", "Game data", "Curio System (Johnny Treeman)"], ["Wish", "Since the Harvest Event update (12 November 2026) you can wish for one Legendary curio: if a Legendary drop misses it, the next Legendary is the wished one. Spare Legendaries trade back for rolls, and chests can auto-open until a chosen rarity drops.", "Game data", "Harvest Event"], ["Presets", "Curio and rune layouts can be saved as presets (six pages each) that switch with your activity. Pages are account-wide, but which page an activity uses is set per character; presets replace the old snapshotting trick. Unlocks at combat level 70.", "Game data", "Halloween Update; Presets Quick Guide (Tidds)"], ["Active set", "Match the active set to what you are doing: crit curios for pushing, defence for offline, woodcutting or mining for gathering.", "Guide", "Curio System (Johnny Treeman)"], ["Universal", "Curios are an Act 3 system, but their stats apply everywhere.", "Game data", "Curio System (Johnny Treeman)"], ["Daily Fate Spiral", "Each roll shows three curios and you keep one. For the upgrade purchase and value, see Gems 'Fate Spiral'; for opening it each day, see the Daily tab's 'Open the daily Fate Spiral'.", "Game data", "Curio list, coin cap and Fate Spiral threads; Gem Guide (Piwu)"], ["Pity", "Every roll adds a pity point, and a normal Legendary does not reset them. 100 pity points buy one guaranteed Legendary from the pity chest.", "Game data", "Curio list, coin cap and Fate Spiral threads; Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Coin Cap", "6 ranks, each adding 500 to the cap, cost 450, 550, 650, 750, 850 and 950 gems (4,200 in total). Leave it until the other gem upgrades are bought.", "Guide", "Curio list, coin cap and Fate Spiral threads; Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"]]}, {"title": "Curio rarities", "cols": ["Rarity", "Coins to max (level 50)", "Drop rate", "Coins per hour and max ascension level"], "rows": [["White", 49200, "45%", "2–5 an hour; ascension level 3"], ["Green", 53440, "34%", "7–10 an hour; ascension level 3"], ["Blue", 57680, "19%", "13–19 an hour; ascension level 6"], ["Purple", 68420, "1.6%", "20–29 an hour; ascension level 9"], ["Gold (Legendary)", 77400, "0.4%", "30–39 an hour; ascension level 9"]]}, {"title": "Curio types", "cols": ["Type", "Curios, lowest to highest rarity", "Best for", "Ascension bonuses (1–3, 4–6, 7–9)"], "rows": [["XP", "Ever Eclipsed Sun (gold only)", "Everything", "Mining XP, woodcutting XP, combat XP"], ["Crit", "Pandemonium Egg, Shattered Vow", "Pushing and online grinding", "Portal kills, attack speed, crit chance"], ["Gold", "Century Tome, Crystal Cranium, Necromancer's Hand", "Online item grinding", "Drop Quantity, monster respawn time, movement speed"], ["Defence", "Ceremonial Dagger, Entombed Mask, Cup of Indulgence, Jade Scarab", "Offline content", "Offline gains, combat offline gains, magic defence"], ["Woodcutting", "Fifth Slab, Urn Flask, Swirling Tear, Servant's Idol, Blooming Desert", "Woodcutting", "Offline gains, multiloot, speed"], ["Mining", "Elden Monolith, Sected Bypiramid, Worm's Horn, Ichored Specimen, Wyrd Goblet", "Mining", "Offline gains, multiloot, speed"]]}, {"title": "Curio stats by rarity", "cols": ["Rarity", "Attack, level 1–50", "Second stat, level 1–50", "Coins per hour at ascension level 0"], "rows": [["White", "x1.06–1.12", "Mining or woodcutting power x1.2–1.8", 2], ["Green", "x1.075–1.15", "Power x1.24–1.96; physical defence x1.15–1.45", 7], ["Blue", "x1.1–1.2", "Power x1.3–2.2; defence x1.19–1.57; gold 19–57%", 13], ["Purple", "x1.125–1.25", "Power x1.4–2.6; defence x1.24–1.72; gold or crit damage 24–72%", 20], ["Gold", "x1.15–1.3", "Power x1.5–3.0; defence x1.3–1.9; gold or crit damage 30–90%; All EXP 50–200%", 30]]}, {"title": "Curio ascension bonuses", "cols": ["Type", "Ascension levels 1–3, each", "Ascension levels 4–6, each", "Ascension levels 7–9, each"], "rows": [["Crit", "+1 portal kill", "+2% attack speed", "+3% crit chance"], ["Gold", "+5 Drop Quantity", "-1% monster respawn time", "+3% movement speed"], ["Defence", "+1% offline gains", "+1% combat offline gains", "x0.03 magic defence"], ["Mining, woodcutting", "+1% offline gains for that skill", "+5 multiloot", "+3% speed"], ["XP", "+10% mining XP", "+10% woodcutting XP", "+10% combat XP"], ["Every curio", "+1 coin an hour per ascension level", "", ""]]}], "icon": 206}, {"name": "Hourglass", "tiers": [{"req": "Hourglass started in Act 3 and every generator before Liquid Glass at level 50.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26)"}, {"req": "Liquid Glass, Limestone Mass, Pristine Glass, Cromlech Bricks and Condensed Vortex at level 100.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26)"}, {"req": "Hourglass level 2: every upgrade in the first upgrade row maxed.", "basis": "Guide", "source": "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10); Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26)"}, {"req": "Hourglass level 3 (Timeline open) and the first timeline reset done.", "basis": "Guide", "source": "Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26); Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"}, {"req": "Hourglass level 5: Rifts open.", "basis": "Guide", "source": "Hourglasses Guide (EvitaniaOnlineDB)"}, {"req": "Hourglass level 7: Echo, Dragons, Rebirth and Secret Knowledge open, and with them Restoration of Eternity (three more tabs, 15 new generators, new rifts and gem-shop items; added in 0.320.0).", "basis": "Game data", "source": "Hourglasses Guide (EvitaniaOnlineDB); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"}, {"req": "Upgrade row 11 reached (needs the Golden Claw generator).", "basis": "Game data", "source": "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"}, {"req": "Golden dragon bought (1.2e10 Echoes): it strengthens the Red, Blue and Green dragons. Optional: no stage expects it yet.", "basis": "Game data", "source": "Hourglasses Guide (EvitaniaOnlineDB); Hourglass Dragons Planer (plsd0ntcry [AKATS] -Wulf-) (2026-10-26 to 2026-11-03)"}, {"req": "Rebirth running: its items merged up and its 5x5 grid opened past the first 3x3 with Eternity tree cells. Optional: no stage expects it yet.", "basis": "Game data", "source": "Hourglasses Guide (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"}], "tables": [{"title": "Hourglass rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Currencies", "Sand is made by the generators and pays for generator levels, upgrades and Hourglass levels. Infinity is earned by a timeline reset, once the Timeline opens at Hourglass level 3, and pays for timeline upgrades.", "Guide", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10); Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26)"], ["Generators", "Each newer generator makes the older ones obsolete; put sand into the latest. Generator speed doubles at levels 25, 50, 100, 200, 300 and so on.", "Guide", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["Generator order", "Sandstone Sample, Glass Sample, Water Sample, Clay Block, Bit of Knowledge, Liquid Glass, Limestone Mass, Pristine Glass, Cromlech Bricks, Condensed Vortex, Sol Essence, Locked Orery, Golden Bit (spelling to check in game), Golden Scales, Golden Claw. Restoration of Eternity adds 15 from level 7: Golden Horn, Golden Fang, Final Grain, Red Star Teseract (spelling to check in game), Golden Scarab, Ruby Eyeris (spelling to check in game), Prismatic Beacon, Unstable Element, Warped Geomentry (spelling to check in game), Unleashed Formula, Attraction Anchor, Arcane Carapace, Trypa Sphere (spelling to check in game), Bothsides Amulet (spelling to check in game), Follpwer Insignia (spelling to check in game). The Unstable Element's first purchase costs about E143 sand and out-produces the Prismatic Beacon only around level 50–100; the 50% Prismatic Beacon talent is needed to reach it.", "Game data", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10); Hourglasses Guide (EvitaniaOnlineDB); Hourglass Talents Guide (Rhalf - Getchmen)"], ["Golden Claw upgrade row", "Golden Claw is the 15th original generator and the level 7 ones start at the 16th, so upgrade row 11 may come before the level 7 generator row; unverified until checked in game.", "Estimate", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Upgrades", "Early on, max an upgrade row's upgrades before moving on. After 0.320.0 you are mostly forced to buy the sand-generator side upgrades, and old upgrades costing e50 become affordable; Piwu holds the timeline reset to take upgrades 11 and 12 together. A timeline reset also resets upgrades. Timeline engine gains matter most.", "Guide", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["First reset", "Reset as soon as the Timeline opens and spend the first 10 infinity on three upgrades.", "Guide", "Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26); Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["Rifts", "Once open, Rifts outpace engine gains.", "Guide", "Hourglasses Guide (EvitaniaOnlineDB)"], ["Gems", "Generator Speed first; until Hourglass level 3 it is the only gem upgrade that does anything. Then Awakening Amplifier, Timeline Engine Speed, Extra Rift Worker, following the Gems tiers.", "Guide", "Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26); Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["Cards", "The Bandiff card multiplies sand generation and the Beetleman card the timeline engine.", "Game data", "Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["Act 3 hourglasses", "Time-skip hourglass items cannot be used in Act 3 until you have beaten its final boss (not yet in the game).", "Game data", "Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Level costs", "EvitaniaOnlineDB lists sand for levels 2–8 as 1e9, 1e15, 1e24, 1e36, 1e51, 1e74 and 1e120. Piwu's guide gives 100B and 100Qa for levels 2 and 3, so check the in-game figure.", "Game data", "Hourglasses Guide (EvitaniaOnlineDB); Hourglass of Eternity Progressive Guide (Piwu) (2026-07-19, Part 2 2026-10-10)"], ["Pace", "Level 4 is the last cheap step: level 5 costs twelve orders of magnitude more. Go past 4 only with spare sand.", "Guide", "Hourglasses Guide (EvitaniaOnlineDB)"], ["Time-skip items", "A time-skip hourglass advances only the active character: combat, mining, woodcutting and ash per kill. It does not advance other characters, the Smeltery, Bonfire ash from fuel, the pet egg or curio coins. Boss chests contain one 10% of the time. The 24-hour shop time-skip adds no Hourglass sand (player report).", "Game data", "Hourglasses Guide (EvitaniaOnlineDB); Infinite Hourglass Guide, quick and dirty (Imenia) (2026-07-16, posts to 2026-07-26)"], ["Talents", "From levels 12 and 16 the Hourglass talents also cost Act 3 wood and ore: about 280K wood and 550K ore to reach level 70 (a 700% bonus). Buy diamond upgrades top to bottom, left to right. Take talents 12 and 16 only once you hold the wood and ore (2026-07-20). The last Generator Speed talent can be skipped (2026-08-08). The second sand rift is weak next to timeline gains (2026-10-30). From level 7 focus on Echoes until the Golden dragon (2026-11-02). The level 7 unlock is the small bar under the hourglass (2026-11-16). The talent order after level 7 is posted only as screenshots, in the talents thread this row cites.", "Guide", "Hourglass Talents Guide (Rhalf - Getchmen)"], ["Level 7", "Rebirth is the 9th Hourglass slot, which the FAQ calls the white dragon though it is no dragon of the Dragons row. It rolls one Timeline Output or Sand item every 2 hours per EvitaniaOnlineDB, or one token an hour per the FAQ, with tokens building up offline; both unverified until checked in game. 3 items merge into 1 of the next level (5 into 2 with the upgrade). A sand tile gives about +1.02% sand and a timeline engine output tile about +1.01%. Its 5x5 grid starts with 3x3 open; the rest unlocks with cells in the Eternity tree. Secret Knowledge has up to 6 pages of up to 6 slots, and only the active page counts.", "Game data", "Hourglasses Guide (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Dragons", "Five dragons: Red (sand income), Blue (timeline engine), Green (upgrade time), Golden (1.2e10 Echoes; strengthens the other three) and Black (5.1e19 Echoes). Every 25 dragon levels is a x2 milestone. Train a Red or Blue milestone as soon as it takes no longer than the next Green one, else train Green; rough pacing is Red at about Green / 2 + 25, and Blue 25 at Green 250, 50 at 550 and 75 at about 850. The Golden dragon is a big speed-up, and the planner's Solo level mode suits active play. Dragon Milestones is a gem-shop item; since 0.323.2 the Black Dragon gets no milestones.", "Guide", "Hourglass Dragons Planer (plsd0ntcry [AKATS] -Wulf-) (2026-10-26 to 2026-11-03); Hourglasses Guide (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Time Echo", "A Time Echo level costs about 1e74 x 1.46^level sand (level 30 about 5.8e78), and the echo button works like MAX on generators. zoofy's calculator compares echoes against upgrades.", "Guide", "Hourglass Calculators/Time Echo Costs (zoofy, data by Leanea)"]]}], "icon": 236}, {"name": "Characters", "tiers": [{"req": "A Warrior with all class-skill nodes (green) taken.", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB); Warrior Talent Guide (Piwu); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"}, {"req": "Second character made.", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB)"}, {"req": "Third slot used (opens after Yrsainir).", "basis": "Guide", "source": "Guides & Tips (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"}, {"req": "Fourth slot used (opens at the Watches zone in Act 2).", "basis": "Guide", "source": "Act 2 progression (MountTai)"}, {"req": "Fifth slot used (opens on killing Maevath, since 0.321.0).", "basis": "Game data", "source": "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"}, {"req": "Rune and curio presets set up for mobs, bosses, mining and woodcutting on every character (unlocks at combat level 70).", "basis": "Guide", "source": "Presets Quick Guide (Tidds); #patch-notes 0.319.4 to 0.323.2 (neype, developer); Gaidy (Guides), Russian guide collection (Jivchik)"}, {"req": "Nightmare respec done for roles other than Rare-drop farmer: XP and Drop Quantity talents swapped for attack speed, crit chance and crit damage. Rare-drop farmers keep Magicfind for boss chests and cards.", "basis": "Guide", "source": "Warrior Talent Guide (Piwu)"}], "tables": [{"title": "Character rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["Warrior talents", "See the Roster tab's 'Pick order' and Warrior talent tree for the class-skill order.", "Guide", "Warrior Talent Guide (Piwu)"], ["First character", "Make the first character a Warrior; for talent priorities, see the Roster tab's 'Pick order'.", "Guide", "Guides & Tips (EvitaniaOnlineDB); Warrior Talent Guide (Piwu); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Main and alts", "The main pushes; the alt farms lower zones for cards, materials, gold and Hunter levels.", "Guide", "Guides & Tips (EvitaniaOnlineDB)"], ["Second slot", "When the second slot opens is unverified: EvitaniaOnlineDB's beginner guide says you start with 2 slots, its classes page says it opens after the first boss; check in game.", "Guide", "Guides & Tips (EvitaniaOnlineDB); Classes & talents (EvitaniaOnlineDB)"], ["Roster mix", "Have at least one Warrior and one Rogue in the roster.", "Guide", "Guides & Tips (EvitaniaOnlineDB); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Crit first", "See the Roster tab's 'Pick order' and 'Pusher' for damage and utility talent priorities.", "Guide", "Warrior Talent Guide (Piwu)"], ["Skip", "See the Roster tab's 'Warrior' for the late nodes to skip.", "Guide", "Warrior Talent Guide (Piwu)"], ["Boss readiness check", "Before each Act 2 boss, check kills per hour on your main in the boss's zone. Aim for: Yeti zone about 500 (Ice Mammoth), Troll zone about 1,000 (Jötunn), Draugr zone over 1,000 and about 1,300 physical defence (Maevath). If you are short, raise Hunter trainings and sacrifices first.", "Guide", "Act 2 progression (MountTai)"], ["Jötunn: adds", "Troll map, the red portal. After the first hand falls he summons monsters that explode for over 3,000 damage, possibly an instant kill. Kill each one before anything else.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB); jotun (Steam discussion); Act 2 progression (MountTai); Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Jötunn: eye beam", "When the eyes glow, run from under the hand to the far side of the map, starting near the screen edge. You should take at most one tick; most characters survive 4–5 full beams.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB); jotun (Steam discussion)"], ["Jötunn: hands", "Stand under a hand to bait a punch, step out as it lands and hit the hand. Go behind the hand for the side slap and leave the middle for the ice breath. Once both hands are gone his HP drains by itself.", "Guide", "How to kill Jotunn (DiskEntrega); Jotunn (Steam discussion, with developer neype)"], ["Jötunn: length", "Hand drops are random, so the fight is long and mostly waiting: about 10 minutes, with 12 beams and over 20 slaps. A Mage's lightning can hit the body instead of the hand.", "Guide", "Boss fights - pure RNG (Jotun...) (Steam discussion); Jotunn (Steam discussion, with developer neype)"], ["Mammoth Ring", "Disputed. One player in the Discord guide reports the Mammoth Ring (+100 magic defence) cut Jötunn's eye beam from over 600 a hit to about 100, but a Steam player thinks the beam scales with physical defence, and EvitaniaOnlineDB lists the ring's magic defence as +10. The ring's attack speed and crit damage hold either way.", "Player report", "How to kill Jotunn (DiskEntrega); jotun (Steam discussion); Gear database (EvitaniaOnlineDB)"], ["Shared progress", "Hunter, sacrifices, cards, Curio and the stash are account-wide; levels and talents are per character.", "Game data", "Guides & Tips (EvitaniaOnlineDB)"], ["Lone Wolf", "Unlocked by killing Yrsainir. Since 0.321.0 it gives +50 Drop Quantity and +50% XP and gold for giving up the other slots.", "Game data", "Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Lone Wolf or alts", "Alts are still stronger, so Lone Wolf is optional.", "Guide", "Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)"], ["Class by stage", "No class is best all game. Warrior is easiest early and online but is the only class with a move-speed penalty in the offline formula; Rogue is the best offline farmer until Hunter and sacrifices are high; Mage is best online and offline once you farm at the kill cap.", "Guide", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Attributes", "STR, DEX and INT each give +10% attack to their class. CON gives +5% HP and +1% HP regen; MEN gives +5% MP, +1% MP regen and +5% magic defence.", "Game data", "Gaidy (Guides), Russian guide collection (Jivchik)"], ["Stat maths", "Final stat = sum of flat x sum of percent x product of multipliers, so true multipliers (x1.5) are worth the most late.", "Game data", "Gaidy (Guides), Russian guide collection (Jivchik); #faq channel (neype, developer)"], ["Level unlocks", "Tower at level 25, Engineer at 40, event dungeons and the Halloween quest chain at 50, guilds at 60 (registered account), presets at 70 and Act 2 Hard at combat level 80.", "Game data", "Evitania Online: Idle RPG spreadsheet, Bosses, Gear and Fresh Acc tabs (Zerozapper); #patch-notes 0.319.4 to 0.323.2 (neype, developer); Evitania Online news and update notes (Steam store)"], ["Defence check", "A monster's hit falls to chip damage of 0 once your Defence is at or above its Attack. Compare with the monster tables below.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Bringer of Death fight", "Step back 3–4 steps from the frontal leap. In the poison gas, leave the marked zone and kill the flower shooters in the corners.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["The Crab fight", "Back away from the chomp, then return. Keep walking to break the root. Below 30% HP its armor and shield counterattacks are gone.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Yrsainir fight", "Wait until he lands, then stand inside him under the chin: hits drop from 200–400 to about 99 and the sweep and breath miss. When he flies, go to the stairs and climb once the flames are out. Iron gear is enough.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Ice Mammoth fight", "Stay on the hitbox for the flame stamp. Run back or sideways when it rears up. Break one ground crystal to stun the stampede, and use an active ice crystal to interrupt the howl. The frontal stomp and an unstunned stampede can kill outright.", "Guide", "Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Maevath fight", "Stand close to dodge the claws and breath cone; when he inhales, run to the far left or right. When he flies, kill the Draugrs quickly so the stairs appear, or he stays airborne and the lower floor fills with flames. In stage 2 use the green safe zone and kill adds fast. Keep potions for the last phase.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Zhai Halud's Gate fight", "Step out of the tentacle slam and return. When the worm comes swirling from the right, run to the left corner. It spawns mini worms underground: kill them all, go back up on the left side, and repeat.", "Guide", "Boss threads: Maevath, Zhai Halud's Gate, Yrsainir; Boss Mechanics & Strategy Guide (EvitaniaOnlineDB)"], ["Hard", "The Obelisk's Hard difficulty multiplies base material drops by 16. Act 1 Hard has no listed requirement beyond reaching the Act 3 Obelisk.", "Game data", "Obelisk (EvitaniaOnlineDB)"]]}, {"title": "Classes", "cols": ["Class", "Notes", "Role", "Best maps"], "rows": [["Warrior", "The usual first character and the easiest talent tree. Class skills unlock in the order Warrior, Rogue, Mage. The talent tree here has Defence as 7 nodes with 35 ranks; the wiki data has 35 ranks over 6 nodes (unverified until checked in game).", "First character, main pusher", "Flat single-platform maps"], ["Rogue", "Good late game. No Bonus XP nodes, so slower to level, but more Drop Quantity than a Warrior.", "Farmer, woodcutter", "Tight maps with 1–2 platforms"], ["Mage", "Area attacks; unlock class skills first, including the 100% crit skill. The talent tree here gives Bonus XP 15 ranks; the wiki data gives 25 over \"Nodes 1–2\" (unverified until checked in game).", "Later character", "Maps with 3 or more spawn platforms, such as Crabs"]]}, {"title": "Bosses", "cols": ["Boss", "Where", "HP", "Attack"], "rows": [["Bringer of Death", "Act 1, Plant zone", "3,000", "26"], ["The Crab", "Act 1, Crab zone", "80,000", "175"], ["Yrsainir", "Act 1 final boss, Fire Elemental zone", "400K in the spreadsheet, 800K on EvitaniaOnlineDB", "350"], ["Ice Mammoth", "Act 2, Yeti zone", "840K in the spreadsheet, 2.4M on EvitaniaOnlineDB", "700"], ["Jötunn", "Act 2, Troll zone", "4.8M", "900"], ["Maevath", "Act 2 final boss, Draugr zone", "50M", "1,900"], ["Zhai Halud's Gate", "Act 3", "400M", "5,000"], ["Choissiadyr", "Act 3, second boss", "3.15B", "5,000"], ["Act 1 Hard bosses", "Monsters there have 3M HP and 1,400 attack", "100M", "2,000"], ["Act 2 Hard bosses", "Monsters there have 25M HP and 3,000 attack", "1.25B", "4,500"], ["Nightmare", "Monsters only so far", "300M in Act 1; Act 2 is 450M on the wiki, 2.5B on EvitaniaOnlineDB", "4,100 and 5,100"]]}, {"title": "Monsters by zone", "cols": ["Zone", "Monster", "HP", "Attack"], "rows": [["Act 1, 1", "Boar", "3", 0], ["Act 1, 2", "Wasp", "6", 1], ["Act 1, 3", "Pebble", "21", 1], ["Act 1, 4", "Stump", "40", 10], ["Act 1, 5", "Plant", "80", 13], ["Act 1, 6", "Wolf", "480", 25], ["Act 1, 7", "Gnoll", "1,000", 35], ["Act 1, 8", "Animated Armor", "2,000", 100], ["Act 1, 9", "Crabs", "4,000", 140], ["Act 1, 10", "Bat", "7,000", 85], ["Act 1, 11", "Kobold", "9,000", 95], ["Act 1, 12", "Weird Book", "12,000", 95], ["Act 1, 13", "Slime Cube", "15,000", 105], ["Act 1, 14", "Fire Elemental", "20,000", 115], ["Act 2, 1", "Iceboar", "40,000", 200], ["Act 2, 2", "Helmet", "80,000", 200], ["Act 2, 3", "Ghost", "140K", 200], ["Act 2, 4", "Yeti", "240K", 262], ["Act 2, 5", "Ratatoskr", "320K", 277], ["Act 2, 6", "Watches", "382K", 327], ["Act 2, 7", "Snowman", "456K", 365], ["Act 2, 8", "Troll", "567K", 438], ["Act 2, 9", "Penguin", "624K", 600], ["Act 2, 10", "Glass", "686K", 800], ["Act 2, 11", "Matryoshka", "755K", "1,000"], ["Act 2, 12", "Draugr", "831K", "1,200"], ["Act 3, 1", "Sun Boy", "1.5M", "1,500"], ["Act 3, 2", "Dung Beetle", "2.5M", "1,700"], ["Act 3, 3", "Cactus Mommy", "4.5M", "1,900"], ["Act 3, 4", "Kangaroo", "6.5M", "2,200"], ["Act 3, 5", "Fez", "11.5M", "2,500"], ["Act 3, 6", "Winged Serpent", "15.8M", "2,700"], ["Act 3, 7", "Bandiff", "22.3M", "2,900"], ["Act 3, 8", "Beetleman", "31.5M", ""]]}], "icon": 383}, {"name": "Trinkets", "tiers": [{"req": "First trinket equipped (trinkets drop only while an event runs; event dungeons open at character level 50).", "basis": "Estimate", "source": "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"}, {"req": "A trinket on each character you play with the main stat the Trinket by role table gives for its role.", "basis": "Guide", "source": "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"}, {"req": "The trinket on your Pusher at its max level.", "basis": "Estimate", "source": "Trinkets sub stats (AlexG); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"}, {"req": "A max-level Legendary trinket reforged with the two stats you want guaranteed.", "basis": "Estimate", "source": "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"}], "tables": [{"title": "Trinket rules", "cols": ["Topic", "Rule", "Basis", "Source"], "rows": [["What they are", "Added in 0.321.0: an item for the one trinket slot, with a main stat and up to four sub-stats. Trinkets drop only while an event runs, from every dungeon difficulty, with a bonus for running solo. The event shop, monthly and login rewards have none, so they can be missed between events.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Dungeon gates", "Dungeon difficulties are gated by attack; the highest difficulty needs 10M since 0.323.1, and zone-bound bonuses such as the Bonfire's heated-zone attack no longer count.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Main stats", "HP, ATK, Gold %, All EXP %, mining power or woodcutting power. Each event has four pieces of rising size, and the main stat's size follows the piece and its level (Trinket pieces). All EXP also covers mining and woodcutting XP. The main stat cannot be rerolled.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys) (2026-10-22 to 2026-11-14)"], ["Same trinket, different values", "Two trinkets with the same stat but different values are different pieces or levels. Bountiful Tusk, Generous Cornucopia and Plentiful Bihorn start at 20, 30 and 40 mining power and gain with level, so a level 5 Cornucopia shows 40. Keep the largest piece for each stat and feed the rest into it.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)"], ["Sub-stats", "There are 12: Offline Gains %, Drop Quantity, crit chance, crit damage, MEN, CON, STR, DEX, INT, HP %, mining power % and woodcutting power %. Only some roll active (white): 0–1 / 1–2 / 2–3 / 3–4 on a Black Candle / Candlestick / Candelabra / Luminor and their Harvest sizes; the rest are greyed. A sub-stat starts at its base, on a Luminor +1% Offline Gains or +2 Drop Quantity, and every third trinket level one random sub-stat, possibly a greyed one, gains a step; reaching a Luminor's maximum can take all five of its steps on one sub-stat (see Luminor maxima). Which ones to want depends on the role: see Trinket by role.", "Game data", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Luminor Base/Max stats (Stratasys) (2026-10-22 to 2026-11-14); Trinkets sub stats (AlexG)"], ["Luminor maxima", "Community tables disagree: Drop Quantity 10–12 at max, crit damage 35–40%, STR, DEX or INT 20–25 (AlexG: 10, 40%, 25; Stratasys: 12, 35%, 20). Neither is game data.", "Player report", "Luminor Base/Max stats (Stratasys) (2026-10-22 to 2026-11-14); Trinkets sub stats (AlexG)"], ["Swapping", "There is one trinket slot, and presets switch runes and curios but not trinkets. Put the ATK or HP trinket on by hand for bosses, the tower and dungeons, and the farming one back on before you park the character.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Levelling", "An Upgrade Flask is 10 XP; other trinkets can be fed in too, a Black Candle / Candlestick / Candelabra / Luminor size giving 120 / 200 / 400 / 600 XP. Flasks are spent first. Disassembling gives 12 / 20 / 40 / 60 flasks for those sizes, and returns the material spent on levelling minus 20%.", "Game data", "Trinkets sub stats (AlexG); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Reforge", "Since 0.323.0 any trinket can be reforged with Reforge Feathers, and a max-level Legendary can lock up to two stats for guaranteed upgrades; you may keep the old layout.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Harvest trinkets", "Until 2 December 2026 (Harvest event), Harvest dungeons drop Bountiful Tusk, Generous Cornucopia, Plentiful Bihorn and Abundant Overgrowth.", "Game data", "#patch-notes 0.319.4 to 0.323.2 (neype, developer)"]]}, {"title": "Trinket by role", "cols": ["Role", "Main stat", "Sub-stats", "When to wear it", "Basis", "Source"], "rows": [["Pusher", "ATK; HP instead for a boss that kills you, which matters little in solo event dungeons, where you revive", "Crit chance and crit damage", "Bosses, the tower and dungeons; see Trinkets 'Swapping'.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion); Luminor Base/Max stats (Stratasys) (2026-10-22 to 2026-11-14); #patch-notes 0.319.4 to 0.323.2 (neype, developer)"], ["Material farmer", "All EXP", "Offline Gains, then Drop Quantity, crit chance, class stat (Soso, for a parked farmer)", "While it farms, parked or online", "Player report", "Best trinket upgrades (Steam discussion); The BEST Luminors You Can Get! (Soso)"], ["Rare-drop farmer", "All EXP", "Drop Quantity, then Offline Gains. Soso's order for an active farmer: a Rogue Drop Quantity > MEN > crit damage > crit chance > DEX; a Warrior the same with STR; a Mage the same without MEN", "While it opens boss chests and farms cards. Drop Quantity is only a sub-stat and counts only for boss chests and cards.", "Guide", "'Drop Quantity' stat and intention (Steam discussion, with developer neype and MountTai); Best trinket upgrades (Steam discussion); The BEST Luminors You Can Get! (Soso)"], ["Leveller", "All EXP", "Offline Gains", "All the time", "Player report", "Best trinket upgrades (Steam discussion)"], ["Gatherer", "Mining or woodcutting power, matching its skill, until its power is capped, then All EXP (Soso); All EXP also covers gathering XP", "Offline Gains, then Drop Quantity, mining or woodcutting power %, STR for mining or DEX for woodcutting (Soso)", "While it gathers", "Guide", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); The BEST Luminors You Can Get! (Soso)"], ["Any character parked offline", "Its farming stat: All EXP, or a gatherer's power", "Offline Gains first", "While parked; see Trinkets 'Swapping'.", "Player report", "Best trinket upgrades (Steam discussion); Can someone explain Trinket Enhancing? (Steam discussion)"], ["Gold", "Soso's pick for a combat farmer, active or parked, once it is damage-capped: Gold > All EXP > ATK. Below the cap, and for one Luminor worn for all content (All EXP > Gold > ATK), farmers keep All EXP", "As for its farmer role", "While a damage-capped combat farmer farms; otherwise filler until an All EXP trinket drops", "Guide", "The BEST Luminors You Can Get! (Soso)"]]}, {"title": "Trinket pieces", "cols": ["Piece (Halloween / Harvest)", "Max level", "Sub-stats (active when rolled)", "All EXP %", "Gold %", "ATK", "HP", "Mining or woodcutting power (Halloween / Harvest)"], "rows": [["Black Candle / Bountiful Tusk", 6, "1, 0–1 active", "16–20.8", "12–16.8", "12–16.8", "40–64", "40–56 / 20–28"], ["Candlestick / Generous Cornucopia", 9, "2, 1–2 active", "24–34.8", "18–28.8", "18–28.8", "60–114", "60–96 / 30–48"], ["Candelabra / Plentiful Bihorn", 12, "3, 2–3 active", "32–51.2", "24–43.2", "24–43.2", "80–176", "80–144 / 40–72"], ["Luminor / Abundant Overgrowth", 15, "4, 3–4 active", "40–70", "30–60", "30–60", "100–250", "100–200 / 50–100"]]}], "icon": 397}], "stages": ["Act 1 start", "Act 1 mid", "Act 1 done", "Mammoth dead", "Jötunn dead", "Act 2 done", "Gate dead", "Hard Act 1", "Hard Act 2", "Nightmare"], "reached": ["New account", "Hunter unlocked at Stumps (zone 4); runs until Yrsainir", "Yrsainir killed", "First Act 2 boss killed", "Second Act 2 boss killed", "Maevath killed", "Zhai Halud's Gate killed (first Act 3 boss); Sunstone zones open", "Act 1 Hard opened at the Act 3 Obelisk", "Act 2 Hard unlocked (combat level 80, the three Hard Act 1 bosses dead, Act 1 Hard card at 3 stars)", "Nightmare difficulty open"], "aliases": {"Act 3 early": "Gate dead"}, "expect": {"Hunter": [0, 1, 2, 4, 5, 6, 7, 7, 8, 9], "Bonfire": [0, 0, 2, 4, 6, 8, 8, 8, 8, 8], "Ash": [0, 0, 1, 1, 3, 5, 6, 7, 7, 7], "Sacrifice": [0, 0, 0, 2, 4, 5, 6, 7, 8, 9], "Pusher gear": [0, 0, 3, 4, 8, 8, 9, 10, 11, 12], "Gatherer gear": [0, 0, 1, 2, 3, 5, 5, 6, 6, 7], "Gathering": [0, 0, 2, 2, 2, 3, 3, 4, 5, 5], "Gems": [0, 0, 1, 1, 1, 2, 3, 5, 9, 13], "Pets": [0, 1, 1, 1, 1, 2, 3, 4, 5, 6], "Cards": [0, 0, 3, 4, 5, 5, 5, 7, 7, 9], "Runes": [0, 0, 0, 1, 1, 2, 3, 5, 6, 7], "Engineer": [0, 0, 1, 3, 4, 4, 5, 7, 8, 10], "Curio": [0, 0, 0, 0, 0, 0, 2, 3, 6, 7], "Hourglass": [0, 0, 0, 0, 0, 0, 1, 3, 5, 7], "Characters": [1, 2, 3, 4, 4, 5, 6, 6, 6, 7], "Trinkets": [0, 0, 1, 1, 1, 1, 2, 2, 3, 4]}, "daily": [["Any", "Complete the daily quest", "60 gems and the day's boss keys (3, +1 for each Engineer Daily Activity Enhancer I-III)", "Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "quest"], ["Any", "Claim the daily login tracks", "Days you were online but did not claim stack (Monthly and 7-Day); they need a registered account", "Guides & Tips (EvitaniaOnlineDB); Evitania Online news and update notes (Steam store)", "login"], ["Any", "Spend boss keys (30 cap, +5 for each Engineer Keyring version, up to 45)", "Boss cards, pets and Enhance stones", "Beginner Guide (Treyex Gaming); Guides & Tips (EvitaniaOnlineDB); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "boss-keys"], ["Any", "Act 1 vendor: buy all the Enhance Stone 1 (3 a day; Engineer Vendor Stock raises it) and the Animal Bone", "Stones for gear up to steel. Each bone crafts a Bone Dagger, a cheap item to fail on when building enhance chance", "Guide to enhancing (MountTai); Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Gaidy (Guides), Russian guide collection (Jivchik)", "vendor-1"], ["Act 2+", "Act 2 vendor: buy all the Crystallized Yellow Substance and the Enhance Stone 2", "The vendor is its only source. Thorium weapons take 140 each, the armor set 102, thorium tools 40 each, steel tools 10 each, and Wish for Gold uses it later", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Act 2 progression (MountTai)", "vendor-2"], ["Act 3+", "Act 3 vendor: buy all the Crystallized Blue Substance and the Enhance Stone 3", "The vendor is its only source. Infinite 1 armor takes 60, and Perfect Silk Fabric and Perfect Aether Crystal use 3 and 6 a craft", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi)", "vendor-3"], ["Level 25+", "Run the Tower attempts", "Gold, gems and keys", "Beginner Guide (Treyex Gaming)", "tower"], ["Any", "Check mail and new codes", "Free gems", "Frequently Asked Questions (Johnny Treeman) (2026-10-22, reply 2026-11-08)", "mail-codes"], ["Cost Cruncher bought", "If you bought Cost Cruncher: before any other Hunter purchase, buy your most expensive planned Hunter level", "Needs at least one level of Hunter Cost Cruncher (300 gems). Any Hunter purchase uses up the whole stacked discount, so let the expensive one take it", "Gem Guide (Piwu); Guides & Tips (EvitaniaOnlineDB); Evitania Online news and update notes (Steam store)", "cost-cruncher"], ["Act 2+", "Refuel the Bonfire with Chadcoal", "No fire means no ash", "Act 2 progression (MountTai); Bonfire (EvitaniaOnlineDB)", "bonfire-fuel"], ["Act 2+", "Act 2 town: collect the Slyme from the egg", "The egg hatches one every 16 hours; Slymes are pet food", "Pet Guide (EvitaniaOnlineDB); Pet system (Johnny Treeman) (2026-05-28, posts to 2026-08-12)", "slyme-egg"], ["Fate Spiral bought", "Open the daily Fate Spiral", "One curio a day", "Gem Guide (Piwu)", "fate-spiral"], ["Act 3+", "Collect curio coins before they cap", "Coins stop accruing at the cap", "Curio System (Johnny Treeman)", "curio-coins"], ["Level 50+", "Run the event dungeons while an event is on", "Trinkets and event rewards. Dungeon difficulties are gated by attack (highest difficulty 10M). Dungeon keys stack to 20, so a missed day is not lost", "#patch-notes 0.319.4 to 0.323.2 (neype, developer); Evitania Online news and update notes (Steam store)", "event-dungeons"], ["Level 60+, in a guild", "Log in and make the two daily donations (500K and 10M gold)", "Activity, seals and guild funds. The weekly guild kill task needs playing, not only a login", "Guilds (Piwu); Evitania Online news and update notes (Steam store)", "guild-donations"], ["Hourglass level 5+", "Check the Hourglass rifts and start any that finished", "Rifts run 8, 10, 12 or 20 hours and open at Hourglass level 5", "Evitania Online wiki data files (evitania-online.com, github.com/badbotexe/evi); Hourglasses Guide (EvitaniaOnlineDB)", "hourglass"]], "shareSys": ["Hunter", "Bonfire", "Ash", "Sacrifice", "Pusher gear", "Gatherer gear", "Gathering", "Gems", "Pets", "Cards", "Runes", "Engineer", "Curio", "Hourglass", "Characters", "Trinkets"], "shareDaily": ["quest", "login", "boss-keys", "vendor-1", "vendor-2", "vendor-3", "tower", "mail-codes", "cost-cruncher", "bonfire-fuel", "slyme-egg", "fate-spiral", "curio-coins", "event-dungeons", "guild-donations", "hourglass"], "about": [["What it is", "A progression checklist for Evitania Online – Idle RPG. Pick your stage and set your tier in each system by hand; the page shows what is expected next."], ["How to use", "Pick your stage at the top. Set your tier for each system with the plus and minus buttons, or open a system and click the highest tier you have reached. The Daily tab lists today's tasks for your stage. The Talents tab draws talent trees by class, role and level. Backup saves everything as a file or link."], ["Basis: Guide", "The tier or rule is a target or recommendation stated in the source."], ["Basis: Game data", "The tier or rule is a game threshold, cost or unlock reported by the source. Game data also covers values calculated directly from game numbers."], ["Basis: Estimate", "Ordered or set from several sources; no single guide states it as a target. Treat it as a draft."], ["Basis: Player report", "One or a few players' observations in a forum or Discord thread, not confirmed by a guide or the game data; treat it as a hint."], ["Stage expectations", "The expected tier at each stage is a synthesis of the guides, not a community standard."], ["Event tiers", "Trinkets drop only from event dungeons, so a tier that needs one, such as Trinkets tier 1, can show behind between events."], ["No save import", "Since game version 0.311.0 the save file is encrypted and the developers ask players not to share ways to decode it, so tiers are set by hand."], ["Freshness", "Sources dated 2025-09-25 to 2026-11-16, read up to 2026-11-16; undated sources excluded from the date range, around game version 0.323.2 (kept by hand). The oldest (the Hunter guide by Sakori, 2025) is used only for cost formulas. All sources are unofficial; check values in-game after patches."], ["Not covered", "Guild research, the Tower and fishing have no tiers here: the guides for them are thin or not written yet. The Hourglass Rebirth has no guide of its own yet. Trinkets have four tiers (three are estimates) and a role table; event dungeons, Lone Wolf and co-op content have no tiers. Fishing is still an event mini-game."]], "sources": [{"name": "Hunter and Sacrifice min/max optimizations (HyZerg) (2026-07-04, follow-up 2026-09-09)", "where": "Discord #guides", "link": "https://discord.com/channels/1219291890940383334/1522871447511367820", "date": "2026-09-09"}, {"name": "The Hunter (Sakori) (2025-04-20, c const tierStageInt=(n,k)=>{const i=D.expect[n].findIndex(v=>v>=k);return i<0?NST+1:i+1};
function tierStage(n,k){const s=tierStageInt(n,k),tot=sysBy(n).tiers.length;let lo=k,hi=k;
  while(lo>1&&tierStageInt(n,lo-1)===s)lo--; while(hi<tot&&tierStageInt(n,hi+1)===s)hi++;
  return s-1+(k-lo+1)/(hi-lo+1)}
function stagePos(n,t){const tot=sysBy(n).tiers.length; if(t>=tot) return NST+1;
  const nx=tierStageInt(n,t+1); if(t===0) return nx-1;
  return tierStageInt(n,t)===nx?tierStage(n,t):nx-1}
const stageDiff=n=>stagePos(n,tierOf(n)===null?0:tierOf(n))-(stageIdx()+1);
function status(n){const t=tierOf(n),e=expected(n);
  if(!hasStage()) return {k:'none',t:'',l:'No stage picked'};
  if(t===null) return e===0?{k:'idle',t:'–',l:'Not needed yet'}:{k:'warn',t:'?',l:'Tier not set'};
  const d=Math.floor(stageDiff(n)+1e-9),w=x=>x+' stage'+(x===1?'':'s');
  if(d>0) return {k:'good',t:'+'+d,l:'Your tier is what is expected '+w(d)+' ahead of your stage'}; if(d===0) return {k:'good',t:'0',l:'On track for your stage'};

function buildOrder(cls,role){const T=D.trees[cls],by={};T.nodes.forEach(n=>by[n.o]=n);const base=T.nodes.map(n=>n.o).sort((a,b)=>a-b);

document.getElementById('main').addEventListener('change',ev=>{const e=ev.target; if(e.id==='bkfile'){const f=e.files&&e.files[0]; if(!f)return; if(f.size>2e6){bkSay('That file is too large to be a checklist backup.');return} const r=new FileReader(); r.onload=()=>bkCheck(String(r.result)); r.onerror=()=>bkSay('Could not read that file.'); r.readAsText(f); return} if(!e.dataset||!e.dataset.ch) return; const c=state.chars[+e.dataset.ci]; if(!c) return; const k=e.dataset.ch;
  if(k==='cls'||k==='role') c[k]=e.value; else if(k==='level') c.level=Math.max(1,Math.min(200,parseInt(e.value)||1)); else if(k==='pts') c.pts=e.value===''?null:Math.max(0,Math.min(400,parseInt(e.value)||0));
  state.chars=cleanChars(state.chars); const id=e.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
document.getElementById('pips').addEventListener('click',ev=>{const b=ev.target.closest('.pip'); if(!b) return; state.stage=D.stages[+b.dataset.i]; const id=b.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
let lastRoute=route();
window.addEventListener('hashchange',()=>{readShare();render(); if(route()!==lastRoute){lastRoute=route();window.scrollTo(0,0)}});
readShare();render();if(!bkPending)syncUrl();

</script>
