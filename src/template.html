<title>Evitania Checklist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
    --bg:#17152b; --surface:#272441; --sunk:#1f1c36; --ink:#f3eee0; --muted:#aaa4c8; --line:#454068;
  --accent:#f4c542; --accent-ink:#2a1c05; --accent-soft:#4a3e22; --link:#9ccbff; --violet:#6a4fd0; --violet-line:#8a74e6; --gold:#e79a2a; --shadow:#0e0c1d;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(#322e52,var(--surface));border-bottom:3px solid var(--shadow)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
h1{font-family:var(--font-head);font-size:23px;font-weight:700;margin:0;letter-spacing:.02em;color:var(--accent);text-shadow:0 2px 0 var(--shadow)}
h2{font-family:var(--font-head);font-size:21px;font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font-family:var(--font-head);font-size:17px;font-weight:600;margin:0;color:var(--accent);letter-spacing:.02em}
.stage{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-left:auto}
.slabel{color:var(--muted);font-family:var(--font-head);font-size:13px;text-transform:uppercase;letter-spacing:.08em}

.pip:hover{border-color:var(--violet-line);color:var(--ink)}
.pip.past{background:#8a5a14;border-color:#b8791a;color:#f6dfae}
.pip.cur{background:var(--gold);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent-ink),0 0 0 4px var(--accent);position:relative;z-index:1}
.sname{font-family:var(--font-head);font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--ink);min-width:9ch}

.sum{display:flex;flex-wrap:wrap;gap:6px}

.diff{min-width:36px;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums}
.p-good{color:var(--good);background:var(--good-bg)} .p-bad{color:var(--bad);background:var(--bad-bg)}
.p-warn{color:var(--warn);background:var(--warn-bg)} .p-idle{color:var(--idle);background:var(--idle-bg)}
nav.tabs{background:var(--sunk);border-bottom:2px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:9px 14px 7px;color:var(--muted);text-decoration:none;font-family:var(--font-head);font-size:16px;font-weight:500;letter-spacing:.04em;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.fb{margin-left:auto}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:12px}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.lead{color:var(--muted);max-width:68ch;margin:0}
.vhead{display:flex;flex-direction:column;gap:4px}.vhead h2{color:var(--accent);text-shadow:0 2px 0 var(--shadow)}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:7px 10px 9px 12px}
.tbar .reset{margin-left:auto}.tinfo{font-family:var(--font-head);font-size:15px;letter-spacing:.02em}.tbad{color:var(--bad);font-weight:600}.thint{font-size:12px;color:var(--muted)}
.prog{flex:1 1 120px;max-width:260px;height:10px;background:var(--bg);border:2px solid var(--line);border-radius:2px;overflow:hidden}.prog span{display:block;height:100%;background:var(--gold)}
.legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px;color:var(--muted)}.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:2px solid #4a4668;background:#35314f;margin-left:8px}.lg.full{border-color:#f4c542;background:#e79a2a}.lg.part{border:2px dashed #f4c542;background:#6a4fd0}.lg.none{opacity:.6}
.reset{font-family:var(--font-head);font-size:15px;font-weight:600;letter-spacing:.03em;padding:4px 14px;border:2px solid #b8791a;border-radius:var(--r);background:var(--gold);color:var(--accent-ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}.reset:hover:not(:disabled){background:var(--accent)}.reset:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}.reset:disabled{opacity:.45;cursor:default}
table.daily td.ck{width:36px;text-align:center}table.daily input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}table.daily label{cursor:pointer;font-weight:600}table.daily tr.done td:not(.ck){opacity:.5}table.daily tr.done label{text-decoration:line-through}
.later{margin:0;padding:0;list-style:none;color:var(--muted);font-size:13px}.later li{padding:5px 0;border-top:1px solid var(--line)}.later li:first-child{border-top:0}.later .lf{display:inline-block;min-width:110px;font-weight:600}
.char{margin-top:22px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;box-shadow:0 4px 0 var(--shadow)}
.chead{display:flex;align-items:center;gap:12px}.chead h2{margin:0;font-size:20px;flex:1 1 auto;min-width:0}.chead .lv{display:block;font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0;margin-top:1px}
.xbtn{flex:none;width:28px;height:28px;padding:0;font-size:13px;line-height:1;border:2px solid var(--line);border-radius:var(--r);background:var(--sunk);color:var(--muted);cursor:pointer}.xbtn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.cctl{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:12px;padding:10px 12px;background:var(--sunk);border:2px solid var(--line);border-radius:var(--r)}
.cgrp{display:flex;flex-direction:column;gap:4px;min-width:0}.clab{font-family:var(--font-head);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--bg);border:2px solid var(--line);border-radius:var(--r)}
.sg{display:inline-flex;align-items:center;font-family:var(--font-head);font-size:14px;font-weight:500;letter-spacing:.02em;padding:2px 9px;min-height:26px;border-radius:3px;border:2px solid #4a4668;background:#35314f;color:var(--muted);cursor:pointer;white-space:nowrap}
.sg:hover{border-color:var(--violet-line);color:var(--ink)}.sg.on{background:var(--gold);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.sg .ic{background-color:transparent;margin-right:5px;vertical-align:middle}
.cstep{height:32px}.cstep button{height:100%;width:28px}.cstep input{width:52px;height:100%;border:0;background:transparent;color:var(--ink);text-align:center;font-family:var(--font-head);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.cstep input::-webkit-outer-spin-button,.cstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cauto{font-size:11px;color:var(--muted)}.cautob{font:inherit;font-size:11px;color:var(--link);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline}
.treewrap{overflow-x:auto;margin:12px 0 4px;border-radius:var(--r);background:#201d38;border:2px solid var(--line)}
.tree{position:relative}.tree svg{position:absolute;inset:0}.tree line{stroke:#6b6790;stroke-width:2}.tree line.on{stroke:#f4c542;stroke-width:2.5}
.tn{position:absolute;width:46px;height:46px;border-radius:8px;border:3px solid #4a4668;background:#35314f;display:grid;place-items:center;opacity:.5}
.tn .ic.xl{width:36px;height:36px;margin:0;border-radius:4px;background-color:transparent}
.tn.full{border-color:#f4c542;background:#e79a2a;opacity:1}.tn.part{border-color:#f4c542;border-style:dashed;background:#6a4fd0;opacity:1}
.tn.skill{background:#1f4a57}.tn.skill.full{background:#1f6f7a}.tn .sk{font-size:22px;color:#b8f5e6;line-height:1}
.tn .ord{position:absolute;top:-9px;left:-9px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#2f6fde;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tn .rk{position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 2px #000;font-variant-numeric:tabular-nums}
.nextp{margin:8px 0 2px;font-size:13px}.np{display:inline-flex;align-items:center;gap:3px;margin:2px 10px 2px 0;white-space:nowrap}.np small{color:var(--muted)}
.bk{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:0 4px 0 var(--shadow)}
.bkrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bk input[type=text]{flex:1 1 220px;min-width:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px}
.bk textarea{width:100%;min-width:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--sunk);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;resize:vertical}
.filebtn{font-family:var(--font-head);font-size:15px;font-weight:600;letter-spacing:.03em;padding:4px 14px;border:2px solid var(--violet-line);border-radius:var(--r);background:var(--violet);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--shadow);position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.reset.ghost{background:var(--sunk);border-color:var(--line);color:var(--ink)}.reset.ghost:hover:not(:disabled){background:var(--idle-bg)}
.bkconf{border:2px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);padding:10px 12px}.bkconf p{margin:0 0 8px}
#bkmsg{font-size:13px;color:var(--warn);min-height:1.2em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.list{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 0 var(--shadow)}
.row{display:grid;grid-template-columns:180px max-content 40px minmax(0,1fr);gap:6px 14px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.divider{padding:6px 14px;font-family:var(--font-head);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line)}
.item{border-top:1px solid var(--line)}.item:first-child{border-top:0}.item .row{border-top:0}
.row button.name{font-size:18px;background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:6px}.chev{color:var(--muted);font-size:12px;width:10px}
.panel{padding:2px 14px 14px 14px;background:var(--sunk);border-top:2px solid var(--line)}.panel .sect:first-of-type{margin-top:16px}
.tools{display:flex;justify-content:flex-end;margin:10px 0}
.row .name{font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.row .name:hover{color:var(--accent)}
.row .next{min-width:0;color:var(--ink)}
.row .next small{display:block;color:var(--muted);font-size:12px}
.exp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;justify-self:start;width:max-content;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk);box-shadow:0 2px 0 var(--shadow)}
.step button{font-family:var(--font-head);font-size:16px;width:26px;height:26px;border:0;background:var(--violet);color:#fff;cursor:pointer;font-weight:700}
.step button:hover{background:var(--violet-line)}
.step output{min-width:32px;text-align:center;font-family:var(--font-head);font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:640px){ .row{grid-template-columns:minmax(0,1fr) auto auto} .row .next{grid-column:1/-1} }
.ic{display:inline-block;width:20px;height:20px;border-radius:3px;image-rendering:pixelated;background-color:var(--tile);background-repeat:no-repeat;background-size:calc(20px * /*COLS*/) auto;vertical-align:-5px;margin-right:4px;flex:none}
.ic.big{width:28px;height:28px;background-size:calc(28px * /*COLS*/) auto;margin:0;border-radius:6px}
.ic.xl{width:36px;height:36px;background-size:calc(36px * /*COLS*/) auto;margin:0;border-radius:3px;vertical-align:middle}
.slot{display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:6px;border:3px solid var(--violet-line);background:var(--violet);box-shadow:0 3px 0 var(--shadow)}.slot .ic.xl{background-color:transparent}
.slot.s-good{border-color:var(--accent);background:var(--gold)}.slot.s-idle{border-color:#4a4668;background:#35314f}.slot.s-idle .ic{opacity:.55}
.sysn{display:flex;align-items:center;gap:10px;min-width:0}
.term{white-space:nowrap}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.back{font-size:13px}
.ladder{list-style:none;margin:0;padding:0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.ladder li{border-top:1px solid var(--line)} .ladder li:first-child{border-top:0}
.rung{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;width:100%;text-align:left;font:inherit;font-size:13px;line-height:1.35;color:inherit;background:none;border:0;padding:5px 12px;cursor:pointer;align-items:start}
.rung:hover{background:#312d50}
.rung.more{display:block;text-align:center;color:var(--muted);font-size:12px;font-weight:600;padding:6px 12px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 12px)}.rung.more:hover{color:var(--ink)}

.num{width:22px;height:22px;font-family:var(--font-head);font-size:13px;border-radius:3px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--violet-line);color:#fff;background:var(--violet)}
.done .num{background:var(--gold);border-color:var(--accent);color:var(--accent-ink)}
.done .req{color:var(--muted)}
.need .num{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.rung .req{min-width:0}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:11px;color:var(--muted);padding:0 12px 6px 44px;margin-top:-2px}.rmeta a{color:var(--muted)}.rmeta a:hover{color:var(--link)}
details.about{margin-top:4px}details.about summary{cursor:pointer;font-family:var(--font-head);font-size:15px;color:var(--muted);padding:4px 0}details.about summary:hover{color:var(--ink)}details.about[open] summary{margin-bottom:8px}
.meta{display:inline-flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;color:var(--muted);margin-left:8px;vertical-align:1px}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px;font-weight:600;color:var(--muted)}
.tag.mine{border-style:dashed}
.stg{font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--sunk);color:var(--muted);white-space:nowrap}.stg.due{background:var(--bad-bg);color:var(--bad)}
.flag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.tbl{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:7px 12px;border-top:1px solid var(--line)}
thead th{border-top:0;background:var(--sunk);font-family:var(--font-head);font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix td,.matrix th{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix thead th:first-child{background:var(--sunk)}
.matrix .cur{background:var(--accent-soft);color:var(--ink);font-weight:700}
.matrix .when td{font-size:11px;color:var(--muted);white-space:normal;min-width:96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.cell{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.cell span:last-child{min-width:0;overflow-wrap:anywhere}
.sect{display:flex;flex-direction:column;gap:8px}
.sync{font-size:12px;color:var(--muted)}.sync:empty{display:none}
.note{color:var(--muted);font-size:13px;max-width:72ch;margin:0}
</style>

<header class="bar"><div class="wrap">
  <h1>Evitania Checklist</h1>
  <div class="stage" role="group" aria-label="My stage"><span class="slabel">Stage</span><div class="pips" id="pips"></div><span class="sname" id="sname"></span></div>
</div></header>
<nav class="tabs" aria-label="Views"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>

<script>
const D = /*DATA*/;
const SPRITE = "data:image/webp;base64,/*SPRITE*/";
const ICON_NAMES = /*ICONNAMES*/;
const TERMS = /*TERMS*/;
(function(){const s=document.createElement('style');s.textContent='.ic{background-image:url("'+SPRITE+'")}';document.head.appendChild(s)})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function icon(i,big){const sz=big==='xl'?36:big?28:20;return '<span class="ic'+(big==='xl'?' xl':big?' big':'')+'" role="img" aria-label="'+esc(ICON_NAMES[i])+'" style="background-position:-'+(i%/*COLS*/)*sz+'px -'+Math.floor(i//*COLS*/)*sz+'px"></span>'}
const termKeys=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
const termRe=new RegExp('(?<![A-Za-z])('+termKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z])','g');
function rich(t){ if(t===null||t===undefined) return ''; t=String(t); let out='',last=0,m; termRe.lastIndex=0;
  while((m=termRe.exec(t))){ out+=esc(t.slice(last,m.index))+'<span class="term">'+icon(TERMS[m[1]])+esc(m[1])+'</span>'; last=m.index+m[1].length }
  return out+esc(t.slice(last)) }
const ROLES=['Pusher','Material farmer','Rare-drop farmer','Leveller'];
const DEF_CHARS=[{cls:'Mage',role:'Material farmer',level:63},{cls:'Rogue',role:'Material farmer',level:53},{cls:'Warrior',role:'Pusher',level:66},{cls:'Rogue',role:'Material farmer',level:58}];
function cleanChars(a){if(!Array.isArray(a))return DEF_CHARS.map(c=>({...c}));return a.filter(c=>c&&D.trees[c.cls]).slice(0,8).map(c=>({cls:c.cls,role:ROLES.includes(c.role)?c.role:'Material farmer',level:Math.max(1,Math.min(200,parseInt(c.level)||1)),pts:null}))}
let state={stage:D.defaultStage,tiers:{},daily:[],chars:cleanChars(null)};
let syncMsg='';

function cleanTiers(){const o={};for(const s of D.systems){const v=state.tiers[s.name];if(Number.isInteger(v))o[s.name]=v}return o}
function commit(){saveLocal();render();syncUrl()}
function paintSync(){const el=document.getElementById('sync');if(el)el.textContent=syncMsg}
const stageIdx=()=>Math.max(0,D.stages.indexOf(state.stage));
const expected=n=>D.expect[n][stageIdx()];
const tierOf=n=>Number.isInteger(state.tiers[n])?state.tiers[n]:null;
const NST=D.stages.length;
const tierStageInt=(n,k)=>{const i=D.expect[n].findIndex(v=>v>=k);return i<0?NST+1:i+1};
function tierStage(n,k){const s=tierStageInt(n,k),tot=sysBy(n).tiers.length;let lo=k,hi=k;
  while(lo>1&&tierStageInt(n,lo-1)===s)lo--; while(hi<tot&&tierStageInt(n,hi+1)===s)hi++;
  return s-1+(k-lo+1)/(hi-lo+1)}
function stagePos(n,t){const tot=sysBy(n).tiers.length; if(t>=tot) return NST+1;
  const nx=tierStageInt(n,t+1); if(t===0) return nx-1;
  return tierStageInt(n,t)===nx?tierStage(n,t):nx-1}
const stageDiff=n=>stagePos(n,tierOf(n)===null?0:tierOf(n))-(stageIdx()+1);
function status(n){const t=tierOf(n),e=expected(n);
  if(t===null) return e===0?{k:'idle',t:'–',l:'Not needed yet'}:{k:'warn',t:'?',l:'Tier not set'};
  const d=Math.floor(stageDiff(n)+1e-9),w=x=>x+' stage'+(x===1?'':'s');
  if(d>0) return {k:'good',t:'+'+d,l:'Your tier is what is expected '+w(d)+' ahead'}; if(d===0) return {k:'good',t:'0',l:'On track for your stage'};
  return {k:'bad',t:'−'+(-d),l:w(-d)+' behind your stage'} }
const sysBy=n=>D.systems.find(s=>s.name===n);
function setTier(n,v){const max=sysBy(n).tiers.length; if(v===null||v<0) delete state.tiers[n]; else state.tiers[n]=Math.min(max,v); commit()}
const slug=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
function migrate(o){if(o&&Number.isInteger(o.Gear)&&o['Pusher gear']===undefined)o['Pusher gear']=o.Gear;return o||{}}

function route(){const h=(location.hash||'').replace('#','');const s=D.systems.find(s=>slug(s.name)===h);if(s){open.add(s.name);return 'checklist'}return VIEWS.some(v=>v[0]===h)?h:'checklist'}

      +'<div class="st">'+pill(st)+'</div>'

const sLabel=i=>i>NST?'After '+NST:'Stage '+i;
function ladderHTML(s){const key=slug(s.name),t=tierOf(s.name),e=expected(s.name),show=Math.max(e,t===null?0:t),all=true,hid=0;let h='<ol class="ladder">';
  s.tiers.forEach((x,i)=>{const k=i+1,done=t!==null&&k<=t,need=!done&&k<=e; if(k>show&&!all) return;

const DAILY_FROM={'Any':0,'Guild':0,'Act 1+':1,'Level 50+':2,'Act 2+':2,'Act 3':6};
const dailyStage=r=>DAILY_FROM[r[0]]??0;
const KNAME={skill:'Class skill',atk:'Attack',atkp:'Attack %',aspd:'Attack Speed',crit:'Crit Chance',critd:'Crit Damage',def:'Defence',mf:'Magicfind (Drop Quantity)',xp:'Bonus XP',move:'Movespeed',hp:'Max HP',mana:'Maximum Mana',mregen:'Mana Regen'};
const KEFF={atk:'+1 attack',atkp:'+1% attack',aspd:'+1% attack speed',crit:'+2% crit chance',critd:'+2% crit damage',def:'physical defence',mf:'+1 Drop Quantity',xp:'+5% combat XP',move:'+10% movement speed',hp:'+5 HP',mana:'+5 MP',mregen:'+1 MP regen'};
function nodeName(n){return n.n||KNAME[n.k]}
function nodeEff(cls,n){if(n.k==='skill')return 'class skill';let e=KEFF[n.k];if(cls==='Mage'&&n.k==='crit')e='+1% crit chance';if(cls==='Mage'&&n.k==='move')e='+5% movement speed';return e+' per rank'}
function buildOrder(cls,role){const T=D.trees[cls],by={};T.nodes.forEach(n=>by[n.o]=n);const base=T.nodes.map(n=>n.o).sort((a,b)=>a-b);
  if(role==='Pusher')return base.map(o=>by[o]);
  const pre={},gate=new Set();T.edges.forEach(([a,b])=>{const x=by[a].c<by[b].c||(by[a].c===by[b].c&&by[a].o<by[b].o)?[a,b]:[b,a];(pre[x[1]]=pre[x[1]]||[]).push(x[0]);gate.add(x[0])});
  if(role==='Material farmer'){const late=o=>(by[o].k==='mf'||by[o].k==='xp')&&!gate.has(o);return base.filter(o=>!late(o)).concat(base.filter(late)).map(o=>by[o])}
  const want=role==='Leveller'?o=>by[o].k==='xp':o=>by[o].k==='mf';
  const out=[],took=new Set();
  const add=o=>{if(took.has(o))return;took.add(o);out.push(by[o]);let more=true;while(more){more=false;for(const q of base){if(!took.has(q)&&want(q)&&(pre[q]||[]).some(p=>took.has(p))){took.add(q);out.push(by[q]);more=true}}}};
  base.forEach(add);return out}
function charPlan(c){const ord=buildOrder(c.cls,c.role),pts=c.pts===null||c.pts===undefined?Math.max(0,c.level-10):c.pts;let left=pts;const got={};const seq={};
  ord.forEach((n,i)=>{seq[n.o]=i+1;const g=Math.max(0,Math.min(n.m,left));got[n.o]=g;left-=g});
  return {ord,pts,got,seq,total:ord.reduce((a,n)=>a+n.m,0)}}
function treeHTML(c,ci){const T=D.trees[c.cls],P=charPlan(c),CW=66,RH=62,NS=46,PX=14,PY=16,W=PX*2+10*CW+NS,H=PY*2+3*RH+NS,by={};T.nodes.forEach(n=>by[n.o]=n);
  const cx=n=>PX+n.c*CW+NS/2,cy=n=>PY+n.y*RH+NS/2;
  let h='<div class="treewrap"><div class="tree" style="width:'+W+'px;height:'+H+'px"><svg width="'+W+'" height="'+H+'" aria-hidden="true">';
  for(const [a,b] of T.edges){const A=by[a],B=by[b],on=P.got[a]>0&&P.got[b]>0;h+='<line x1="'+cx(A)+'" y1="'+cy(A)+'" x2="'+cx(B)+'" y2="'+cy(B)+'" class="'+(on?'on':'')+'"/>'}
  h+='</svg>';
  for(const n of T.nodes){const g=P.got[n.o],st=g>=n.m?'full':g>0?'part':'none';
    const tip='Pick '+P.seq[n.o]+': '+nodeName(n)+', '+nodeEff(c.cls,n)+'. Expected now: '+g+' of '+n.m;
    h+='<div class="tn '+st+(n.k==='skill'?' skill':'')+'" style="left:'+(PX+n.c*CW)+'px;top:'+(PY+n.y*RH)+'px" title="'+esc(tip)+'" aria-label="'+esc(tip)+'" role="img">'
      +icon(n.i,'xl')+'<span class="ord">'+P.seq[n.o]+'</span><span class="rk">'+g+'/'+n.m+'</span></div>'}
  return h+'</div></div>'}
function vRoster(){let h='<div class="vhead"><h2>Characters</h2><p class="lead">Each character with the talents it should have by now. The small number on a node is its pick order; the figure at the bottom is expected ranks out of the maximum.</p></div>'

    const seg=(k,opts,cur,lab)=>'<div class="cgrp"><span class="clab">'+lab+'</span><div class="seg" role="group" aria-label="'+lab+'">'+opts.map((o,oi)=>'<button type="button" class="sg'+(o[0]===cur?' on':'')+'" id="c-'+k+'-'+ci+'-'+oi+'" data-act="cset" data-ci="'+ci+'" data-k="'+k+'" data-v="'+esc(o[0])+'" aria-pressed="'+(o[0]===cur)+'" title="'+esc(o[0])+'">'+o[1]+'</button>').join('')+'</div></div>';

    h+='<section class="char"><div class="chead"><span class="slot s-good">'+icon(clsIcon(c.cls),'xl')+'</span><h2>'+esc(c.role)+' '+esc(c.cls)+'<span class="lv">Level '+c.level+' &middot; '+ptsV+' talent points</span></h2><button type="button" class="xbtn" data-act="cdel" data-ci="'+ci+'" id="c-del-'+ci+'" aria-label="Remove this character" title="Remove this character">&#10005;</button></div>'
      +'<div class="cctl">'+seg('cls',Object.keys(D.trees).map(k=>[k,icon(clsIcon(k))+k]),c.cls,'Class')
      +seg('role',[['Pusher','Pusher'],['Material farmer','Materials'],['Rare-drop farmer','Rare drops'],['Leveller','Leveller']],c.role,'Role')
      +stp('level',c.level,'Level')+'</div>'

      +'<p class="nextp"><b>'+Math.min(P.pts,P.total)+' of '+P.total+' points placed.</b> '+(next.length?'Next picks: '+next.map(n=>'<span class="np">'+icon(n.i)+esc(nodeName(n))+' <small>'+P.got[n.o]+'/'+n.m+'</small></span>').join(' '):'Tree complete.')+'</p></section>'});
  h+='<div class="sect"><div class="tbl"><table><thead><tr><th>Topic</th><th>Rule</th><th>Basis</th><th>Source</th></tr></thead><tbody>'
    +D.roster.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+rich(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+srcLinks(r[3])+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h+'<div class="sync" id="sync">'+esc(syncMsg)+'</div>' }
let bkMsg='',bkPending=null;
function exportObj(){const t={},ct=cleanTiers();for(const k in ct)t[slug(k)]=ct[k];const did=new Map(D.daily.map(r=>[r[1],r[4]]));
  return {v:1,stage:slug(state.stage),tiers:t,daily:cleanDaily(state.daily).map(x=>did.get(x)),chars:cleanChars(state.chars).map(c=>[slug(c.cls),slug(c.role),c.level])}}
const unslug=(list,v)=>list.find(x=>slug(x)===v);
function parseBackup(txt){let o;try{o=JSON.parse(txt)}catch(e){throw new Error('That is not valid JSON.')}
  if(!o||typeof o!=='object'||Array.isArray(o)||o.v!==1) throw new Error('The file does not hold a checklist backup.');
  const tiers={},src=o.tiers&&typeof o.tiers==='object'?o.tiers:{};
  for(const s of D.systems){const v=src[slug(s.name)]; if(Number.isInteger(v)&&v>=0) tiers[s.name]=Math.min(v,s.tiers.length)}
  const byId=new Map(D.daily.map(r=>[r[4],r[1]]));
  const daily=Array.isArray(o.daily)?o.daily.map(x=>byId.get(x)):[];
  const chars=Array.isArray(o.chars)?o.chars.filter(Array.isArray).map(c=>({cls:unslug(Object.keys(D.trees),c[0]),role:unslug(ROLES,c[1]),level:c[2]})):null;
  return {stage:unslug(D.stages,o.stage)||state.stage,tiers,daily:cleanDaily(daily),chars:cleanChars(chars),when:''}}
const FEEDBACK_URL='https://github.com/tamatuk/evitania-checklist/issues/new';
const SH_CLS=['Warrior','Rogue','Mage'];
function shareCode(){const ct=cleanTiers(),done=new Set(cleanDaily(state.daily)),idOf=new Map(D.daily.map(r=>[r[4],r[1]]));
  let m=0;D.shareDaily.forEach((id,i)=>{if(done.has(idOf.get(id)))m+=2**i});
  return '1'+stageIdx().toString(36)+D.shareSys.map(n=>Number.isInteger(ct[n])?ct[n].toString(36):'z').join('')+'-'+m.toString(36)+'-'
    +cleanChars(state.chars).map(c=>SH_CLS.indexOf(c.cls)+''+ROLES.indexOf(c.role)+c.level.toString(36).padStart(2,'0')).join('')}
function parseShare(h){const m=/^1([0-9a-z])([0-9a-z]*)-([0-9a-z]+)-([0-9a-z]*)$/.exec(h); if(!m) throw new Error('That share link is not valid.');
  const si=parseInt(m[1],36); if(!(si<D.stages.length)) throw new Error('That share link is not valid.');
  const tiers={};D.shareSys.forEach((n,i)=>{const ch=m[2][i],s=sysBy(n); if(ch&&ch!=='z'&&s){tiers[n]=Math.min(parseInt(ch,36),s.tiers.length)}});
  const mask=parseInt(m[3],36),idOf=new Map(D.daily.map(r=>[r[4],r[1]])),daily=[];D.shareDaily.forEach((id,i)=>{if(Math.floor(mask/2**i)%2===1&&idOf.has(id))daily.push(idOf.get(id))});
  const chars=[];for(let i=0;i+4<=m[4].length;i+=4){chars.push({cls:SH_CLS[+m[4][i]],role:ROLES[+m[4][i+1]],level:parseInt(m[4].slice(i+2,i+4),36)})}
  return {stage:D.stages[si],tiers,daily:cleanDaily(daily),chars:cleanChars(chars),when:''}}
let shareSeen='';

function vBackup(){const json=JSON.stringify(exportObj());
  let h='<div class="vhead"><h2>Backup</h2><p class="lead">Save your stage, tiers, daily ticks and characters as a JSON file, or load them back. Importing replaces everything you have set on this page.</p></div>';
  h+='<div class="sect"><h3>Export</h3><div class="bk"><div class="bkrow">'+'<button type="button" class="reset" data-act="bkdl" id="bkdl">Download JSON</button>'+'<button type="button" class="reset" data-act="bkcopy" id="bkcopy">Copy JSON</button></div><textarea id="bkout" readonly rows="4" aria-label="Your values as JSON">'+esc(json)+'</textarea><div class="bkrow"><button type="button" class="reset" data-act="bklink" id="bklink">Copy link</button><input type="text" id="bkurl" readonly aria-label="Link that carries your values" value="'+esc(shareUrl())+'"></div></div></div>';
  h+='<div class="sect"><h3>Import</h3><div class="bk"><div class="bkrow"><label class="filebtn">Choose a JSON file<input type="file" id="bkfile" accept=".json,application/json"></label><span class="note">or paste the JSON below</span></div><textarea id="bkin" rows="6" placeholder="Paste exported JSON here" aria-label="JSON to import"></textarea><div class="bkrow"><button type="button" class="reset" data-act="bkread" id="bkread">Check import</button></div>';
  if(bkPending){const p=bkPending;h+='<div class="bkconf"><p><b>Ready to replace your values'+(p.when?' with the backup from '+esc(p.when):'')+':</b> stage '+esc(p.stage)+', '+Object.keys(p.tiers).length+' tiers set, '+p.daily.length+' daily ticks, '+p.chars.length+' characters.</p><div class="bkrow"><button type="button" class="reset" data-act="bkapply" id="bkapply">Replace my values</button><button type="button" class="reset ghost" data-act="bkcancel" id="bkcancel">Cancel</button></div></div>'}
  h+='</div></div>';
  return h+'<div class="sync" id="bkmsg" role="status">'+esc(bkMsg)+'</div><div class="sync" id="sync">'+esc(syncMsg)+'</div>' }
function bkSay(m){bkMsg=m;const e=document.getElementById('bkmsg');if(e)e.textContent=m}
function bkCheck(txt){try{bkPending=parseBackup(txt);bkMsg=''}catch(e){bkPending=null;bkMsg=e.message} const keep=txt;render();const i=document.getElementById('bkin');if(i)i.value=keep}
function vDaily(){const si=stageIdx(),done=new Set(state.daily);
  const rows=D.daily.map((r,i)=>[r,i]).filter(x=>dailyStage(x[0])<=si),later=D.daily.filter(r=>dailyStage(r)>si);
  const n=rows.filter(x=>done.has(x[0][1])).length;
  let h='<div class="vhead"><h2>Today&rsquo;s tasks</h2><p class="lead">Daily tasks for your stage, '+esc(state.stage)+'. Ticks stay until you press Reset.</p></div>'
    +'<div class="tbar"><span class="tinfo">'+n+' of '+rows.length+' done</span><span class="prog" role="img" aria-label="'+n+' of '+rows.length+' done"><span style="width:'+(rows.length?Math.round(100*n/rows.length):0)+'%"></span></span><button type="button" class="reset" id="dreset" data-act="dreset"'+(state.daily.length?'':' disabled')+'>Reset</button></div>';
  h+='<div class="sect"><div class="tbl"><table class="daily"><thead><tr><th><span class="vh">Done</span></th><th>Task</th><th>Why</th><th>From</th><th>Source</th></tr></thead><tbody>';
  rows.forEach(([r,i])=>{const on=done.has(r[1]);
    h+='<tr class="'+(on?'done':'')+'"><td class="ck"><input type="checkbox" id="dk'+i+'" data-act="dtick" data-i="'+i+'"'+(on?' checked':'')+'></td><td><label for="dk'+i+'">'+rich(r[1])+'</label></td><td>'+rich(r[2])+'</td><td>'+esc(r[0])+'</td><td>'+srcLinks(r[3])+'</td></tr>'});
  h+='</tbody></table></div></div>';
  if(later.length){h+='<div class="sect"><h3>Starts at a later stage</h3><ul class="later">'+later.map(r=>'<li><span class="lf">'+(dailyStage(r)+1)+' \u00b7 '+esc(D.stages[dailyStage(r)])+'</span> '+rich(r[1])+'</li>').join('')+'</ul></div>'}
  return h+'<div class="sync" id="sync">'+esc(syncMsg)+'</div>' }

function vIcons(){
  const groups=/*GROUPS*/;
  let h='<p class="lead">Every icon this page can show inline. Icons are the game&rsquo;s own art, taken from the evitania-online.com fan wiki&rsquo;s image files.</p>';
  for(const g of groups){h+='<div class="sect"><h3>'+g[0]+'</h3><div class="grid">';for(let i=g[1];i<g[2];i++)h+='<div class="cell">'+icon(i,true)+'<span>'+esc(ICON_NAMES[i])+'</span></div>';h+='</div></div>'}
  return h }

function vSources(){
  let h=tableHTML({title:'About this checklist',cols:['Topic','Note'],rows:D.about});
  h+='<div class="sect"><h3>Sources</h3><div class="tbl"><table><thead><tr><th>Source</th><th>Where</th><th>As of</th></tr></thead><tbody>';
  for(const s of D.sources)h+='<tr><td><a href="'+esc(s.link)+'">'+esc(s.name)+'</a></td><td>'+esc(s.where)+'</td><td>'+esc(s.asof)+'</td></tr>';
  return h+'</tbody></table></div></div>' }

function render(){const r=route();
  const si=stageIdx(); document.getElementById('pips').innerHTML=D.stages.map((s,i)=>'<button type="button" class="pip'+(i<si?' past':i===si?' cur':'')+'" id="pip'+i+'" data-i="'+i+'" aria-pressed="'+(i===si)+'" aria-label="Stage '+(i+1)+', '+esc(s)+'" title="'+esc(s)+'">'+(i+1)+'</button>').join(''); document.getElementById('sname').textContent=state.stage;

  document.getElementById('tabs').innerHTML=VIEWS.map(v=>'<a href="#'+v[0]+'"'+((r===v[0]||(v[0]==='checklist'&&!VIEWS.some(x=>x[0]===r)))?' aria-current="page"':'')+'>'+v[1]+'</a>').join('')+(FEEDBACK_URL?'<a class="fb" href="'+esc(FEEDBACK_URL)+'" target="_blank" rel="noopener">Feedback</a>':'');
  const m=document.getElementById('main');
  m.innerHTML = r==='checklist'?vChecklist(): r==='daily'?vDaily(): r==='roster'?vRoster(): r==='backup'?vBackup(): r==='icons'?vIcons(): vSources() }

document.getElementById('main').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]'); if(!b) return; const id=b.id;
  if(b.dataset.act==='dtick'){const k=D.daily[+b.dataset.i][1]; state.daily=b.checked?cleanDaily(state.daily.concat(k)):state.daily.filter(x=>x!==k); commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='dreset'){state.daily=[]; commit(); return}
  if(b.dataset.act==='bkcopy'){const ta=document.getElementById('bkout');const done=()=>bkSay('Copied to the clipboard.');const fall=()=>{ta.focus();ta.select();bkSay('Select all is on: press Ctrl or Cmd + C to copy.')};try{navigator.clipboard.writeText(ta.value).then(done,fall)}catch(e){fall()} return}
  if(b.dataset.act==='bklink'){const ta=document.getElementById('bkurl');const done=()=>bkSay('Link copied to the clipboard.');const fall=()=>{ta.focus();ta.select();bkSay('Select all is on: press Ctrl or Cmd + C to copy.')};try{navigator.clipboard.writeText(ta.value).then(done,fall)}catch(e){fall()} return}
  if(b.dataset.act==='bkdl'){const name='evitania-checklist.json';try{const u=URL.createObjectURL(new Blob([JSON.stringify(exportObj())],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);bkSay('Saved '+name+'.')}catch(e){bkSay('Could not download here. Use Copy JSON instead.')} return}
  if(b.dataset.act==='bkread'){bkCheck(document.getElementById('bkin').value); return}
  if(b.dataset.act==='bkcancel'){bkPending=null;bkMsg='Import cancelled. Nothing changed.';render();syncUrl(); return}
  if(b.dataset.act==='bkapply'){if(!bkPending)return;const p=bkPending;bkPending=null;state={stage:p.stage,tiers:p.tiers,daily:p.daily,chars:p.chars};bkMsg='Imported. Your values were replaced.';commit(); return}
  if(b.dataset.act==='cadd'){state.chars.push({cls:'Warrior',role:'Farmer',level:1,pts:null}); commit(); return}
  if(b.dataset.act==='cdel'){state.chars.splice(+b.dataset.ci,1); commit(); return}
  if(b.dataset.act==='cset'){const c=state.chars[+b.dataset.ci]; if(!c)return; c[b.dataset.k]=b.dataset.v; state.chars=cleanChars(state.chars); commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='cstep'){const c=state.chars[+b.dataset.ci]; if(!c)return; const d=+b.dataset.d; if(b.dataset.k==='level') c.level=Math.max(1,Math.min(200,c.level+d)); else {const cur=c.pts===null||c.pts===undefined?Math.max(0,c.level-10):c.pts; c.pts=Math.max(0,Math.min(400,cur+d))} commit(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='cauto'){const c=state.chars[+b.dataset.ci]; if(!c)return; c.pts=null; commit(); return}
  if(b.dataset.act==='later'){const s=b.dataset.sys; later.has(s)?later.delete(s):later.add(s); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='toggle'){const s=b.dataset.sys; open.has(s)?open.delete(s):open.add(s); saveOpen(); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='sort'){sortBy=b.dataset.v; saveSort(); render(); const a=document.getElementById(id); if(a) a.focus(); return}
  if(b.dataset.act==='openall'){open=open.size===D.systems.length?new Set():new Set(D.systems.map(s=>s.name)); saveOpen(); render(); return}
  const n=b.dataset.sys,t=tierOf(n);
  if(b.dataset.act==='inc') setTier(n,t===null?1:t+1);
  else if(b.dataset.act==='dec') setTier(n,t===null?null:(t===0?null:t-1));
  else if(b.dataset.act==='rung'){const k=+b.dataset.k; setTier(n,t===k?k-1:k)}
  const again=id&&document.getElementById(id); if(again) again.focus() });
document.getElementById('main').addEventListener('change',ev=>{const e=ev.target; if(e.id==='bkfile'){const f=e.files&&e.files[0]; if(!f)return; if(f.size>2e6){bkSay('That file is too large to be a checklist backup.');return} const r=new FileReader(); r.onload=()=>bkCheck(String(r.result)); r.onerror=()=>bkSay('Could not read that file.'); r.readAsText(f); return} if(!e.dataset||!e.dataset.ch) return; const c=state.chars[+e.dataset.ci]; if(!c) return; const k=e.dataset.ch;
  if(k==='cls'||k==='role') c[k]=e.value; else if(k==='level') c.level=Math.max(1,Math.min(200,parseInt(e.value)||1)); else if(k==='pts') c.pts=e.value===''?null:Math.max(0,Math.min(400,parseInt(e.value)||0));
  state.chars=cleanChars(state.chars); const id=e.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
document.getElementById('pips').addEventListener('click',ev=>{const b=ev.target.closest('.pip'); if(!b) return; state.stage=D.stages[+b.dataset.i]; const id=b.id; commit(); const a=document.getElementById(id); if(a) a.focus()});
let lastRoute=route();
window.addEventListener('hashchange',()=>{readShare();render(); if(route()!==lastRoute){lastRoute=route();window.scrollTo(0,0)}});
readShare();render();if(!bkPending)syncUrl();

</script>
